<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="แผนที่ไวยากรณ์ภาษาอังกฤษสำหรับคนไทย 250 บทเรียน คำอธิบายไทย ตัวอย่างพร้อมคำแปล และแบบทดสอบ">
<title>Grammar Notebook — สมุดไวยากรณ์ 250 บทเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#151a16;--bg2:#1b211c;--sf:#222a24;--sf2:#2a3430;
  --tx:#e4e2d8;--dm:#7d8a7f;--brd:#ffffff08;
  --t1:#2fb8a0;--t1l:#7dddc8;
  --t2:#dea02c;--t2l:#f0cc6a;
  --t3:#5aad3e;--t3l:#8fd07a;
  --t4:#cc7e4e;--t4l:#e8a87a;
  --t5:#8db860;--t5l:#b5d48e;
  --t6:#bfa058;--t6l:#dbc48a;
}
[data-theme="light"]{
  --bg:#f4f3ef;--bg2:#ffffff;--sf:#e8e7e3;--sf2:#dcdbd6;
  --tx:#1a1c19;--dm:#6b7168;--brd:#00000010;
}
html{font-size:15px;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Thai','Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;transition:background .3s,color .3s}

/* Topbar */
.topbar{display:flex;align-items:center;gap:.4rem;padding:.55rem .7rem;background:var(--bg2);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:50;transition:background .3s}
.tb-btn{width:32px;height:32px;border-radius:9px;border:none;background:var(--sf);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;flex-shrink:0;transition:background .2s}
.tb-btn:hover{background:var(--sf2)}
.tb-btn.hid{visibility:hidden}
.cr{display:flex;align-items:center;gap:.25rem;font-size:.7rem;color:var(--dm);overflow:hidden;white-space:nowrap;flex:1}
.cr span{cursor:pointer}.cr .sep{opacity:.3;cursor:default}.cr .cur{color:var(--tx);font-weight:600;cursor:default;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;gap:4px;flex-shrink:0}

/* Progress bar */
.pbar{height:3px;background:var(--sf);position:relative}
.pbar .fill{height:100%;transition:width .4s;border-radius:0 2px 2px 0}

/* Map area */
.mm-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:auto;padding:.6rem}
.mm-c{position:relative;width:100%;max-width:720px;aspect-ratio:1/1}
.mm-c.wide{aspect-ratio:5/3}
.mm-c.horiz{aspect-ratio:5/3}
.mm-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.mm-line{fill:none;stroke-width:2;stroke-linecap:round;opacity:0;animation:li .5s ease forwards}
@keyframes li{to{opacity:.4}}
.mm-n{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transform:translate(-50%,-50%) scale(0);animation:ni .4s cubic-bezier(.34,1.56,.64,1) forwards;transition:transform .15s;-webkit-user-select:none;user-select:none;line-height:1.25}
.mm-n:active{transform:translate(-50%,-50%) scale(.92)!important}
@keyframes ni{to{transform:translate(-50%,-50%) scale(1)}}
.nc{width:100px;height:100px;border-radius:50%;font-weight:700;font-size:.72rem;color:#fff;z-index:5}
.nc .sub{font-size:.5rem;font-weight:400;opacity:.7;margin-top:2px}
.nb{min-width:80px;max-width:120px;padding:8px 12px;border-radius:40px;font-weight:600;font-size:.6rem;color:#fff}
.nb .nth{font-size:.5rem;font-weight:400;opacity:.7;margin-top:1px}
.nb:hover{z-index:10}
.nl{min-width:72px;max-width:110px;padding:6px 10px;border-radius:28px;font-weight:600;font-size:.54rem;color:#fff}
.nl .nth{font-size:.44rem;font-weight:400;opacity:.65;margin-top:1px}
.nl .bkmk{position:absolute;top:-4px;right:-4px;font-size:.6rem}

/* Bottom nav */
.tnav{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border-top:1px solid var(--brd);scrollbar-width:none;transition:background .3s}
.tnav::-webkit-scrollbar{display:none}
.ch{flex-shrink:0;padding:5px 11px;border-radius:16px;font-size:.62rem;font-weight:600;cursor:pointer;border:1.5px solid;background:transparent;transition:background .15s;white-space:nowrap}
.ch:active{transform:scale(.93)}
.ch.on{color:#fff}
.ch-special{background:var(--sf)!important;border-color:var(--dm)!important;color:var(--tx)!important}

/* Sheet */
.obg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s;pointer-events:none}
.obg.show{opacity:1;pointer-events:auto}
.sht{position:fixed;bottom:0;left:0;right:0;z-index:101;background:var(--bg2);border-radius:16px 16px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1),background .3s;padding:0 0 env(safe-area-inset-bottom)}
.sht.show{transform:translateY(0)}
.sht::-webkit-scrollbar{width:3px}.sht::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:2px}
.sh-bar{width:32px;height:4px;border-radius:2px;background:var(--dm);opacity:.3;margin:8px auto 4px}
.sh-hd{padding:4px 16px 8px;border-bottom:1px solid var(--brd);display:flex;align-items:flex-start;justify-content:space-between}
.sh-hd-left h3{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700}
.sh-hd .sth{font-size:.72rem;color:var(--dm);margin-top:1px}
.sh-hd-btns{display:flex;gap:6px;padding-top:2px}
.sh-hd-btns button{width:30px;height:30px;border-radius:8px;border:1px solid var(--brd);background:var(--sf);color:var(--tx);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.sh-bd{padding:12px 16px 20px}
.s-sec{margin-bottom:12px}
.s-label{font-size:.58rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.s-label .ico{font-style:normal;font-size:.75rem}
.s-desc{font-size:.8rem;line-height:1.7;color:var(--tx)}
.s-form{background:var(--sf);border-radius:9px;padding:9px 12px;font-family:'Outfit',monospace;font-size:.72rem;line-height:1.6;border-left:3px solid;white-space:pre-wrap;transition:background .3s}
.s-ex{background:var(--sf);border-radius:9px;padding:9px 12px;font-size:.76rem;line-height:1.8;transition:background .3s}
.s-ex .hi{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.s-ex .trn{color:var(--dm);font-size:.7rem;font-style:italic}
.s-tip{background:var(--sf);border-radius:9px;padding:9px 12px;font-size:.76rem;line-height:1.7;border-left:3px solid #5aad3e88;transition:background .3s}
.s-mis{background:var(--sf);border-radius:9px;padding:9px 12px;font-size:.76rem;line-height:1.7;border-left:3px solid #cc7e4e88;transition:background .3s}
.s-sig{display:flex;flex-wrap:wrap;gap:4px}
.s-sig span{padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:500}
.sh-nav{display:flex;gap:6px;margin-top:14px;padding-top:10px;border-top:1px solid var(--brd)}
.sh-nav button{flex:1;padding:8px;border-radius:9px;border:1px solid;background:transparent;cursor:pointer;font-size:.68rem;font-family:inherit;transition:background .15s}
.sh-nav button:active{transform:scale(.96)}
.done-btn{width:100%;margin-top:10px;padding:9px;border-radius:9px;border:none;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;color:#fff;transition:opacity .2s}
.done-btn.learned{opacity:.5}

/* Search Overlay */
.search-ol{position:fixed;inset:0;z-index:200;background:var(--bg);padding:10px;transform:translateY(-100%);transition:transform .3s;display:flex;flex-direction:column}
.search-ol.show{transform:translateY(0)}
.search-top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search-top input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--brd);background:var(--sf);color:var(--tx);font-size:.85rem;font-family:inherit;outline:none}
.search-top button{padding:10px;border-radius:12px;border:none;background:var(--sf);color:var(--tx);cursor:pointer;font-size:.85rem}
.search-results{flex:1;overflow-y:auto}
.sr-item{padding:10px 12px;border-radius:10px;margin-bottom:6px;background:var(--sf);cursor:pointer;transition:background .15s}
.sr-item:active{background:var(--sf2)}
.sr-item h4{font-size:.78rem;font-weight:600}.sr-item p{font-size:.65rem;color:var(--dm);margin-top:2px}

/* Quiz Overlay */
.quiz-ol{position:fixed;inset:0;z-index:200;background:var(--bg);padding:16px;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s}
.quiz-ol.show{transform:translateY(0)}
.quiz-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.quiz-hd h3{font-size:1rem;font-weight:700}
.quiz-score{font-size:.75rem;color:var(--dm)}
.quiz-q{font-size:.88rem;line-height:1.6;margin-bottom:14px;font-weight:500}
.quiz-opts{display:flex;flex-direction:column;gap:8px;flex:1}
.quiz-opt{padding:12px 14px;border-radius:12px;border:2px solid var(--sf2);background:var(--sf);cursor:pointer;font-size:.8rem;text-align:left;font-family:inherit;color:var(--tx);transition:border-color .2s,background .2s}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.correct{border-color:#5aad3e;background:#5aad3e22}
.quiz-opt.wrong{border-color:#cc7e4e;background:#cc7e4e22}
.quiz-opt.reveal{border-color:#5aad3e;opacity:.6}
.quiz-explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sf);font-size:.76rem;line-height:1.6;display:none}
.quiz-next{margin-top:auto;padding:12px;border-radius:12px;border:none;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;color:#fff;display:none}

/* Special pages */
.sp-page{position:fixed;inset:0;z-index:200;background:var(--bg);padding:0;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s}
.sp-page.show{transform:translateX(0)}
.sp-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--brd)}
.sp-hd h3{font-size:.9rem;font-weight:700;flex:1}
.sp-search{padding:8px 14px}
.sp-search input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--brd);background:var(--sf);color:var(--tx);font-size:.8rem;font-family:inherit;outline:none}
.sp-body{flex:1;overflow-y:auto;padding:8px 14px}
.iv-row{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:4px;padding:8px 10px;border-radius:8px;font-size:.72rem;margin-bottom:3px;background:var(--sf)}
.iv-row.hdr{font-weight:700;background:var(--sf2);position:sticky;top:0}
.cw-card{background:var(--sf);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.cw-card h4{font-size:.82rem;font-weight:600;margin-bottom:4px}
.cw-card p{font-size:.74rem;line-height:1.6;color:var(--dm)}
.cw-card .cw-ex{margin-top:6px;font-size:.74rem;line-height:1.6;color:var(--tx)}

/* Layout toggle */
.layout-ind{font-size:.55rem;color:var(--dm);text-align:center;padding:2px}

@media(max-width:500px){
  .nc{width:76px;height:76px;font-size:.6rem}.nc .sub{font-size:.44rem}
  .nb{min-width:64px;max-width:98px;padding:6px 8px;font-size:.52rem}.nb .nth{font-size:.44rem}
  .nl{min-width:60px;max-width:92px;padding:5px 7px;font-size:.48rem}.nl .nth{font-size:.4rem}
}
/* V5: readable lessons and paged maps for the expanded curriculum. */
html{font-size:16px}
body{min-height:100dvh}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--t1);outline-offset:4px}
.topbar{gap:8px;padding:10px 12px}.tb-btn{width:40px;height:40px}.cr{font-size:.875rem;gap:5px}
.mm-area{display:block;padding:16px;overflow:auto;min-height:0}
.mm-c{width:100%;max-width:760px;min-width:540px;aspect-ratio:1;margin:0 auto}
.mm-c.horiz{min-width:340px;aspect-ratio:auto}
.nc{width:132px;height:132px;font-size:.95rem}.nc .sub{font-size:.75rem;opacity:.85}
.nb,.nl{width:156px;min-width:0;max-width:none;padding:12px 10px;font-size:.875rem;border-radius:22px;line-height:1.4}
.nb .nth,.nl .nth{font-size:.75rem;opacity:.9;margin-top:4px}.mm-n{color:#101b14}
.nl .bkmk{font-size:1rem;top:-10px;right:-4px}
.tnav{position:sticky;bottom:0;z-index:45;padding:10px;gap:8px}.ch{font-size:.875rem;padding:8px 12px;min-height:40px}
.layout-ind{font-size:.875rem;padding:12px 16px;line-height:1.8;background:var(--bg2);border-top:1px solid var(--brd)}
.map-pager{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}.map-pager button,.quick-start{border:1px solid var(--brd);background:var(--sf);color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer}.map-pager button:disabled{opacity:.4;cursor:default}
.quick-start{color:var(--t1);margin:6px}.storage-warning{color:var(--t4)}
.sht{max-width:900px;margin:auto;max-height:90dvh}.sh-hd{padding:12px 20px;gap:12px}.sh-hd-left h3{font-size:1.3rem}.sh-hd .sth{font-size:.95rem}.sh-hd-btns{flex-shrink:0}.sh-hd-btns button{width:38px;height:38px}.sh-bd{padding:18px 20px 28px}
.s-sec{margin-bottom:20px}.s-label{font-size:.875rem;margin-bottom:8px}.s-label .ico{font-size:1rem}.s-desc,.s-form,.s-ex,.s-tip,.s-mis{font-size:1rem;line-height:1.85;overflow-wrap:anywhere}.s-form{white-space:normal}.s-ex .trn{display:block;font-size:.95rem;color:var(--dm);font-style:normal}.s-ex>br{display:none}.s-ex .hi{font-weight:700}
.s-sig span{font-size:.875rem;padding:5px 10px}.sh-nav{flex-wrap:wrap}.sh-nav button{font-size:.875rem;min-width:140px}.done-btn{font-size:1rem;padding:12px}.level-tag{display:inline-block;margin-top:8px;background:var(--sf);color:var(--dm);border-radius:20px;padding:3px 10px;font-size:.8rem}.lesson-sources a{color:var(--t1);font-size:.875rem}
.search-ol,.quiz-ol{padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto}.search-top{flex-wrap:wrap}.search-top input{min-width:160px;font-size:1rem}.search-top button{font-size:1rem}.search-filter{background:var(--sf);color:var(--tx);border:1px solid var(--brd);border-radius:10px;padding:10px;max-width:100%}
.sr-item h4{font-size:1rem}.sr-item p{font-size:.875rem}.search-summary{font-size:.875rem;color:var(--dm);padding:8px 4px}.sr-item{width:100%;border:0;color:var(--tx);text-align:left}.empty-state{padding:24px;color:var(--dm);text-align:center;font-size:1rem}
.quiz-q{font-size:1.1rem}.quiz-opts{flex:0 0 auto}.quiz-opt,.quiz-explain,.quiz-next{font-size:1rem}.quiz-score{font-size:.875rem}.quiz-next{margin-top:16px}.quiz-opt:disabled{cursor:default;color:var(--tx)}.quiz-result{text-align:center;padding:32px 12px}.quiz-result strong{display:block;font-size:3rem;color:var(--t3)}
.sp-hd h3{font-size:1rem}.sp-body{padding:12px 16px}.sp-search input{font-size:1rem}.iv-row{font-size:.875rem;padding:10px 8px;overflow-wrap:anywhere;grid-template-columns:1fr 1.3fr 1.4fr 1.2fr}.cw-card h4{font-size:1.1rem}.cw-card p,.cw-card .cw-ex{font-size:1rem;line-height:1.8}.cw-ex .trn{color:var(--dm);display:block}.reference-note{font-size:.875rem;line-height:1.7;color:var(--dm);padding:10px 0}
.nc .overview-cue{display:block;font-size:.7rem;font-weight:600;margin-top:5px;border-top:1px solid #101b1433;padding-top:4px}
.nc:hover{box-shadow:0 0 0 4px var(--sf2)}
.ov-crumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}

.ov-title{display:block;font-weight:700;font-size:1rem}.ov-meta{display:block;color:var(--dm);font-size:.875rem;margin:4px 0 8px}.ov-summary{display:block;font-size:.95rem;line-height:1.8;overflow-wrap:anywhere}

/* V7 — a quiet notebook, with the original map one click away. */
:root{--paper:#202720;--desk:#151a16;--ink-line:#a8ba9620;--note:#2a3428;--dm:#abb6a7;--brd:#a8ba9626}
[data-theme=light]{--bg:#ebe8df;--bg2:#faf8f0;--sf:#efeee3;--sf2:#e5e6d7;--tx:#29372e;--dm:#626d5e;--brd:#66784b26;--paper:#fffdf5;--desk:#ebe8df;--ink-line:#81926422;--note:#f2f1df}
[hidden]{display:none!important}
body{background:var(--desk)}
.topbar{padding:12px 24px;min-height:68px;background:var(--bg2)}
.brand{border:0;background:none;color:var(--tx);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{border:1px solid var(--t1);border-radius:5px;padding:4px 9px;font-family:Georgia,serif;font-size:23px;color:var(--t1)}
.brand strong{display:block;font-family:Georgia,serif;font-size:19px;font-weight:normal}.brand small{font-size:12px;color:var(--dm);letter-spacing:.12em}
.view-switch{display:flex;border:1px solid var(--brd);padding:3px;border-radius:10px;gap:3px;background:var(--desk)}
.view-switch button{border:0;padding:7px 12px;border-radius:7px;color:var(--dm);background:none;cursor:pointer;font-size:14px}.view-switch button[aria-pressed=true]{background:var(--paper);color:var(--tx);box-shadow:0 1px 4px #0001}
.book-shell{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1480px;width:100%;margin:0 auto;flex:1}
.book-toc{border-right:1px solid var(--brd);padding:28px 18px;position:sticky;top:68px;height:calc(100dvh - 68px);overflow:auto;scrollbar-width:thin}
.toc-label{font-size:14px;letter-spacing:.12em;color:var(--dm);margin:0 10px 18px}.toc-root,.toc-overview,.toc-lesson,.toc-start{width:100%;border:0;text-align:left;color:var(--tx);background:transparent;cursor:pointer;padding:10px;border-radius:6px;font-size:14px;line-height:1.65}
.toc-root{font-weight:600}.toc-start{margin:10px 0 20px;background:var(--note);border:1px solid var(--brd);color:var(--t1)}
.toc-topic{border-top:1px solid var(--brd);padding:8px 0}.toc-topic summary,.toc-branch summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-size:14px;padding:9px 8px;line-height:1.65}.toc-topic summary::-webkit-details-marker,.toc-branch summary::-webkit-details-marker{display:none}.toc-topic>summary:after,.toc-branch>summary:after{content:'+';margin-left:auto;color:var(--dm)}.toc-topic[open]>summary:after,.toc-branch[open]>summary:after{content:'−'}
.chapter-number{font-family:Georgia,serif;color:var(--accent);font-size:17px}.toc-branch{margin-left:13px;border-left:1px solid var(--brd);padding-left:8px}.toc-branch summary{color:var(--dm)}.toc-overview{color:var(--dm)}.toc-lesson{padding-left:15px;display:flex;gap:8px;align-items:baseline}.toc-lesson span:first-child{color:var(--dm);font-size:12px;min-width:15px}.toc-lesson[aria-current=page],.toc-overview[aria-current=page],.toc-root[aria-current=page]{background:var(--note);color:var(--t1);box-shadow:inset 3px 0 var(--t1)}
.toc-root:hover,.toc-overview:hover,.toc-lesson:hover,summary:hover{background:var(--note)}
.book-workspace{padding:26px clamp(16px,4vw,64px) 60px;min-width:0}
.reading-tools{max-width:850px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--dm);font-size:14px}.reading-tools button{border:1px solid var(--brd);background:var(--bg2);color:var(--tx);padding:7px 11px;border-radius:6px;cursor:pointer;font-size:14px}.reading-tools button[aria-pressed=true]{border-color:var(--t1);color:var(--t1)}
.paper{background:var(--paper);max-width:850px;margin:auto;border:1px solid var(--brd);border-radius:3px;box-shadow:4px 4px 0 var(--desk),5px 5px 0 var(--brd),0 14px 40px #0000000b;position:relative;padding:28px clamp(20px,5vw,66px) 20px;--read-size:17px}
.paper:before{content:'';position:absolute;top:-1px;right:32px;width:22px;height:45px;background:var(--t1);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.8}
.paper-running{font-size:12px;color:var(--dm);letter-spacing:.15em;border-bottom:1px solid var(--brd);padding-bottom:14px;margin-bottom:24px;padding-right:28px}
.paper .sh-hd{padding:0 0 25px;gap:16px;flex-wrap:wrap}.paper .sh-hd-left h3{font-family:Georgia,'IBM Plex Sans Thai',serif;font-size:clamp(28px,4vw,42px);line-height:1.25;font-weight:normal;letter-spacing:-.02em}.paper .sth{font-size:17px;line-height:1.8;margin-top:8px}.paper .level-tag{border-radius:3px;font-size:14px;background:var(--note);margin-top:15px}.paper .sh-hd-btns button{border-radius:50%;background:transparent;width:40px;height:40px}
.paper .sh-hd-btns button[onclick="csht()"]{display:none}
.paper .sh-bd{padding:28px 0 10px}.paper .s-sec{margin-bottom:30px}.paper .s-label{font-size:14px;font-weight:600;letter-spacing:.02em;margin-bottom:12px}.paper .s-desc,.paper .s-form,.paper .s-ex,.paper .s-tip,.paper .s-mis{font-size:var(--read-size);line-height:2;overflow-wrap:anywhere}.paper .s-desc b{font-weight:600}
.paper .s-form{background:var(--note);border-radius:2px;padding:20px 22px;border-left:3px solid var(--t2);font-family:'Outfit','IBM Plex Sans Thai',sans-serif}
.paper .s-ex{background:repeating-linear-gradient(transparent,transparent calc(2em - 1px),var(--ink-line) calc(2em - 1px),var(--ink-line) 2em);border-radius:0;border-left:2px solid #cc7e4e50;padding:0 0 0 20px}.paper .s-ex .trn{font-size:calc(var(--read-size) - 1px);line-height:2.15;margin-bottom:14px}.paper .hi{background:#dea02c28;text-decoration:none;padding:0 2px}
.paper .s-tip,.paper .s-mis{padding:18px 22px;border-radius:2px;background:var(--note)}.paper .s-mis{background:#cc7e4e0c}.paper .ov-crumbs button{border-radius:4px;background:transparent}.paper .ov-grid{gap:0}.paper .ov-card{background:transparent;border:0;border-top:1px solid var(--brd);border-radius:0;padding:20px 0}.paper .ov-card:hover{background:var(--note)}.paper .ov-title{font-family:Georgia,'IBM Plex Sans Thai',serif;font-size:21px;font-weight:normal}.paper .ov-summary{font-size:var(--read-size);line-height:1.9}.paper .ov-meta{font-size:14px;margin:7px 0}.paper .done-btn{border-radius:5px;margin-top:26px}.paper .done-btn.learned{opacity:1;background:var(--note)!important;color:var(--tx)!important;border:1px solid var(--brd)}.paper .sh-nav button{border-radius:4px;padding:12px}.paper-footer{border-top:1px solid var(--brd);padding-top:16px;text-align:center;color:var(--dm);font-family:Georgia,'IBM Plex Sans Thai',serif;font-size:14px;line-height:1.8}.book-progress{color:var(--dm);font-size:14px;line-height:1.9;margin:22px 10px}.book-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}.book-tools button{border:1px solid var(--brd);padding:8px;border-radius:5px;background:transparent;color:var(--tx);font-size:14px;cursor:pointer}.mobile-toc{display:none!important}
body[data-view=reader]>.tnav,body[data-view=reader]>.mm-area,body[data-view=reader]>.layout-ind{display:none}
.skip-link{position:fixed;left:16px;top:-100px;z-index:500;background:var(--paper);color:var(--tx);padding:12px}.skip-link:focus{top:10px}
@media(max-width:800px){.topbar{padding:10px 14px;flex-wrap:wrap;gap:10px}.brand{flex:1}.brand small{font-size:11px}.tb-right{margin-left:auto}.view-switch button{padding:7px 10px}.book-shell{display:block}.book-toc{display:none;position:static;height:auto;max-height:65dvh;border-bottom:1px solid var(--brd);background:var(--bg2);padding:20px}.book-shell.toc-open .book-toc{display:block}.mobile-toc{display:inline-flex!important}.book-workspace{padding:18px 12px 35px}.paper{padding:24px 24px 20px}.reading-tools{gap:8px}.paper .sh-hd-left h3{font-size:30px}.paper .s-tip,.paper .s-mis,.paper .s-form{padding:16px}.book-toc .book-tools{position:sticky;bottom:-20px;background:var(--bg2);padding:8px 0}.topbar .cr{max-width:none;flex-basis:100%;order:3}.paper-running{font-size:11px}}
@media(max-width:420px){.brand strong{font-size:17px}.brand-mark{font-size:20px}.brand small{display:none}.topbar .tb-btn{width:36px;height:36px}.paper{padding:22px 18px 18px}.paper .sh-hd-left h3{font-size:27px}.reading-tools>span{width:100%}}

.paper{scroll-margin-top:105px}

/* V8: ruled paper in both views and a shared font selector. */
:root{--notebook-rule:#9ebba629;--notebook-margin:#cc7e4e45}
[data-theme=light]{--notebook-rule:#507a6930;--notebook-margin:#cc7e4e55}
.paper,.sht{
  --rule-gap:calc(var(--read-size,17px) * 2);
  background-color:var(--paper);
  background-image:linear-gradient(to right,transparent 13px,var(--notebook-margin) 13px,var(--notebook-margin) 14px,transparent 14px),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule-gap) - 1px),var(--notebook-rule) calc(var(--rule-gap) - 1px),var(--notebook-rule) var(--rule-gap));
  background-position:0 0;background-size:auto;background-repeat:repeat;
}
.mm-area{
  background-color:var(--paper);
  background-image:linear-gradient(to right,transparent 23px,var(--notebook-margin) 23px,var(--notebook-margin) 24px,transparent 24px),repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--notebook-rule) 33px,var(--notebook-rule) 34px);
  background-attachment:local;
  border:1px solid var(--brd);border-radius:4px;margin:16px 20px 10px;
  box-shadow:3px 3px 0 var(--desk),4px 4px 0 var(--brd);
}
.paper .s-ex{background:transparent}
.font-picker{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--dm);flex-shrink:0}
.font-picker select{background:var(--paper);border:1px solid var(--brd);border-radius:8px;padding:8px 28px 8px 10px;color:var(--tx);font-size:14px;min-height:40px;max-width:180px;cursor:pointer}
.font-picker option{background:var(--paper);color:var(--tx)}
body[data-font=handwritten]{font-family:'Mali Notebook','IBM Plex Sans Thai',sans-serif}
body[data-font=handwritten] :is(button,input,select,.brand strong,.brand-mark,.chapter-number,.paper-running,.paper-footer,.sh-hd-left h3,.s-form,.ov-title){font-family:'Mali Notebook','IBM Plex Sans Thai',sans-serif}
body[data-font=handwritten] .paper .sh-hd-left h3{font-weight:700;letter-spacing:0;line-height:1.5}
body[data-font=handwritten] .mm-n{line-height:1.5;overflow-wrap:anywhere}
body[data-font=handwritten] .brand small{letter-spacing:0}
@media(min-width:801px){.topbar{flex-wrap:wrap}.topbar .cr{flex-basis:100%}}
@media(max-width:800px){.font-picker{order:4;flex:1}.font-picker select{flex:1;max-width:240px}.mm-area{margin:12px 10px}.topbar .cr{order:5}.paper{scroll-margin-top:170px}.book-toc{scroll-margin-top:170px}}
@media(max-width:420px){.paper{background-image:linear-gradient(to right,transparent 8px,var(--notebook-margin) 8px,var(--notebook-margin) 9px,transparent 9px),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule-gap) - 1px),var(--notebook-rule) calc(var(--rule-gap) - 1px),var(--notebook-rule) var(--rule-gap))}}

</style>

const OVERVIEW_TOPICS={
  1:{desc:'<b>Parts of Speech คือชนิดของคำตามหน้าที่ที่คำนั้นทำในประโยค</b> เช่น คำนามใช้เรียกคนหรือสิ่งต่าง ๆ กริยาบอกการกระทำหรือสภาวะ และคุณศัพท์บอกลักษณะของนาม การแบ่งแบบดั้งเดิมที่ใช้ในหมวดนี้มี 8 ชนิด\n\nคำหนึ่งไม่ได้มีชนิดเดียวตลอดทุกบริบท เช่น <b>a clean room</b> ใช้ clean เป็นคุณศัพท์ขยายห้อง แต่ <b>I clean my room.</b> ใช้ clean เป็นกริยา ดังนั้นต้องดูคำรอบข้างและหน้าที่จริง ไม่เดาจากคำแปลไทยหรือคำลงท้ายอย่างเดียว\n\nชนิดคำต่างจากหน้าที่ในประโยค: <b>noun</b> เป็นชนิดคำ แต่ <b>subject</b> เป็นหน้าที่ คำนามจึงเป็นทั้งประธาน กรรม หรือส่วนเติมเต็มได้ ส่วน Articles และ Quantifiers ซึ่งเป็นกลุ่มคำกำหนดนาม มีบทแยกใน Special Rules',purpose:'ใช้เลือกคำให้ถูกตำแหน่ง เช่น good singer แต่ sings well และช่วยแยกว่าเมื่อไรต้องมี be, กรรม หรือบุพบทตามหลัง เมื่ออ่านศัพท์ใหม่ควรจดทั้งความหมาย ชนิดคำ และตัวอย่างที่ใช้จริง',steps:'เริ่ม Nouns และ Pronouns เพื่อรู้ว่ากำลังพูดถึงใคร/อะไร → Verbs เพื่อบอกสิ่งที่เกิด → Adjectives และ Adverbs เพื่อเพิ่มรายละเอียด → Prepositions และ Conjunctions เพื่อเชื่อมความสัมพันธ์ → Interjections สำหรับอารมณ์ในบทสนทนา',ex:'She has a <hi>clean</hi> room. <span class="trn">(เธอมีห้องสะอาด: clean ขยายคำนาม room)</span>\nShe <hi>cleans</hi> her room. <span class="trn">(เธอทำความสะอาดห้อง: cleans เป็นกริยา)</span>'},
  2:{desc:'<b>Tenses & Aspects คือการใช้รูปกริยาเพื่อบอกเวลาและมุมมองต่อเหตุการณ์</b> ต้องแยกสองคำถาม: เหตุการณ์อยู่ช่วงไหน และผู้พูดมองว่าเป็นข้อเท็จจริง กำลังดำเนิน หรือเกิดก่อนจุดอ้างอิงแล้ว\n\n<b>Simple</b> มักมองข้อเท็จจริง กิจวัตร หรือเหตุการณ์โดยรวม; <b>Continuous</b> มองระหว่างกำลังดำเนิน; <b>Perfect</b> เชื่อมสิ่งก่อนหน้ากับจุดอ้างอิง; <b>Perfect Continuous</b> เน้นกระบวนการหรือระยะเวลาที่ดำเนินมาก่อนจุดนั้น\n\nตาราง 12 รูปเป็นเครื่องมือช่วยเรียนที่ใช้กันมาก แต่การพูดถึงอนาคตยังใช้ going to, Present Continuous และ Present Simple ได้ตามความหมาย คำอย่าง now, for, since เป็นเบาะแส ไม่ใช่คำสั่งให้เลือก tense เดียวเสมอ',purpose:'ใช้แยกความหมาย เช่น ทำทุกวัน กำลังทำ ทำเสร็จแล้ว หรือทำมาก่อนอีกเหตุการณ์ การเลือกให้ถูกต้องเริ่มจากความหมายที่ต้องการสื่อ แล้วค่อยตรวจสูตร ประธาน และรูปกริยา',steps:'1. เลือกจุดเวลา: ตอนนี้ อดีต หรืออนาคต\n2. เลือกมุมมอง: ทั่วไป กำลังดำเนิน เสร็จ/ก่อนจุดอ้างอิง หรือเน้นระยะเวลา\n3. สร้างรูปบอกเล่าให้ครบ แล้วฝึกเปลี่ยนเป็นปฏิเสธและคำถาม\n4. อ่าน Tense Comparisons เมื่อสองรูปดูใช้คล้ายกัน',ex:'I <hi>work</hi> every day. <span class="trn">(ฉันทำงานทุกวัน: กิจวัตร)</span>\nI <hi>am working</hi> now. <span class="trn">(ฉันกำลังทำงานตอนนี้: ระหว่างดำเนิน)</span>'},
  3:{desc:'<b>Sentence Structures คือวิธีประกอบคำให้เป็นข้อความที่มีโครงสร้างและความหมายครบ</b> ประโยคบอกเล่าทั่วไปเริ่มจากประธาน ตามด้วยกริยา และส่วนอื่นที่กริยานั้นต้องการ เช่น กรรม หรือส่วนเติมเต็ม ไม่ใช่ทุกประโยคต้องมีกรรม แต่ต้องครบตามรูปแบบของกริยา\n\n<b>Phrase หรือวลี</b> เป็นกลุ่มคำ เช่น the small bag ส่วน <b>clause หรืออนุประโยค</b> มีโครงสร้างประธานกับกริยาในรูปพื้นฐาน และอาจเป็นส่วนที่ยืนได้เองหรือพึ่งส่วนอื่น การนับ clause ช่วยแยก Simple, Compound, Complex และ Compound-Complex ได้แม่นกว่าการนับจำนวนคำกริยา\n\nหมวดนี้ยังสอนการถาม การตอบ การสั่ง การเชื่อมความคิด และการแก้ประโยคขาดหรือคำขยายกำกวม สำหรับผู้เริ่มต้นจากศูนย์ ควรเริ่มที่ Start Here ก่อนหมวดอื่น',purpose:'ใช้สร้างประโยคจากความคิดภาษาไทยโดยไม่แปลเรียงคำตรงตัวทุกคำ และช่วยตรวจว่าข้อความมีใคร/อะไรเป็นประธาน กริยาครบหรือยัง และคำขยายกำลังอธิบายส่วนไหน',steps:'Start Here → Sentence Patterns → Questions & Answers → Phrases และ Clauses → Sentence Types → Clear Sentences → Emphasis & Ellipsis ตามลำดับ ความยาวของประโยคไม่ใช่ตัวชี้วัดว่าดี เริ่มจากสั้นและชัดก่อน',ex:'<hi>The baby sleeps.</hi> <span class="trn">(ทารกหลับ: ประธาน + กริยา ไม่ต้องมีกรรม)</span>\n<hi>May reads a book.</hi> <span class="trn">(เมย์อ่านหนังสือ: ประธาน + กริยา + กรรม)</span>'},
  4:{desc:'<b>Verb Forms & Voices คือรูปของกริยาและวิธีจัดมุมมองว่าใครทำหรือใครรับการกระทำ</b> กริยาเดียวมีหลายรูป เช่น write, writes, wrote, written, writing แต่ละรูปใช้คนละตำแหน่ง ไม่สามารถแทนกันได้เพียงเพราะแปลว่าเขียนเหมือนกัน\n\n<b>Active</b> วางผู้ทำเป็นประธาน ส่วน <b>Passive</b> วางผู้รับการกระทำเป็นประธาน อีกกลุ่มคือรูปกริยาที่ตามหลังคำอื่น เช่น want to learn แต่ enjoy learning รวมถึง participles ที่ใช้ขยายนามหรือย่อข้อความ\n\nกริยาช่วย เช่น can, must, should เพิ่มความหมายเรื่องความสามารถ หน้าที่ หรือท่าที ขณะที่ phrasal verbs และ causatives เป็นกลุ่มรูปแบบที่ต้องจำพร้อมประโยคตัวอย่าง ไม่ใช่จำเฉพาะคำเดี่ยว',purpose:'ใช้ตอบคำถามว่า “ตรงนี้ต้องเป็น V1, V2, V3, to V หรือ V-ing?” และเลือกว่าจะเน้นผู้ทำ ผู้รับ หรือการให้คนอื่นทำให้ ความเข้าใจเรื่องนี้ช่วยลดข้อผิดพลาดอย่าง can swims, enjoy to read และ was wrote',steps:'ทบทวน Verb Spelling และกริยา 3 ช่อง → แยก Active/Passive → ฝึก Infinitives/Gerunds → เรียน Modal Meanings → เพิ่ม Phrasal Verbs และ Causatives ส่วน Participles และ Subjunctive ใช้ต่อยอดเมื่อโครงสร้างพื้นฐานคล่องแล้ว',ex:'May <hi>wrote the letter</hi>. <span class="trn">(เมย์เขียนจดหมาย: เน้นผู้ทำ)</span>\nThe letter <hi>was written by May</hi>. <span class="trn">(จดหมายถูกเขียนโดยเมย์: เน้นจดหมาย)</span>'},
  5:{desc:'<b>Special Rules คือกลุ่มกฎที่เกี่ยวข้องกับคำหรือโครงสร้างมากกว่าหนึ่งส่วนในประโยค</b> คำว่า “พิเศษ” ในแอปนี้เป็นชื่อหมวด ไม่ได้แปลว่าทุกบทเป็นข้อยกเว้นหรือยากเสมอไป เช่น Articles, Quantifiers และ S-V Agreement เป็นพื้นฐานที่ใช้แทบทุกวัน\n\nบางกลุ่มช่วยจัดการคำนามและจำนวน บางกลุ่มช่วยเชื่อมเงื่อนไขหรือถ่ายทอดคำพูด และบางกลุ่มใช้สมมติสิ่งที่ไม่จริงหรือเน้นข้อความ เช่น Wishes และ Inversion สิ่งสำคัญคือเลือกโครงสร้างตามความหมายทั้งประโยค\n\nกฎหลายเรื่องมีบริบทและข้อยกเว้น เช่น Reported Speech ไม่ต้องถอย tense ทุกครั้ง และรูปอดีตใน If I were you ไม่ได้เล่าเวลาอดีต จึงควรอ่านเหตุผลและตัวอย่างเปรียบเทียบควบคู่สูตร',purpose:'ใช้ตรวจจุดที่แปลไทยตรงตัวแล้วมักผิด เช่น ประธานกับกริยาไม่ตรงกัน คำนำหน้านามหาย เล่าเงื่อนไขสลับเวลา หรือเปลี่ยนสรรพนามในการถ่ายทอดคำพูดผิดคน',steps:'เริ่ม Articles, Quantifiers และ S-V Agreement → Relative Clauses และ Reported Speech → Conditionals และ Past Habits → Wishes & Unreal Time → Inversion หัวข้อท้ายเป็นการต่อยอด ไม่จำเป็นต้องเข้าใจทั้งหมดก่อนเริ่มพูดประโยคพื้นฐาน',ex:'<hi>Every student has</hi> a book. <span class="trn">(นักเรียนทุกคนมีหนังสือ: every + นามเอกพจน์ และกริยาต้องสัมพันธ์กัน)</span>\nIf it <hi>rains</hi>, we <hi>will stay</hi> home. <span class="trn">(ถ้าฝนตกเราจะอยู่บ้าน: เงื่อนไขอนาคตที่เป็นไปได้)</span>'},
  6:{desc:'<b>Punctuation คือเครื่องหมายที่ช่วยแบ่งและจัดความสัมพันธ์ของข้อความเขียน</b> เช่น จุดจบประโยค เครื่องหมายคำถาม comma และอัญประกาศ เครื่องหมายช่วยให้ผู้อ่านรู้ว่าความคิดจบตรงไหน ส่วนใดเป็นข้อมูลแทรก และส่วนใดเป็นคำพูดที่ยกมา\n\nเครื่องหมายไม่ใช่การเขียนตามจังหวะหายใจเพียงอย่างเดียว ตัวอย่าง <b>Let’s eat, May.</b> คือชวนเมย์กินข้าว แต่เมื่อตัด comma ความสัมพันธ์ของชื่อ May กับกริยาอาจถูกอ่านต่างไป การวางเครื่องหมายจึงเกี่ยวกับความหมายด้วย\n\nบางเรื่องเป็นกฎโครงสร้าง เช่น ไม่แยกประธานกับกริยาด้วย comma โดยไม่มีเหตุ ส่วนบางเรื่องเป็นรูปแบบสำนัก เช่น Oxford comma และการวางเครื่องหมายกับอัญประกาศ ควรแยกสองกรณีนี้และใช้รูปแบบให้สม่ำเสมอ',purpose:'ใช้ทำให้งานเขียนอ่านง่าย ลดประโยคติดกัน และแยกคำที่หน้าตาคล้ายกัน เช่น its กับ it’s หมวดนี้รวมตัวพิมพ์ใหญ่ ช่องว่าง และวลีเขียนพื้นฐานซึ่งใช้ควบคู่เครื่องหมายด้วย',steps:'End Marks และ Capital Letters → Comma → Apostrophe และรูปย่อ → Semicolon/Colon → Quotation Marks, Parentheses และ Dash ตรวจความครบของประโยคก่อนใส่เครื่องหมาย เพราะจุดเพียงตัวเดียวไม่ทำให้ประโยคที่ขาดสมบูรณ์ขึ้น',ex:'<hi>Let’s eat, May.</hi> <span class="trn">(เมย์ มากินข้าวกัน: comma แยกชื่อผู้ที่เราพูดด้วย)</span>\n<hi>It’s cold. The cat moved its tail.</hi> <span class="trn">(อากาศหนาว แมวขยับหางของมัน: it’s = it is แต่ its = ของมัน)</span>'}

const OVERVIEW_BRANCHES={
  'Nouns':['<b>Nouns คือคำนาม</b> ใช้เรียกคน สัตว์ สิ่งของ สถานที่ หรือแนวคิด เช่น teacher, cat, Bangkok, happiness คำนามอาจเป็นประธาน กรรม หรือส่วนเติมเต็มได้ การเป็นนามไม่เท่ากับการเป็นประธานเสมอไป\n\nในหมวดนี้แบ่งทั้งตามความหมาย เช่น ชื่อทั่วไป/ชื่อเฉพาะ รูปธรรม/นามธรรม และตามการใช้ เช่น นับได้/นับไม่ได้ เอกพจน์/พหูพจน์ คำเดียวอยู่ได้หลายกลุ่มพร้อมกัน เช่น teacher เป็นทั้ง common noun และ countable noun','ใช้เลือก a/an, จำนวน และรูปกริยา เช่น a book, two books และ some information การรู้ว่าคำหนึ่งนับได้ในความหมายไหนสำคัญกว่าท่องว่าคำแปลไทยนับได้หรือไม่','เริ่ม Noun คืออะไร → Common/Proper → Countable/Uncountable → รูปพหูพจน์ → การนับด้วยหน่วย แล้วจึงอ่านคำนามประสมและคำที่เปลี่ยนความหมายแล้วเปลี่ยนการนับ'],
  'Pronouns':['<b>Pronouns คือสรรพนาม</b> ใช้แทนหรืออ้างถึงคน สิ่งของ หรือกลุ่มนาม ช่วยไม่ให้ต้องพูดชื่อซ้ำ เช่น May is here. She is ready. คำว่า she อ้างถึง May\n\nรูปสรรพนามเปลี่ยนตามหน้าที่: I เป็นประธาน me เป็นกรรม my ต้องมีนามตาม และ mine ใช้แทนกลุ่มนามแสดงเจ้าของได้ ยังมีรูปสะท้อนกลับ คำชี้เฉพาะ คำเชื่อม และคำไม่เจาะจง','ช่วยตอบว่าใครทำ ใครได้รับ และของใคร โดยไม่ทำให้สับสนว่าคำแทนนั้นอ้างถึงคนไหน ควรตรวจทั้งหน้าที่และสิ่งที่อ้างถึงทุกครั้ง','เรียน Subject → Object → Possessive ก่อน แล้วเทียบ myself กับ each other จากนั้นเพิ่ม this/that, indefinite pronouns และ relative pronouns'],
  'Verbs':['<b>Verbs คือกริยา</b> บอกการกระทำหรือสภาวะ และเป็นแกนสำคัญที่กำหนดว่าส่วนที่ตามมาต้องเป็นอะไร เช่น sleep ไม่ต้องมีกรรมตรง แต่ need ในความหมายต้องการมักต้องระบุสิ่งที่ต้องการ\n\nกริยาหลักสื่อความหมายหลัก ส่วน auxiliary และ modal ช่วยสร้างเวลา คำถาม ปฏิเสธ หรือท่าที กริยาเชื่อมอย่าง be/seem ใช้เชื่อมประธานกับคำอธิบาย ไม่ได้ทำงานเหมือนกริยาที่กระทำต่อกรรมทุกคำ','ช่วยตัดสินใจว่าต้องใส่ be หรือ do หรือไม่ ต้องมีกรรมกี่ตัว และใช้ adjective หรือ adverb ตามหลัง เช่น looks happy แต่ looks carefully','เริ่ม Action/Linking → Auxiliary/Modals → Transitive/Intransitive → Stative → Finite/Non-finite แล้วค่อยฝึกกริยาที่มีกรรมสองตัว'],
  'Adjectives':['<b>Adjectives คือคำคุณศัพท์</b> ใช้บอกลักษณะของคนหรือสิ่งของ เช่น ขนาด สี ความรู้สึก หรือคุณสมบัติ มักวางหน้านาม หรือหลัง linking verb เพื่ออธิบายประธาน เช่น a red bag และ The bag is red.\n\nหมวดนี้ครอบคลุมตำแหน่ง ลำดับคำขยาย การเปรียบเทียบเท่ากัน ขั้นกว่า ขั้นสุด และคำบอกระดับ คุณศัพท์ทั่วไปไม่เติม s ตามคำนามพหูพจน์','ใช้เพิ่มรายละเอียดอย่างแม่นยำ และเปรียบเทียบสิ่งต่าง ๆ โดยไม่ซ้อนรูปอย่าง more easier หรือวาง enough ผิดตำแหน่ง','ฝึก Descriptive และลำดับคำก่อน → Comparative/Superlative → As … As → Too/Enough และ So/Such → คำขยายขั้นกว่าและ The … The …'],
  'Adverbs':['<b>Adverbs คือกริยาวิเศษณ์</b> ใช้ขยายกริยา คุณศัพท์ กริยาวิเศษณ์อีกคำ หรือทั้งประโยค บอกวิธี เวลา สถานที่ ความถี่ หรือระดับ เช่น speaks clearly และ very hot\n\nหลายคำลงท้าย ly แต่ไม่ใช่ทุกคำ: fast กับ hard เป็น adverb ได้ ส่วน friendly เป็น adjective ตำแหน่งของ only หรือคำบอกความถี่อาจเปลี่ยนความหมาย จึงต้องดูว่าคำนี้ขยายส่วนใด','ช่วยบอกว่าทำอย่างไร บ่อยแค่ไหน หรือมากเพียงใด และแยกความหมายของคู่ที่หน้าตาคล้ายกัน เช่น hard/hardly, good/well','เรียน Types → Frequency และ Position → Good/Well, Hard/Hardly → คำเน้นและการเปรียบเทียบการกระทำ'],
  'Prepositions':['<b>Prepositions คือบุพบท</b> เชื่อมกลุ่มนามหรือสรรพนามกับส่วนอื่น เพื่อแสดงความสัมพันธ์ เช่น เวลา สถานที่ ทิศทาง ผู้ทำ หรือเครื่องมือ ตัวอย่าง in the room, after lunch และ with me\n\nคำแปลไทยคำเดียวอาจตรงกับบุพบทหลายคำ และคำอังกฤษบางกลุ่มต้องใช้คู่กัน เช่น interested in, listen to จึงควรจำความหมายพร้อมวลี ไม่เลือกจากการแปลคำต่อคำ','ช่วยแยกอยู่ที่ไหน ไปทางไหน ทำด้วยอะไร และต้องเสร็จภายในเวลาใด เช่น by Friday ต่างจาก until Friday','เริ่ม in/on/at สำหรับเวลาและสถานที่ → Movement → By/Until และ During/For/While → บุพบทที่ใช้คู่กับคำอื่น'],
  'Conjunctions':['<b>Conjunctions คือคำสันธาน</b> ใช้เชื่อมคำ วลี หรืออนุประโยคให้บอกความสัมพันธ์ เช่น เพิ่มข้อมูล ขัดแย้ง เหตุผล ผลลัพธ์ หรือเงื่อนไข แต่คำเชื่อมแต่ละกลุ่มไม่ได้ใช้โครงสร้างเหมือนกัน\n\nCoordinating เชื่อมส่วนระดับเท่ากัน; subordinating ทำให้ส่วนหนึ่งพึ่งประโยคหลัก; correlative ใช้เป็นคู่ ส่วน however/therefore เป็นคำเชื่อมความแบบ adverb จึงใช้เครื่องหมายต่างจาก but/so','ช่วยเชื่อมประโยคโดยไม่ใช้ because … so หรือ although … but ซ้ำผิดรูป และเลือก comma/semicolon ให้ตรงโครงสร้าง','เริ่ม FANBOYS → Subordinating → คำเชื่อมเป็นคู่ → However/Therefore แล้วเปรียบเทียบ Although/Despite'],
  'Interjections':['<b>Interjections คือคำอุทาน</b> แสดงปฏิกิริยาหรืออารมณ์สั้น ๆ เช่น Wow! เมื่อตื่นเต้น Oops! เมื่อพลาด และ Ouch! เมื่อเจ็บ คำเหล่านี้มักอยู่แยกจากโครงประธาน–กริยา\n\nน้ำเสียงเป็นส่วนสำคัญ คำเดียวกันอาจสื่อความรู้สึกต่างกันได้ตามบริบท และไม่จำเป็นต้องตามด้วย ! เสมอ เช่น Oh, I see. ใช้ comma ได้','ใช้เข้าใจบทสนทนาและเขียนข้อความให้มีน้ำเสียงเหมาะสม โดยเลือกความแรงของคำและเครื่องหมายตามสถานการณ์','อ่านความหมายและตัวอย่าง แล้วลองพูดพร้อมน้ำเสียง แยกคำอุทานออกจากประโยคหลักที่ตามมา'],
  'Present':['<b>Present คือกลุ่มรูปกริยาที่มองจากจุดปัจจุบัน</b> ไม่ได้แปลว่าทุกเหตุการณ์ต้องเกิดวินาทีนี้ Present Simple บอกกิจวัตร/สภาวะได้ ส่วน Present Continuous มองกิจกรรมที่กำลังดำเนินหรือชั่วคราว\n\nPresent Perfect เชื่อมสิ่งก่อนหน้ากับตอนนี้ และ Present Perfect Continuous เน้นกิจกรรมหรือระยะเวลาที่ดำเนินมาถึงจุดปัจจุบัน บางรูปยังใช้พูดนัดหมายอนาคตได้','ใช้แยก “ทำทุกวัน”, “กำลังทำ”, “ทำแล้ว/เคยทำ” และ “ทำมาระยะหนึ่ง” โดยดูมุมมอง ไม่จับคู่คำบอกเวลาแบบตายตัว','เริ่ม Simple เทียบ Continuous แล้วเรียน Perfect เทียบ Perfect Continuous ฝึกคำถามและปฏิเสธของแต่ละรูปด้วย'],
  'Past':['<b>Past คือกลุ่มรูปกริยาที่ใช้อ้างอิงเวลาอดีต</b> Past Simple เล่าเหตุการณ์โดยรวม Past Continuous ให้ภาพระหว่างดำเนิน ส่วน Past Perfect มองย้อนจากจุดอดีตไปยังสิ่งก่อนหน้านั้น\n\nPast Perfect Continuous เพิ่มการเน้นกระบวนการหรือระยะเวลาก่อนจุดอดีต เรื่องเดียวจึงอาจใช้หลายรูปเพื่อบอกฉาก ลำดับ และเหตุ ไม่ใช่เรื่องเก่านานแล้วต้องใช้ perfect เสมอ','ใช้เล่าเรื่องเมื่อวาน เหตุการณ์ที่เกิดแทรก และสิ่งที่เกิดไปก่อนเราไปถึงได้ชัดเจน','ฝึก V2 และ did/didn’t ก่อน → Simple/Continuous → Perfect และ Perfect Continuous แล้วลองเล่าเรื่องสั้นโดยบอกลำดับให้ชัด'],
  'Future':['<b>Future คือวิธีพูดถึงสิ่งหลังเวลาปัจจุบัน</b> ภาษาอังกฤษไม่ได้ใช้ will รูปเดียวเสมอ: will อาจบอกคำสัญญาหรือการตัดสินใจ going to บอกความตั้งใจหรือหลักฐาน และ present forms ใช้นัดหมายหรือตารางได้\n\nFuture Continuous มองว่าจะกำลังทำ Future Perfect มองว่าจะทำเสร็จภายในจุดหนึ่ง และ Future Perfect Continuous เน้นว่าจะทำต่อเนื่องมานานเท่าไรถึงจุดนั้น','ใช้พูดแผน คาดการณ์ กำหนดเสร็จ และกิจกรรม ณ เวลาอนาคต โดยเลือกความหมายก่อนเลือกสูตร','เริ่ม will เทียบ going to → ดูนัดหมาย/ตารางใน Future Choices → Continuous → Perfect → Perfect Continuous'],
  'Tense Comparisons':['<b>Tense Comparisons คือบทเปรียบเทียบรูปที่ผู้เรียนมักเลือกสลับกัน</b> ความต่างไม่ได้อยู่ที่สูตรเพียงอย่างเดียว แต่อยู่ที่ว่าผู้พูดมองเหตุการณ์เป็นกิจวัตร ชั่วคราว จบในอดีต หรือยังเกี่ยวกับตอนนี้\n\nบางบริบทใช้ได้มากกว่าหนึ่งรูปแต่เน้นต่างกัน เช่น I have worked กับ I have been working ต้องดูว่ากำลังนับผลงาน เน้นระยะเวลา หรือพูดสภาวะ','ใช้เมื่อรู้สูตรแต่ยังตอบไม่ได้ว่าทำไมประโยคนี้เลือกอีก tense และช่วยไม่ให้ตีตรารูปที่ใช้ได้ในอีกบริบทว่าผิดทุกกรณี','อ่านภาพรวม Tense/Aspect → เทียบ Simple/Continuous → Past/Present Perfect → Perfect สองแบบ → Future Choices และ Narrative Tenses'],
  'Time Expressions':['<b>Time Expressions คือคำหรือวลีที่ช่วยระบุเวลา ระยะเวลา และความสัมพันธ์กับจุดอ้างอิง</b> เช่น yesterday, since Monday, for two hours, already และ yet\n\nคำเหล่านี้เป็นเบาะแสให้ตีความประโยค แต่หลายคำใช้กับได้หลาย tense เช่น for ใช้กับ I stayed for two days. ได้ หมวดนี้ยังรวม been/gone เพื่อแยกความหมายการไปและการกลับ','ใช้บอกตั้งแต่เมื่อไร นานเท่าไร เคยหรือยัง และอนาคตที่ตามหลัง when/after โดยไม่สลับจุดเริ่มกับช่วงเวลา','เริ่ม Since/For → Already/Yet/Just → Ever/Never → Future Time Clauses → Been/Gone แล้วลองเขียนบริบทก่อนเลือก tense'],
  'Sentence Types':['<b>Sentence Types ในหมวดนี้แบ่งประโยคตามจำนวนและความสัมพันธ์ของ clause</b> ได้แก่ Simple, Compound, Complex และ Compound-Complex ไม่ได้แบ่งแค่จากความสั้นยาว\n\nประธานร่วมสองชื่อหรือกริยาร่วมสองตัวอาจยังอยู่ใน simple sentence เดียวได้ สิ่งที่ต้องนับคือส่วนหลักที่ยืนได้เองและส่วนย่อยที่พึ่งอีกส่วน','ใช้วิเคราะห์ประโยคยาวและเลือกคำเชื่อมให้เหมาะสม ช่วยเลี่ยงการเห็น and แล้วสรุปทันทีว่าเป็น compound','รู้จัก Independent/Dependent Clauses ก่อน แล้วนับส่วนหลักกับส่วนย่อยในตัวอย่างทั้งสี่ประเภท'],
  'Clauses':['<b>Clause หรืออนุประโยค</b> คือหน่วยโครงสร้างที่ในรูปพื้นฐานมีประธานกับกริยา บาง clause ยืนเป็นประโยคเองได้ ส่วนบาง clause ต้องอยู่กับส่วนหลักเพื่อให้ความหมายครบ\n\nอนุประโยคย่อยทำหน้าที่ต่างกันได้: noun clause แทนกลุ่มนาม adjective clause ขยายนาม และ adverb clause บอกเวลา เหตุผล หรือเงื่อนไข จึงไม่ควรใช้ลำดับคำถามตรงในทุก clause ที่มี wh-word','ใช้แยกส่วนของประโยคและเข้าใจว่าคำเชื่อมกำลังพาเราไปสู่ข้อมูลชนิดใด','Independent/Dependent → Noun Clause → Adjective Clause → Adverb Clause ลองวงขอบเขตแต่ละ clause และหาประธานกับกริยาของมัน'],
  'Phrases':['<b>Phrase หรือวลี</b> คือกลุ่มคำที่รวมกันทำหน้าที่หนึ่งในประโยค เช่น the small red bag ทั้งกลุ่มทำหน้าที่เหมือนนาม เราเรียกชนิดวลีตามคำแกนหรือรูปโครงสร้างของมัน\n\nนามวลี กริยาวลี บุพบทวลี และวลีคุณศัพท์/กริยาวิเศษณ์ช่วยสร้างส่วนต่าง ๆ ของประโยค วลีอาจยาวได้มาก แต่จำนวนคำอย่างเดียวไม่ได้ทำให้เป็นประโยคสมบูรณ์','ใช้หาคำแกนที่กำหนดหน้าที่และความสอดคล้องของกริยา เช่น The box of books มี box เป็นแกน ไม่ใช่ books','เริ่ม Noun Phrase → Prepositional Phrase → Verb Phrase → Adjective/Adverb Phrases แล้วฝึกขยายประโยคสั้นทีละส่วน'],
  'Start Here':['<b>Start Here คือจุดเริ่มต้นสำหรับผู้ที่ยังไม่รู้ศัพท์ไวยากรณ์</b> ไม่จำเป็นต้องรู้ชื่อ tense ทั้งหมดก่อน หมวดนี้ปูความหมาย S/V/O และการเรียงว่าใครทำอะไร\n\nจากนั้นแยกประโยคที่ใช้ be เช่น She is happy. ออกจากกริยาทั่วไป เช่น She works. แล้วฝึกปฏิเสธและคำถาม เพราะความต่างนี้เป็นฐานของบทเรียนจำนวนมาก','ใช้สร้างประโยคแรกให้ครบและเข้าใจคำอธิบายในหมวดอื่นโดยไม่ต้องเดาว่าสัญลักษณ์หมายถึงอะไร','เรียนตามลำดับรายการ เริ่ม Grammar Symbols และ English Word Order จากนั้นฝึก be กับกริยาทั่วไป พร้อมเปลี่ยนประโยคเดิมเป็นบวก ลบ และคำถาม'],
  'Sentence Patterns':['<b>Sentence Patterns คือแบบแผนของส่วนประกอบประโยค</b> เช่น SV, SVO, SVC, SVOO และ SVOC แต่ละแบบต่างกันที่กริยาต้องการส่วนใดตามหลัง ไม่ใช่สูตรหนึ่งใช้ได้กับกริยาทุกคำ\n\nS คือประธาน V กริยา O กรรม และ C ส่วนเติมเต็ม เช่น She is happy. ใช้ happy อธิบายประธาน ต่างจาก She reads books. ที่ books เป็นกรรม','ใช้ต่อคำศัพท์ที่รู้ให้เป็นประโยค และแยกการบอกว่ามีอยู่ด้วย there is ออกจากการบอกอากาศด้วย it is','ฝึก SV/SVO → SVC → SVOO/SVOC → There Is/Are และ Dummy It → Imperatives โดยลองเปลี่ยนคำภายในแบบเดิม'],
  'Questions & Answers':['<b>Questions & Answers สอนการสร้างคำถามและคำตอบที่สัมพันธ์กับกริยา</b> คำถามตรงมักย้าย be หรือกริยาช่วยไว้หน้าประธาน ถ้าเป็น simple ของกริยาทั่วไปจึงเพิ่ม do/does/did\n\nคำถามที่ถามประธานเอง เช่น Who called? และคำถามย่อย เช่น where she lives มีโครงต่างออกไป การตอบสั้นและ question tags ก็ต้องเลือกกริยาช่วยให้ตรงกับข้อความเดิม','ใช้ถามข้อมูล ขอความชัดเจน และตอบปฏิเสธโดยไม่สับสน yes/no ตามแบบภาษาไทย','Yes/No → Wh → Subject Questions → Short Answers → Indirect Questions → Tags และ Negative Questions'],
  'Clear Sentences':['<b>Clear Sentences คือการทำให้ประโยคครบและสื่อความสัมพันธ์ชัด</b> ไม่ใช่การทำให้ยาวหรือใช้คำยาก แต่ต้องมีส่วนหลักที่สมบูรณ์ เชื่อมประโยคด้วยวิธีเหมาะสม และวางคำขยายตรงสิ่งที่ต้องการ\n\nปัญหาหลักคือ fragment ที่ยังไม่จบความ run-on ที่นำประโยคมาติดกัน โครงสร้างรายการไม่ขนาน และคำขยายที่ทำให้ไม่รู้ว่าใครเป็นผู้ทำ','ใช้ตรวจงานเขียนหลังร่างเสร็จ โดยมองความหมายและโครงสร้างก่อนแก้คำศัพท์เล็กน้อย','ตรวจ Fragments/Run-ons → รูปคู่ขนาน → ตำแหน่งคำขยาย ถ้าประโยคกำกวมให้แยกเป็นประโยคสั้นหรือ clause เต็มก่อน'],
  'Emphasis & Ellipsis':['<b>Emphasis คือการเน้นข้อมูล ส่วน Ellipsis คือการละส่วนที่เข้าใจกันอยู่แล้ว</b> เราอาจจัดประโยคใหม่เพื่อชี้ว่าใครหรืออะไรสำคัญ หรือใช้กริยาช่วยแทนการพูดทั้งข้อความซ้ำ\n\nIt was May who called. เน้นว่าเป็นเมย์ ส่วน She can swim, and I can too. ละ swim หลัง can ตัวที่สอง แต่ต้องยังชัดว่ากริยาช่วยนั้นอ้างถึงกิจกรรมใด','ใช้ปรับน้ำหนักและความเป็นธรรมชาติหลังสร้างประโยคพื้นฐานได้แล้ว ไม่จำเป็นต้องทำทุกประโยคให้มีรูปเน้น','เริ่ม Emphatic Do และ So/Neither → Ellipsis → It-clefts และ What-clefts ลองเทียบรูปธรรมดากับรูปเน้นโดยรักษาข้อความหลักเดิม'],
  'Active & Passive':['<b>Active และ Passive คือวิธีจัดมุมมองต่อผู้ทำและผู้รับการกระทำ</b> Active วางผู้ทำเป็นประธาน ส่วน Passive ย้ายสิ่งที่รับการกระทำมาเป็นประธาน และใช้ be + V3\n\nรูป be เปลี่ยนตาม tense และจำนวน จึงมีทั้ง is cleaned, is being cleaned และ has been cleaned ไม่ใช่ passive ทุกประโยคเป็นอดีต และไม่จำเป็นต้องระบุ by + ผู้ทำเสมอ','ใช้เมื่ออยากเน้นผล งาน หรือสิ่งที่ถูกทำ โดยเฉพาะเมื่อไม่รู้หรือไม่สำคัญว่าใครทำ ต้องรักษาเวลาและความหมายเมื่อแปลงรูป','เริ่ม Active/Passive พื้นฐาน → Simple → Continuous → Perfect → Modal Passive จากนั้นค่อย Get Passive และ Reporting Passive'],
  'Infinitives & Gerunds':['<b>Infinitives และ Gerunds คือรูปกริยาที่ใช้ในตำแหน่งซึ่งไม่ได้เป็นกริยาหลักที่ผันตามประธานโดยตรง</b> เช่น want to learn และ enjoy learning ต้องเลือกรูปตามคำที่อยู่ก่อนและความหมาย\n\nto V ใช้บอกจุดประสงค์หรือหลังคำบางกลุ่ม ส่วน V-ing ใช้เป็นกิจกรรมคล้ายนามหรือหลังบุพบทได้ คำบางคำใช้ได้ทั้งสองรูปแต่เปลี่ยนความหมาย เช่น stop talking กับ stop to drink','ใช้ลดการเติม to หรือ ing ตามความรู้สึก และช่วยแยกว่าใครเป็นผู้ทำในโครง ask someone to do','เริ่ม Infinitive/Gerund → เปรียบเทียบเมื่อความหมายเปลี่ยน → Bare Infinitive → Verb + Object + To → Purpose และรูป perfect/passive'],
  'Participles':['<b>Participles คือรูปกริยาอย่าง V-ing และ V3 ที่ใช้สร้างโครงสร้างหรือขยายความ</b> หมวดนี้เน้นการใช้เป็นคุณศัพท์และส่วนย่อของ clause ไม่ใช่ ing ทุกคำต้องหมายถึงกำลังทำตอนนี้\n\nboring บอกว่าน่าเบื่อ ส่วน bored บอกว่ารู้สึกเบื่อ อีกระดับคือ Walking home, I… หรือ Written by May, the letter… ซึ่งต้องจับคู่ผู้ทำ/ผู้รับให้ตรงกับประธานส่วนหลัก','ใช้เพิ่มรายละเอียดให้กระชับ แต่ต้องระวังย่อแล้วผู้กระทำผิดตัว และแยกคุณศัพท์ความรู้สึกจากสิ่งที่ทำให้รู้สึก','เริ่ม -ing/-ed Adjectives → Present/Past Participle Clauses → Perfect Participle Clauses เมื่อย่อไม่ชัด ให้ใช้ประโยคเต็มก่อน'],
  'Subjunctive':['<b>Subjunctive คือการใช้รูปกริยาพิเศษในบางบริบทของข้อเสนอ ข้อกำหนด หรือการสมมติ</b> เช่น I suggest that he study. ใช้ study รูปฐาน แม้ประธานเป็น he และ If I were you. ใช้ were เพื่อสมมติ\n\nรูปนี้ไม่ใช่กาลใหม่อีกชนิด และไม่ใช่ว่าเจอ suggest แล้วทุกความหมายต้องเหมือนกัน ต้องแยกการเสนอให้ทำจากการรายงานข้อเท็จจริง รวมทั้งความแตกต่างของภาษาแบบทางการและสำเนียง','ใช้เข้าใจงานเขียนทางการ ข้อเสนอ และสำนวนคงรูปโดยไม่เผลอแก้เป็นกริยาเติม s ทุกครั้ง','อ่านภาพรวม → Mandative Subjunctive → Formulaic Subjunctive แล้วเทียบกับ Wishes/Conditionals ที่ใช้รูปสมมติใกล้เคียงกัน'],
  'Modal Meanings':['<b>Modal Meanings คือความหมายที่กริยาช่วยเพิ่มให้ข้อความ</b> เช่น can บอกความสามารถ may/might บอกความเป็นไปได้ must บอกความจำเป็นหรือการอนุมาน และ should ให้คำแนะนำ\n\nคำเดียวมีหลายหน้าที่ได้ จึงต้องดูบริบท เช่น mustn’t คือห้าม แต่ don’t have to คือไม่จำเป็น ไม่ใช่ความหมายเดียวกัน เมื่อมองอดีตอาจใช้ modal + have + V3','ใช้เลือกระดับความสุภาพ ความแน่ใจ และแรงของคำแนะนำให้ตรงสิ่งที่ต้องการ ไม่ตีความ modal ด้วยเปอร์เซ็นต์ตายตัว','ความสามารถ → ความเป็นไปได้ → หน้าที่/ข้อห้าม → คำแนะนำและคำขอ → การอนุมาน → Modal Perfect และ Need Not Have'],
  'Verb Spelling':['<b>Verb Spelling คือกฎสะกดเมื่อเปลี่ยนรูปกริยา</b> ครอบคลุมเติม s/es, ed และ ing รวมทั้งการเปลี่ยน y ตัด e หรือซ้ำพยัญชนะท้าย สิ่งเหล่านี้เกี่ยวกับรูปคำ ไม่ใช่สูตรเลือก tense ทั้งหมด\n\nกริยาปกติมักใช้กฎสะกดได้ แต่กริยาไม่ปกติ เช่น go/went/gone ต้องดูตารางกริยา 3 ช่อง แยกเสียงอ่าน ed ออกจากตัวสะกดด้วย เพราะไม่ได้อ่านว่าเอ็ดทุกคำ','ใช้เขียนรูปกริยาให้ตรงสูตรที่เลือกแล้ว เช่น studies, studied, making และ stopped','เริ่ม Third-person S → Regular ED → ING → Double Consonants → ED Pronunciation และตรวจ irregular verbs ที่ไม่เข้าแบบ'],
  'Phrasal Verbs':['<b>Phrasal Verbs คือกริยาที่รวมกับคำตาม เช่น up, off หรือ out แล้วเกิดความหมายของทั้งกลุ่ม</b> เช่น give up แปลว่าเลิก/ยอมแพ้ ไม่ควรแปลแต่ละคำแยกกัน\n\nบางวลีแยกกรรมไว้กลางได้ เช่น turn the light off และต้องทำเช่นนั้นเมื่อกรรมเป็น it ส่วนบางกลุ่มอย่าง look after วางกรรมท้ายเสมอ หมวดนี้รวมวลีสามส่วนที่ควรจำเป็นชุดด้วย','ใช้เข้าใจภาษาพูดและเลือกตำแหน่งกรรมให้ถูก เช่น turn it off ไม่ใช่ turn off it','เรียนความหมายทั้งวลี → แยกได้/แยกไม่ได้ → ทดลองเปลี่ยนนามกรรมเป็น it/them → วลีสามส่วนอย่าง look forward to'],
  'Causatives':['<b>Causatives คือโครงสร้างที่บอกให้ ทำให้ หรือจัดการให้คนอื่นทำบางอย่าง</b> เช่น I had my hair cut. บอกว่าไปให้คนอื่นตัดผม ไม่ได้บอกว่าตัดเอง\n\nบางรูปเน้นสิ่งที่ได้รับการทำ เช่น have something done บางรูปเน้นผู้ทำ เช่น get someone to do และ make/let/allow สื่อแรงบังคับหรือการอนุญาตต่างกัน','ใช้พูดถึงบริการ การมอบหมาย และการอนุญาต โดยเลือกให้ชัดว่าส่วนหลังเป็นคนที่ทำหรือสิ่งที่ถูกทำ','เริ่ม Have/Get Something Done → Have/Get Someone To → Make/Let/Allow แล้วเปรียบเทียบรูป active กับ passive'],
  'S-V Agreement':['<b>Subject–Verb Agreement คือความสอดคล้องของประธานกับรูปกริยา</b> เช่น The dog runs. แต่ The dogs run. และ She is. ต่างจาก They are. ไม่ได้แปลว่าประธานเอกพจน์ต้องเติม s ในทุก tense\n\nประธานอาจเป็นกลุ่มคำยาว มี of หรือ clause คั่น ต้องหาคำแกน รวมถึงคำที่ชวนสับสน เช่น everyone, news, the number of และปริมาณที่มองเป็นหน่วยรวม','ใช้เลือก is/are, has/have และ s/es โดยไม่เผลอตามคำนามที่อยู่ใกล้กริยาแต่ไม่ใช่ประธานหลัก','เริ่ม Basic Rules → Tricky Cases → Head Noun → Amounts → A/The Number → Fractions/Percentages'],
  'Conditionals':['<b>Conditionals คือประโยคที่เชื่อมเงื่อนไขกับผล</b> มักมี if-clause และ main clause เช่น ถ้าเกิดสิ่งนี้ ผลอีกสิ่งจะเป็นอย่างไร ต้องแยกทั้งความเป็นจริงและเวลาอ้างอิงของสองส่วน\n\nZero พูดผลทั่วไป First พูดสิ่งที่มองเป็นไปได้ Second สมมติปัจจุบัน/อนาคต Third สมมติอดีต และ Mixed เชื่อมเงื่อนไขกับผลต่างช่วงเวลา รูปอดีตใน Second ไม่ได้บอกเวลาอดีตเสมอ','ใช้พูดแผน ความเป็นไปได้ คำแนะนำ และสิ่งที่อยากให้อดีตต่างออกไป โดยไม่เลือกสูตรจาก if อย่างเดียว','เริ่ม Zero/First → Second → Third → Mixed ทั้งสองแบบ แล้วเปรียบเทียบ unless, in case, even if และ only if'],
  'Reported Speech':['<b>Reported Speech คือการถ่ายทอดสิ่งที่คนอื่นหรือเราเองเคยพูด</b> Direct speech ยกคำพูดเดิม ส่วน indirect speech ปรับข้อความเข้ากับมุมมองของผู้เล่า เช่น May said, “I am tired.” → May said she was tired.\n\nสิ่งที่ต้องตรวจมีคนที่สรรพนามอ้างถึง เวลา สถานที่ และชนิดข้อความว่าเป็นบอกเล่า คำถาม หรือคำสั่ง การถอย tense เป็นรูปที่พบบ่อยเมื่อรายงานอดีต แต่ไม่ใช่ข้อบังคับทุกสถานการณ์','ใช้เล่าบทสนทนาโดยไม่สลับคนหรือทำให้เวลาคลาดเคลื่อน และเลือก say/tell/ask พร้อมรูปตามหลังได้ถูก','เริ่ม Statements → Questions → Commands → Backshift Exceptions → Pronouns/Time Shifts → Reporting Verb Patterns'],
  'Articles':['<b>Articles คือ a, an และ the ที่ใช้กำหนดการอ้างถึงนาม</b> a/an ใช้กับนามนับได้เอกพจน์ที่ไม่ระบุแน่ชัด the ใช้เมื่อผู้ฟังระบุสิ่งที่หมายถึงได้ ส่วนบางบริบทไม่ใช้ article ซึ่งเรียก zero article\n\nก่อนเลือกให้ถามว่านามนับได้หรือไม่ มีกี่หน่วย และอ้างทั่วไปหรือเฉพาะ a/an เลือกจากเสียงต้นคำที่ตามมา ไม่ใช่ตัวอักษร เช่น an hour แต่ a university','ใช้สร้างกลุ่มนามให้ครบ เช่น She is a teacher. และแยก music ทั่วไปจาก the music ที่ระบุเฉพาะ','เริ่ม a/an → the → Zero Article → General/Specific → ชื่อสถานที่และวลีกิจกรรม → Articles กับ Possessives'],
  'Relative Clauses':['<b>Relative Clauses คืออนุประโยคที่ขยายนามหรือเพิ่มเติมข้อมูลเกี่ยวกับสิ่งที่กล่าวถึง</b> เช่น the person who called บอกว่าคนไหน และ May, who lives nearby, … เพิ่มข้อมูลเกี่ยวกับเมย์\n\nDefining ระบุสิ่งที่จำเป็นต่อการชี้นาม จึงไม่คั่น comma ส่วน Non-defining เป็นข้อมูลเสริมและไม่ใช้ that ต้องดูด้วยว่า relative word เป็นประธาน กรรม หรือแสดงเจ้าของ','ใช้รวมข้อมูลเกี่ยวกับคน/สิ่งของให้ต่อเนื่อง และหลีกเลี่ยงการใส่กรรมซ้ำ เช่น the book that I bought it','เรียน Defining เทียบ Non-defining → เมื่อไรละคำเชื่อมได้ → Whose/Whom/Where → Reduced Clauses → Which ที่อ้างทั้งประโยค'],
  'Quantifiers':['<b>Quantifiers คือคำบอกปริมาณหรือขอบเขตของกลุ่มนาม</b> เช่น some, many, much, a few, each, all และ most บางคำใช้กับนามนับได้พหูพจน์ บางคำใช้กับนามนับไม่ได้ และบางคำใช้ได้ทั้งสองแบบ\n\nการเติม a เปลี่ยนน้ำหนักได้ เช่น few เน้นน้อยมาก แต่ a few เน้นว่ายังมีอยู่บ้าง และ most students ต่างจาก most of the students ที่เจาะกลุ่มเฉพาะ','ใช้บอกจำนวน ความมากน้อย และการเลือกสมาชิก โดยให้รูปนามกับกริยาสอดคล้องกับคำกำหนดนั้น','Some/Any → Much/Many → Few/Little → Each/Every และ All/Both → Either/Neither, No/None → Other และ Most/Almost'],
  'Wishes & Unreal Time':['<b>Wishes & Unreal Time คือรูปที่ใช้พูดสิ่งที่อยากให้ต่างจากจริงหรือมองเป็นสมมติ</b> เช่น I wish I knew. ใช้รูปอดีตเพื่อบอกว่าตอนนี้ไม่รู้ ไม่ใช่เล่าเหตุการณ์ที่รู้ในอดีต\n\nwish + had V3 เสียดายอดีต wish + would อยากให้พฤติกรรมหรือสถานการณ์เปลี่ยน ส่วน would rather, had better, it is time และ as if มีรูปและนัยเฉพาะที่ต้องแยกกัน','ใช้แสดงความเสียดาย ความชอบ และคำแนะนำโดยไม่สับสนว่าเห็น V2 แล้วต้องแปลเป็นอดีตทุกครั้ง','เริ่ม Wish: Present → Wish: Past → Wish + Would แล้วแยก Would Rather/Had Better และ It Is Time/As If'],
  'Inversion':['<b>Inversion คือการกลับลำดับบางส่วนของประโยค</b> หมวดนี้เน้นการย้ายกริยาช่วยไว้หน้าประธานเพื่อเน้นข้อความหรือสร้างเงื่อนไขแบบทางการ ไม่ใช่การกลับคำทั้งประโยค\n\nเช่น I have never seen… เปลี่ยนเป็น Never have I seen… เมื่อย้าย never มานำหน้า แต่ Only May knows. ไม่ต้องกลับ เพราะ only ขยายประธาน ไม่ได้ทำหน้าที่เหมือน only after-clause','ใช้เข้าใจงานเขียนที่มีการเน้นอย่างเป็นทางการ และรู้ว่าต้องกลับส่วนหลักหรือส่วนย่อย ไม่ย้ายกริยาทุกจุดโดยอัตโนมัติ','ทบทวน auxiliary และลำดับคำถามก่อน → Negative Adverbials → Only After/Not Until → Hardly/No Sooner → Conditional Inversion'],
  'Past Habits':['<b>Past Habits รวมการพูดถึงสิ่งที่เคยทำและความคุ้นเคย</b> used to + V1 บอกกิจกรรมหรือสภาพอดีตที่เปลี่ยนไปแล้ว ส่วน would + V1 ใช้เล่ากิจกรรมที่ทำซ้ำเมื่อบริบทอดีตชัด\n\nbe used to + noun/V-ing ไม่ได้หมายถึงเคยทำ แต่หมายถึงคุ้นเคย และ get used to คือค่อย ๆ ชิน รูปคล้ายกันแต่ to ทำหน้าที่ต่างกัน จึงตามด้วยกริยาคนละรูป','ใช้แยก “เคยตื่นเช้า” จาก “ชินกับการตื่นเช้า” และเล่าพฤติกรรมในวัยเด็กให้ตรงความหมาย','เริ่ม Used To → Be/Get Used To แล้วค่อยเทียบ Would for Past Habits ด้วยตัวอย่างกิจกรรมและสภาวะ'],
  'End Marks':['<b>End Marks คือเครื่องหมายที่บอกลักษณะการจบประโยค</b> จุดใช้บอกเล่าหรือคำสั่งปกติ ? ใช้กับคำถามหลัก และ ! ใช้เน้นอารมณ์หรือคำเตือน\n\nต้องดูโครงประโยคหลัก ไม่ใช่แค่มีคำอย่าง where แล้วใส่ ? เช่น I wonder where she is. เป็นบอกเล่า แต่ Could you tell me where she is? เป็นคำถามหลัก','ใช้ทำให้ผู้อ่านรู้ว่าข้อความเป็นการบอก ถาม หรืออุทาน โดยไม่เพิ่มเครื่องหมายหลายตัวเกินความจำเป็น','ฝึก Period → Question → Exclamation และลองเปลี่ยนประโยคเดิมเป็นคำถามตรงกับการเล่าคำถาม'],
  'Comma':['<b>Comma คือจุลภาคที่ช่วยแบ่งส่วนภายในประโยค</b> ใช้คั่นรายการ แยกส่วนเกริ่น แทรกข้อมูลเสริม หรือคั่นก่อนคำเชื่อมที่ต่อสอง independent clauses ตามรูปแบบทั่วไป\n\nComma ไม่ใช่เครื่องหมายหยุดหายใจตามใจ และไม่ควรใช้ตัวเดียวเชื่อมสองประโยคสมบูรณ์โดยไม่มีคำเชื่อม จุดสำคัญอีกอย่างคือชื่อผู้ฟังและข้อมูลแทรกกลางประโยคมักต้องคั่นให้ครบ','ใช้ลดความกำกวมและตรวจ comma splice รวมทั้งรู้ว่า Oxford comma เป็นทางเลือกของรูปแบบงาน ไม่ใช่ถูกผิดเด็ดขาดทุกกรณี','อ่าน Comma Rules → Oxford Comma → Comma Splices → Direct Address → ข้อมูลเสริมที่ต้องเปิด–ปิดเป็นคู่'],
  'Semicolon & Colon':['<b>Semicolon (;) และ Colon (:) มีหน้าที่ต่างกัน</b> semicolon เชื่อมประโยคสมบูรณ์ที่เกี่ยวข้องกัน หรือคั่นรายการซับซ้อน ส่วน colon พาผู้อ่านไปสู่รายการ คำอธิบาย หรือรายละเอียดที่ขยายข้อความก่อนหน้า\n\nในร้อยแก้วทั่วไป สิ่งก่อน colon ควรเป็นประโยคสมบูรณ์ เช่น You need two things: a pen and paper. ไม่แทรก colon ตรงกลางกริยากับกรรมอย่างไม่มีเหตุ','ใช้จัดความคิดให้อ่านชัดโดยไม่ใช้ comma แทนทุกอย่าง และเลือกว่าอยากเชื่อมสองข้อความหรืออธิบายข้อความแรก','เรียน semicolon โดยลองแยกสองด้านเป็นประโยคก่อน จากนั้นเรียน colon โดยตรวจว่าข้อความหน้ามันครบความหมายแล้วหรือยัง'],
  'Apostrophe':['<b>Apostrophe คือเครื่องหมาย ’ หรือรูปตรงของมันที่ใช้ในคำย่อและการแสดงเจ้าของ</b> เช่น don’t ละตัวอักษรจาก do not ส่วน May’s bag แสดงว่าเป็นกระเป๋าของเมย์\n\nตำแหน่งเปลี่ยนตามรูปนาม: student’s, students’ และ children’s ไม่ใช่เครื่องหมายสร้างพหูพจน์ทั่วไป ส่วน its, yours และ theirs เป็นรูปแสดงเจ้าของที่ไม่มี apostrophe','ใช้แยกคำหน้าตาใกล้กัน เช่น its/it’s และเขียนเจ้าของร่วมกับเจ้าของแยกให้ความหมายไม่คลาดเคลื่อน','เริ่ม Possessive → It’s/Its → Common Contractions → Shared/Separate Possession โดยลองขยายรูปย่อเพื่อตรวจความหมาย'],
  'Hyphen & Dash':['<b>Hyphen และ Dash คือขีดที่มีความยาวและหน้าที่ต่างกัน</b> hyphen (-) มักเชื่อมคำประสม en dash (–) มักแสดงช่วง และ em dash (—) ใช้แทรกหรือเน้นข้อความ\n\nตัวอย่าง a five-year-old child ต้องใช้ year เอกพจน์ในคำขยายประสม แต่ The child is five years old. ใช้ years ตามจำนวน ความต่างจึงไม่ได้มีแค่รูปขีดที่หน้าตาคล้ายกัน','ใช้เขียนช่วงเวลา อายุ และข้อมูลแทรกให้ชัด พร้อมรักษารูปแบบช่องว่างอย่างสม่ำเสมอ','เริ่ม Hyphen ในคำขยายประสม → Em Dash สำหรับข้อมูลแทรก → En Dash สำหรับช่วง แล้วเทียบกับ from … to …'],
  'Writing Conventions':['<b>Writing Conventions คือแบบแผนที่ช่วยให้ข้อความเขียนอ่านและอ้างอิงได้ตรงกัน</b> หมวดนี้รวมตัวพิมพ์ใหญ่ อัญประกาศ วงเล็บ จุดละข้อความ ช่องว่าง และตัวย่อที่พบบ่อย\n\nบางเรื่องมีหลักพื้นฐานชัด เช่น I และชื่อภาษาขึ้นต้นตัวใหญ่ ส่วนบางรายละเอียดต่างกันตามสำนักหรือสำเนียง เช่นเครื่องหมายกับอัญประกาศ ควรเลือกแบบเดียวกันตลอดงาน','ใช้เกลางานเขียนหลังตรวจโครงสร้างประโยคแล้ว และรักษาความหมายเมื่อยกคำพูดหรือเว้นบางส่วนของข้อความ','เริ่ม Capital Letters → Quotation Marks → Parentheses → Ellipsis → Spacing/Abbreviations โดยตรวจทั้งความครบของเครื่องหมายคู่และความสม่ำเสมอ']
};
let currentOverview=null;
function overviewRecord(tid=null,bi=null){
  if(tid===null&&bi===null)return {title:'English Grammar',th:'ภาพรวมไวยากรณ์ภาษาอังกฤษ',...OVERVIEW_ROOT};
  const t=D.find(t=>t.id===tid);if(!t)return null;
  if(bi===null)return {title:t.en,th:t.th,...OVERVIEW_TOPICS[tid]};
  const b=t.branches[bi],data=b&&OVERVIEW_BRANCHES[b.en];if(!data)return null;
  return {title:b.en,th:b.th,desc:data[0],purpose:data[1],steps:data[2],ex:b.items[0].ex};
}
function oOverview(tid=null,bi=null){
  const info=overviewRecord(tid,bi);if(!info)return;
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  currentLesson=null;currentOverview=[tid,bi];
  const t=tid===null?null:D.find(t=>t.id===tid),b=t&&bi!==null?t.branches[bi]:null;
  const color=CR[tid||1],light=CL[tid||1];
  const count=b?b.items.length:t?t.branches.reduce((n,b)=>n+b.items.length,0):LESSONS.length;
  const section=(label,body,cls='s-desc')=>`<section class="s-sec"><h4 class="s-label" style="color:${light}">${label}</h4><div class="${cls}">${fmt(body)}</div></section>`;
  let h=`<div class="sh-hd"><div class="sh-hd-left"><h3 style="color:${light}">${esc(info.title)}</h3><div class="sth">${esc(info.th)}</div><span class="level-tag">ภาพรวม · ครอบคลุม ${count} บทเรียน</span></div><div class="sh-hd-btns"><button onclick="csht()" aria-label="ปิดคำอธิบายภาพรวม">✕</button></div></div><div class="sh-bd">`;
  if(t){h+='<nav class="ov-crumbs" aria-label="กลับไปอ่านภาพรวม"><button onclick="oOverview()">‹ English Grammar</button>';if(b)h+=`<button onclick="oOverview(${tid})">‹ ${esc(t.en)}</button>`;h+='</nav>'}
  h+=section('📖 หัวข้อนี้คืออะไร?',info.desc)+section('🎯 เรียนไปเพื่ออะไร / ใช้เมื่อไร?',info.purpose)+section('📝 ตัวอย่างชวนสังเกต',info.ex,'s-ex')+section('🧭 ควรเริ่มเรียนอย่างไร?',info.steps,'s-tip');
  const rows=b?b.items.map((it,ii)=>({title:it.en,th:it.th,desc:it.desc,meta:it.level,action:`openOverviewLesson(${tid},${bi},${ii})`})):
    t?t.branches.map((branch,index)=>({title:branch.en,th:branch.th,desc:OVERVIEW_BRANCHES[branch.en][0],meta:branch.items.length+' บทเรียน',action:`oOverview(${tid},${index})`})):
    D.map(topic=>({title:topic.en,th:topic.th,desc:OVERVIEW_TOPICS[topic.id].desc,meta:topic.branches.length+' หมวดย่อย',action:`oOverview(${topic.id})`}));

let qState={qs:[],idx:0,score:0,answered:false};
function shuffled(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function oQuiz(tid){csht();let qs;if(tid)qs=shuffled(QUIZZES.filter(q=>q.tid===tid));else{const selected=[];D.forEach(t=>selected.push(...shuffled(QUIZZES.filter(q=>q.tid===t.id)).slice(0,3)));const used=new Set(selected);qs=shuffled([...selected,...shuffled(QUIZZES.filter(q=>!used.has(q))).slice(0,20-selected.length)])}qState={qs:qs.slice(0,20),idx:0,score:0,answered:false};rQuiz();showPanel('qol')}
function cQuiz(){hidePanel('qol')}
function rQuiz(){const {qs,idx,score}=qState;if(idx>=qs.length){$('qol').innerHTML=`<div class="quiz-hd"><h3>จบแบบทดสอบแล้ว</h3><button class="tb-btn" onclick="cQuiz()" aria-label="ปิดแบบทดสอบ">✕</button></div><div class="quiz-result"><strong>${score}/${qs.length}</strong><p>ตอบถูก ${Math.round(score/qs.length*100)}%</p><p class="reference-note">ผลแบบทดสอบใช้ทบทวนบทเรียน ไม่ใช่คะแนนประเมิน CEFR</p><button class="quick-start" onclick="oQuiz()">สุ่มชุดใหม่ 20 ข้อ</button></div>`;return}const q=qs[idx];$('qol').innerHTML=`<div class="quiz-hd"><h3>Quiz</h3><span class="quiz-score">${idx+1}/${qs.length} · คะแนน ${score}</span><button class="tb-btn" onclick="cQuiz()" aria-label="ปิดแบบทดสอบ">✕</button></div><p class="reference-note">${esc(D.find(t=>t.id===q.tid).en)} · คลัง ${QUIZZES.length} ข้อ</p><div class="quiz-q">${esc(q.q)}</div><div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="ansQuiz(${i})">${esc(o)}</button>`).join('')}</div><div class="quiz-explain" id="qexp" aria-live="polite"></div><button class="quiz-next" id="qnxt" style="background:var(--t3);color:#101b14" onclick="nxtQuiz()">${idx===qs.length-1?'ดูผลคะแนน':'ข้อถัดไป →'}</button>`}
function ansQuiz(i){if(qState.answered)return;const q=qState.qs[qState.idx];if(!q||!Number.isInteger(i)||i<0||i>=q.opts.length)return;qState.answered=true;document.querySelectorAll('.quiz-opt').forEach((btn,j)=>{btn.disabled=true;if(j===q.ans)btn.classList.add('correct');else if(j===i)btn.classList.add('wrong')});if(i===q.ans)qState.score++;$('qexp').innerHTML=`<strong>${i===q.ans?'✓ ถูกต้อง':'ยังไม่ถูก'} · คำตอบ: ${esc(q.opts[q.ans])}</strong><br>${esc(q.explain)}`;$('qexp').style.display='block';$('qnxt').style.display='block';$('qnxt').focus()}
function nxtQuiz(){if(!qState.answered)return;qState.idx++;qState.answered=false;rQuiz();const f=$('qol').querySelector('.quiz-opt');if(f)f.focus()}
// ═══════ REFERENCE PAGES ═══════
function oIV(query=''){csht();$('spIV').innerHTML=`<div class="sp-hd"><button class="tb-btn" onclick="cIV()" aria-label="ปิดตารางกริยา">‹</button><h3>📋 กริยา 3 ช่อง · ${IRREG.length} คำ</h3></div><div class="sp-search"><input id="ivSearch" aria-label="ค้นหากริยาหรือความหมาย" placeholder="ค้นหา V1 / V2 / V3 หรือคำแปลไทย" oninput="fIV(this.value)"></div><div class="sp-body"><p class="reference-note">บางคำมีทั้งรูปปกติและไม่ปกติ / คือรูปที่พบต่างบริบทหรือสำเนียง<br>get: got (BrE) / gotten (AmE บางความหมาย) · read: V1 ออกเสียง /riːd/, V2/V3 /red/<br>bear: born ใช้เรื่องเกิด เช่น was born; borne ใช้ความหมายแบก/ทน · hang (แขวน) ใช้ hung; ความหมายประหารมักใช้ hanged · shine: shined ใช้ขัดเงา; ส่องแสงพบ shone/shined ตามสำเนียง</p><div class="iv-row hdr"><span>V1</span><span>V2</span><span>V3</span><span>ความหมาย</span></div><div id="ivList"></div></div>`;$('ivSearch').value=query;fIV(query);showPanel('spIV')}
function cIV(){hidePanel('spIV')}
function fIV(q){const rows=IRREG.filter(v=>v.join(' ').toLowerCase().includes(q.trim().toLowerCase()));$('ivList').innerHTML=rows.map(v=>`<div class="iv-row">${v.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`).join('')||'<p class="empty-state">ไม่พบคำกริยา</p>'}
function oCW(query=''){csht();$('spCW').innerHTML=`<div class="sp-hd"><button class="tb-btn" onclick="cCW()" aria-label="ปิดคำสับสน">‹</button><h3>🔄 คำที่มักสับสน · ${CONFUSE.length} ชุด</h3></div><div class="sp-search"><input id="cwSearch" aria-label="ค้นหาคำที่มักสับสน" placeholder="ค้นหา เช่น borrow, despite หรือคำแปลไทย" oninput="fCW(this.value)"></div><div class="sp-body" id="cwList"></div>`;$('cwSearch').value=query;fCW(query);showPanel('spCW')}
function cCW(){hidePanel('spCW')}
function fCW(q){q=q.trim().toLowerCase();const rows=CONFUSE.filter(c=>plain(c.pair+' '+c.desc+' '+c.ex).toLowerCase().includes(q));$('cwList').innerHTML=rows.map(c=>`<article class="cw-card"><h4>${esc(c.pair)}</h4><p>${fmt(c.desc)}</p><div class="cw-ex">${fmt(c.ex)}</div></article>`).join('')||'<p class="empty-state">ไม่พบคำที่ค้นหา</p>'}
// Escape closes the top dialog; Tab stays inside the current dialog.
document.addEventListener('keydown',e=>{const id=['sol','qol','spIV','spCW','sh'].find(id=>$(id).classList.contains('show'));if(!id)return;if(e.key==='Escape'){e.preventDefault();({sol:cSearch,qol:cQuiz,spIV:cIV,spCW:cCW,sh:csht})[id]();return}if(e.key==='Tab'){const nodes=[...$(id).querySelectorAll('button:not(:disabled),input,select,a[href],[tabindex="0"]')].filter(n=>n.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||!$(id).contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!$(id).contains(document.activeElement))){e.preventDefault();first.focus()}}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(rM,120)});
// Reading pages share the exact lesson renderer with the map sheet.
let viewMode=readStored('gm-view','reader')==='map'?'map':'reader';
let readingSize=readStored('gm-reading-size',17);if(![17,19,21].includes(readingSize))readingSize=17;
let readingFont=readStored('gm-reading-font','normal');if(!['normal','handwritten'].includes(readingFont))readingFont='normal';
function applyReadingFont(){document.body.setAttribute('data-font',readingFont);const control=$('fontSelect');if(control)control.value=readingFont}
function setReadingFont(value){if(!['normal','handwritten'].includes(value))return;readingFont=value;applyReadingFont();saveStored('gm-reading-font',value)}
let readerPageKey='';
function syncView(){
  applyReadingFont();
  document.body.setAttribute('data-view',viewMode);$('bookShell').hidden=viewMode!=='reader';
  const host=viewMode==='reader'?$('pageContent'):$('sh');if($('si').parentNode!==host)host.appendChild($('si'));
  $('paper').style.setProperty('--read-size',readingSize+'px');
}
function setView(mode){
  if(mode!==viewMode){csht();viewMode=mode;saveStored('gm-view',mode);syncView();rAll();
    if(viewMode==='reader'){if(currentLesson)osht(...currentLesson);else if(currentOverview)oOverview(...currentOverview);else oOverview(S.t,S.b)}
  }
}
function showMap(l,t,b){setView('map');go(l,t,b)}
function setReadingSize(size){if(![17,19,21].includes(size))return;readingSize=size;saveStored('gm-reading-size',size);$('paper').style.setProperty('--read-size',size+'px');renderReadingTools()}
function toggleToc(){const open=!$('bookShell').classList.contains('toc-open');$('bookShell').classList[open?'add':'remove']('toc-open');$('tocToggle').setAttribute('aria-expanded',String(open))}
function readerLesson(tid,bi,ii){osht(tid,bi,ii)}
function presentContent(){
  syncView();
  if(viewMode==='map'){$('ob').classList.add('show');showPanel('sh');$('sh').scrollTop=0;return}
  const [tid,bi,ii]=currentLesson||currentOverview||[null,null];
  S={l:tid===null?0:bi===null?1:2,t:tid,b:bi};
  $('bookShell').classList.remove('toc-open');rTb();rToc();renderReadingTools();
  const key=JSON.stringify(currentLesson||['overview',tid,bi]);
  const t=D.find(t=>t.id===tid),b=t&&bi!==null?t.branches[bi]:null;
  $('paperRunning').textContent=t?String(tid).padStart(2,'0')+' / '+t.en.toUpperCase():'THE ENGLISH GRAMMAR NOTEBOOK';
  const n=currentLesson?LESSONS.findIndex(r=>r.t.id===tid&&r.bi===bi&&r.ii===ii)+1:null;
  $('paperFooter').textContent=n?'บทเรียน '+String(n).padStart(3,'0')+' / '+LESSONS.length+' · '+b.en:'ภาพรวม · '+(b?b.en:t?t.en:'English Grammar');
  if(key!==readerPageKey){$('paper').scrollIntoView({block:'start',behavior:'instant'});const title=$('si').querySelector('h3');if(title){title.setAttribute('tabindex','-1');title.focus({preventScroll:true})}readerPageKey=key}
}
function renderReadingTools(){
  const {done,total}=counts();
  $('readingTools').innerHTML=`<button class="mobile-toc" id="tocToggle" aria-controls="bookToc" aria-expanded="${$('bookShell').classList.contains('toc-open')}" onclick="toggleToc()">☰ สารบัญ</button><span>อ่านทีละเรื่อง ค่อย ๆ เข้าใจ · ${done}/${total} บท</span><div aria-label="ขนาดตัวอักษร">${[17,19,21].map((n,i)=>`<button aria-label="ตัวอักษร ${['ปกติ','ใหญ่','ใหญ่พิเศษ'][i]}" aria-pressed="${readingSize===n}" onclick="setReadingSize(${n})">${['ก','ก +','ก ++'][i]}</button>`).join('')}</div>`;
}
function rToc(){
  if(viewMode!=='reader')return;
  const {done,total}=counts(),active=(tid,bi,ii)=>currentLesson?currentLesson[0]===tid&&currentLesson[1]===bi&&currentLesson[2]===ii:ii===undefined&&currentOverview&&currentOverview[0]===tid&&currentOverview[1]===bi;
  const aria=(tid,bi,ii)=>active(tid,bi,ii)?' aria-current="page"':'';
  let h='<div class="toc-label">CONTENTS / สารบัญ</div>'+`<button class="toc-root"${aria(null,null)} onclick="oOverview()">หน้าบทนำ · English Grammar</button><button class="toc-start" onclick="oOverview(3,3)">เริ่มเรียนจากศูนย์ ↗</button>`;
  h+=D.map(t=>`<details class="toc-topic" style="--accent:${CL[t.id]}" ${S.t===t.id?'open':''}><summary><span class="chapter-number">${String(t.id).padStart(2,'0')}</span><span>${esc(t.en)}</span></summary><button class="toc-overview"${aria(t.id,null)} onclick="oOverview(${t.id})">อ่านภาพรวม · ${esc(t.th)}</button>${t.branches.map((b,bi)=>`<details class="toc-branch" ${S.t===t.id&&S.b===bi?'open':''}><summary>${esc(b.en)}</summary><button class="toc-overview"${aria(t.id,bi)} onclick="oOverview(${t.id},${bi})">บทนำ · ${esc(b.th)}</button>${b.items.map((it,ii)=>`<button class="toc-lesson"${aria(t.id,bi,ii)} onclick="readerLesson(${t.id},${bi},${ii})"><span>${progress[t.id+'-'+it.en]?'✓':ii+1}</span><span>${esc(it.en)}${bookmarks.includes(t.id+'-'+it.en)?' ⭐':''}</span></button>`).join('')}</details>`).join('')}</details>`).join('');
  h+=`<div class="book-tools"><button onclick="oIV()">กริยา 3 ช่อง</button><button onclick="oCW()">คำสับสน</button><button onclick="oQuiz()">Quiz 20 ข้อ</button><button onclick="oSearch('bookmarks')">⭐ ที่คั่นไว้</button></div><p class="book-progress">เรียนแล้ว ${done} จาก ${total} บท<br>ค่อย ๆ เติมความรู้ วันละหน้า${storageWarning?'<br><span class="storage-warning">บันทึกสถานะไม่ได้ในเบราว์เซอร์นี้</span>':''}</p>`;
  const scroll=$('bookToc').scrollTop;$('bookToc').innerHTML=h;$('bookToc').scrollTop=scroll;
}

rAll();if(viewMode==='reader')oOverview();
</script>
</body>
