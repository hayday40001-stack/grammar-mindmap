<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grammar Mind Map</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#151a16;--bg2:#1b211c;--sf:#222a24;--sf2:#2a3430;
  --tx:#e4e2d8;--dm:#7d8a7f;
  --t1:#2fb8a0;--t1l:#7dddc8;
  --t2:#dea02c;--t2l:#f0cc6a;
  --t3:#5aad3e;--t3l:#8fd07a;
  --t4:#cc7e4e;--t4l:#e8a87a;
  --t5:#8db860;--t5l:#b5d48e;
  --t6:#bfa058;--t6l:#dbc48a;
}
html{font-size:15px;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Thai','Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:.5rem;padding:.65rem .8rem;background:var(--bg2);border-bottom:1px solid #ffffff08;position:sticky;top:0;z-index:50}
.topbar .back{width:34px;height:34px;border-radius:10px;border:none;background:var(--sf);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.topbar .back:hover{background:var(--sf2)}
.topbar .back.hid{visibility:hidden}
.topbar .cr{display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--dm);overflow:hidden;white-space:nowrap;flex:1}
.topbar .cr span{cursor:pointer}.topbar .cr .sep{opacity:.3;cursor:default}.topbar .cr .cur{color:var(--tx);font-weight:600;cursor:default;overflow:hidden;text-overflow:ellipsis}
.mm-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:.8rem}
.mm-c{position:relative;width:100%;max-width:720px;aspect-ratio:1/1}
.mm-c.wide{aspect-ratio:4/3}
.mm-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.mm-line{fill:none;stroke-width:2;stroke-linecap:round;opacity:0;animation:li .5s ease forwards}
@keyframes li{to{opacity:.4}}
.mm-n{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transform:translate(-50%,-50%) scale(0);animation:ni .4s cubic-bezier(.34,1.56,.64,1) forwards;transition:transform .15s;-webkit-user-select:none;user-select:none;line-height:1.25}
.mm-n:active{transform:translate(-50%,-50%) scale(.92)!important}
@keyframes ni{to{transform:translate(-50%,-50%) scale(1)}}
.nc{width:105px;height:105px;border-radius:50%;font-weight:700;font-size:.78rem;color:#fff;z-index:5}
.nc .sub{font-size:.56rem;font-weight:400;opacity:.7;margin-top:2px}
.nb{min-width:85px;max-width:125px;padding:9px 13px;border-radius:40px;font-weight:600;font-size:.64rem;color:#fff}
.nb .nth{font-size:.54rem;font-weight:400;opacity:.7;margin-top:1px}
.nb:hover{z-index:10}
.nl{min-width:76px;max-width:115px;padding:7px 11px;border-radius:28px;font-weight:600;font-size:.58rem;color:#fff}
.nl .nth{font-size:.48rem;font-weight:400;opacity:.65;margin-top:1px}
.tnav{display:flex;gap:5px;padding:7px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border-top:1px solid #ffffff08;scrollbar-width:none}
.tnav::-webkit-scrollbar{display:none}
.tnav .ch{flex-shrink:0;padding:5px 12px;border-radius:18px;font-size:.65rem;font-weight:600;cursor:pointer;border:1.5px solid;background:transparent;transition:background .15s;white-space:nowrap}
.tnav .ch:active{transform:scale(.93)}
.tnav .ch.on{color:#fff}
/* sheet */
.obg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none}
.obg.show{opacity:1;pointer-events:auto}
.sht{position:fixed;bottom:0;left:0;right:0;z-index:101;background:var(--bg2);border-radius:18px 18px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding:0 0 env(safe-area-inset-bottom)}
.sht.show{transform:translateY(0)}
.sht::-webkit-scrollbar{width:4px}.sht::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:2px}
.sh-bar{width:34px;height:4px;border-radius:2px;background:#ffffff20;margin:8px auto 4px}
.sh-hd{padding:4px 18px 10px;border-bottom:1px solid #ffffff08}
.sh-hd h3{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700}
.sh-hd .sth{font-size:.78rem;color:var(--dm);margin-top:1px}
.sh-bd{padding:14px 18px 22px}
.s-sec{margin-bottom:14px}
.s-label{font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.s-label .ico{font-style:normal;font-size:.8rem}
.s-desc{font-size:.84rem;line-height:1.75;color:var(--tx)}
.s-form{background:var(--sf);border-radius:10px;padding:10px 14px;font-family:'Outfit',monospace;font-size:.76rem;line-height:1.6;border-left:3px solid;white-space:pre-wrap}
.s-ex{background:var(--sf);border-radius:10px;padding:10px 14px;font-size:.8rem;line-height:1.8}
.s-ex .hi{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.s-ex .trn{color:var(--dm);font-size:.75rem;font-style:italic}
.s-tip{background:var(--sf);border-radius:10px;padding:10px 14px;font-size:.8rem;line-height:1.75;border-left:3px solid #5aad3e88}
.s-mis{background:#cc7e4e0c;border-radius:10px;padding:10px 14px;font-size:.8rem;line-height:1.75;border-left:3px solid #cc7e4e88}
.s-sig{display:flex;flex-wrap:wrap;gap:5px}
.s-sig span{padding:3px 10px;border-radius:14px;font-size:.72rem;font-weight:500}
.sh-nav{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid #ffffff08}
.sh-nav button{flex:1;padding:9px;border-radius:10px;border:1px solid;background:transparent;cursor:pointer;font-size:.72rem;font-family:inherit;transition:background .15s}
.sh-nav button:active{transform:scale(.96)}
@media(max-width:500px){
  .nc{width:78px;height:78px;font-size:.64rem}.nc .sub{font-size:.48rem}
  .nb{min-width:66px;max-width:100px;padding:7px 9px;font-size:.55rem}.nb .nth{font-size:.46rem}
  .nl{min-width:62px;max-width:95px;padding:6px 8px;font-size:.5rem}.nl .nth{font-size:.42rem}
}
</style>
</head>
<body>
<div class="topbar" id="tb"></div>
<div class="mm-area" id="ma"><div class="mm-c" id="mc"></div></div>
<div class="tnav" id="tn"></div>
<div class="obg" id="ob" onclick="csht()"></div>
<div class="sht" id="sh"><div class="sh-bar"></div><div id="si"></div></div>
<script>
const CR=['','#2fb8a0','#dea02c','#5aad3e','#cc7e4e','#8db860','#bfa058'];
const CL=['','#7dddc8','#f0cc6a','#8fd07a','#e8a87a','#b5d48e','#dbc48a'];

const D=[
// ══════════════════════════════════════
// 1. PARTS OF SPEECH
// ══════════════════════════════════════
{id:1,en:"Parts of Speech",th:"ชนิดและหน้าที่ของคำ",branches:[
{en:"Nouns",th:"คำนาม",items:[
{en:"Noun คืออะไร?",th:"ความหมายของคำนาม",
desc:"<b>คำนาม (Noun)</b> คือ คำที่ใช้เรียกชื่อ <b>คน สัตว์ สิ่งของ สถานที่ หรือความคิด</b>\n\nทุกประโยคภาษาอังกฤษต้องมีคำนามอย่างน้อย 1 ตัว เพราะคำนามทำหน้าที่เป็น \"ประธาน\" หรือ \"กรรม\" ของประโยค\n\nพูดง่ายๆ ถ้าเราชี้ไปที่สิ่งใดสิ่งหนึ่งแล้วถามว่า \"นี่คืออะไร?\" คำตอบก็คือ Noun",
ex:"🐶 <hi>dog</hi> (สุนัข) — สัตว์\n🏫 <hi>school</hi> (โรงเรียน) — สถานที่\n💡 <hi>idea</hi> (ความคิด) — นามธรรม\n👩 <hi>teacher</hi> (ครู) — คน\n📱 <hi>phone</hi> (โทรศัพท์) — สิ่งของ"},

{en:"Common Noun",th:"คำนามทั่วไป",
desc:"<b>Common Noun</b> คือ คำนามที่ใช้เรียกสิ่งของทั่วไป <b>ไม่ได้เจาะจง</b>ว่าเป็นใครหรืออะไร\n\n• ขึ้นต้นด้วย<b>ตัวพิมพ์เล็ก</b>เสมอ (ยกเว้นขึ้นต้นประโยค)\n• ใช้ a/an นำหน้าได้ (ถ้านับได้ + เอกพจน์)\n• แบ่งเป็น นับได้ (countable) และ นับไม่ได้ (uncountable)",
ex:"I saw a <hi>cat</hi>. <span class='trn'>(ฉันเห็นแมวตัวหนึ่ง)</span>\nThe <hi>city</hi> is big. <span class='trn'>(เมืองนั้นใหญ่)</span>\nShe needs a <hi>chair</hi>. <span class='trn'>(เธอต้องการเก้าอี้)</span>",
tips:"ถ้าไม่แน่ใจว่าเป็น Common หรือ Proper ให้ดู: ถ้าเปลี่ยนเป็นตัวอื่นได้ (dog → cat) = Common Noun",
mis:"❌ I like Dog. (ผิด — ไม่ต้องพิมพ์ใหญ่)\n✅ I like <hi>dogs</hi>. (ถูก — ตัวเล็ก + พหูพจน์เพราะพูดทั่วไป)"},

{en:"Proper Noun",th:"คำนามเฉพาะ",
desc:"<b>Proper Noun</b> คือ ชื่อเฉพาะของคน สถานที่ องค์กร วัน เดือน ฯลฯ\n\n• ขึ้นต้นด้วย<b>ตัวพิมพ์ใหญ่ (Capital Letter) เสมอ</b>\n• ไม่ใช้ a/an นำหน้า (ยกเว้นบางกรณี)\n• เป็นชื่อเฉพาะที่ไม่สามารถเปลี่ยนเป็นอย่างอื่นได้",
ex:"<hi>Bangkok</hi> is beautiful. <span class='trn'>(กรุงเทพฯ สวยงาม)</span>\nI work at <hi>Google</hi>. <span class='trn'>(ฉันทำงานที่กูเกิล)</span>\nSee you on <hi>Monday</hi>. <span class='trn'>(เจอกันวันจันทร์)</span>",
tips:"วิธีจำ: ถ้ามีชื่อแค่หนึ่งเดียวในโลก = Proper Noun → ขึ้นต้นพิมพ์ใหญ่\nชื่อวัน เดือน ภาษา สัญชาติ → Proper Noun เสมอ",
mis:"❌ i live in bangkok.\n✅ <hi>I</hi> live in <hi>Bangkok</hi>. (ทั้ง I และ Bangkok ต้องตัวใหญ่)"},

{en:"Countable Noun",th:"คำนามนับได้",
desc:"<b>Countable Noun</b> คือ คำนามที่<b>นับจำนวนได้</b> เช่น 1 ตัว 2 ตัว 3 ตัว\n\n• มี<b>รูปเอกพจน์</b> (singular: a book) และ<b>พหูพจน์</b> (plural: books)\n• ใช้ a/an + เอกพจน์ได้\n• ใช้ many, few, a few, several + พหูพจน์ได้\n• เติม -s/-es เพื่อทำพหูพจน์ (มีข้อยกเว้น เช่น child → children)",
formula:"เอกพจน์: a/an + noun → a book, an apple\nพหูพจน์: noun + s/es → books, boxes\nพิเศษ: man→men, child→children, tooth→teeth",
ex:"I have <hi>a book</hi>. <span class='trn'>(ฉันมีหนังสือ 1 เล่ม)</span>\nShe bought three <hi>apples</hi>. <span class='trn'>(เธอซื้อแอปเปิ้ล 3 ลูก)</span>\nThere are many <hi>children</hi>. <span class='trn'>(มีเด็กหลายคน)</span>",
mis:"❌ I have many <hi>book</hi>. (ผิด — many ต้องตามด้วยพหูพจน์)\n✅ I have many <hi>books</hi>."},

{en:"Uncountable Noun",th:"คำนามนับไม่ได้",
desc:"<b>Uncountable Noun</b> คือ คำนามที่<b>นับจำนวนไม่ได้</b> ไม่มีรูปพหูพจน์\n\n• ห้ามใช้ a/an นำหน้า\n• ห้ามเติม -s\n• ใช้ much, little, a little, some, a lot of\n• ถ้าจะนับ ต้องใช้หน่วยนับ เช่น a glass of water, a piece of advice\n\nตัวอย่าง: water, money, information, advice, music, rice, news, furniture",
ex:"I need some <hi>water</hi>. <span class='trn'>(ฉันต้องการน้ำ)</span>\nShe gave me good <hi>advice</hi>. <span class='trn'>(เธอให้คำแนะนำดีๆ)</span>\n<hi>Money</hi> is important. <span class='trn'>(เงินเป็นสิ่งสำคัญ)</span>",
tips:"คำที่คนไทยมักสับสน:\n• information (ไม่ใช่ informations)\n• furniture (ไม่ใช่ furnitures)\n• news (ไม่ใช่ a news — ใช้ a piece of news)",
mis:"❌ I need <hi>an advice</hi>.\n✅ I need <hi>some advice</hi> / <hi>a piece of advice</hi>."},

{en:"Collective Noun",th:"คำนามรวมหมู่",
desc:"<b>Collective Noun</b> คือ คำนามที่ใช้เรียก<b>กลุ่ม</b>ของคน สัตว์ หรือสิ่งของ\n\nแม้จะหมายถึงหลายตัว/หลายคน แต่ถือเป็น<b>เอกพจน์</b> (ใช้กริยาเอกพจน์) เมื่อพูดถึงทั้งกลุ่ม",
ex:"A <hi>team</hi> of players <hi>is</hi> practicing. <span class='trn'>(ทีมกำลังซ้อม)</span>\nA <hi>flock</hi> of birds flew away. <span class='trn'>(ฝูงนกบินไป)</span>\nMy <hi>family</hi> is big. <span class='trn'>(ครอบครัวฉันใหญ่)</span>\nThe <hi>audience</hi> was excited. <span class='trn'>(ผู้ชมตื่นเต้น)</span>",
tips:"คำที่ใช้บ่อย: team, family, group, class, audience, crowd, staff, committee, army, flock, herd, pack"},

{en:"Abstract Noun",th:"คำนามนามธรรม",
desc:"<b>Abstract Noun</b> คือ คำนามที่หมายถึงสิ่งที่<b>จับต้องไม่ได้</b> มองไม่เห็น แต่รู้สึกได้\n\nเช่น ความรู้สึก แนวคิด คุณสมบัติ สถานะ\n\nส่วนใหญ่เป็น <b>Uncountable</b> (นับไม่ได้)",
ex:"<hi>Love</hi> is blind. <span class='trn'>(ความรักทำให้ตาบอด)</span>\n<hi>Happiness</hi> comes from within. <span class='trn'>(ความสุขมาจากภายใน)</span>\nI admire her <hi>courage</hi>. <span class='trn'>(ฉันชื่นชมความกล้าของเธอ)</span>",
tips:"วิธีสร้าง Abstract Noun จากคำอื่น:\n• kind → kind<b>ness</b> (ความใจดี)\n• free → free<b>dom</b> (อิสรภาพ)\n• child → child<b>hood</b> (วัยเด็ก)\n• friend → friend<b>ship</b> (มิตรภาพ)"},
]},

{en:"Pronouns",th:"สรรพนาม",items:[
{en:"Pronoun คืออะไร?",th:"ความหมายของสรรพนาม",
desc:"<b>Pronoun (สรรพนาม)</b> คือ คำที่ใช้<b>แทนคำนาม</b> เพื่อไม่ต้องพูดซ้ำ\n\nเช่น แทนที่จะพูดว่า \"สมชายไปตลาด สมชายซื้อผลไม้\" → \"สมชายไปตลาด <b>เขา</b>ซื้อผลไม้\"\n\nภาษาอังกฤษมี Pronoun หลายแบบ แต่ละแบบทำหน้าที่ต่างกัน",
ex:"<hi>Tom</hi> is kind. <hi>He</hi> helps everyone.\n<span class='trn'>(ทอมใจดี เขาช่วยทุกคน — He แทน Tom)</span>"},

{en:"Subject Pronouns",th:"สรรพนามทำหน้าที่ประธาน",
desc:"ใช้เป็น<b>ประธาน</b>ของประโยค (ผู้กระทำ)\n\n<b>I</b> (ฉัน), <b>you</b> (คุณ), <b>he</b> (เขาผู้ชาย), <b>she</b> (เธอผู้หญิง), <b>it</b> (มัน), <b>we</b> (พวกเรา), <b>they</b> (พวกเขา)",
formula:"I → ฉัน (พูดถึงตัวเอง)\nyou → คุณ (คนที่คุยด้วย)\nhe → เขา (ผู้ชาย)\nshe → เธอ (ผู้หญิง)\nit → มัน (สัตว์/สิ่งของ)\nwe → พวกเรา\nthey → พวกเขา",
ex:"<hi>I</hi> am a student. <span class='trn'>(ฉันเป็นนักเรียน)</span>\n<hi>She</hi> likes coffee. <span class='trn'>(เธอชอบกาแฟ)</span>\n<hi>They</hi> are coming. <span class='trn'>(พวกเขากำลังมา)</span>",
mis:"❌ <hi>Me</hi> am happy. (ผิด — me เป็น object ไม่ใช่ subject)\n✅ <hi>I</hi> am happy."},

{en:"Object Pronouns",th:"สรรพนามทำหน้าที่กรรม",
desc:"ใช้เป็น<b>กรรม</b>ของประโยค (ผู้ถูกกระทำ) หรือหลัง preposition\n\n<b>me, you, him, her, it, us, them</b>",
formula:"I → me\nyou → you\nhe → him\nshe → her\nit → it\nwe → us\nthey → them",
ex:"She loves <hi>me</hi>. <span class='trn'>(เธอรักฉัน)</span>\nI called <hi>him</hi>. <span class='trn'>(ฉันโทรหาเขา)</span>\nGive it to <hi>them</hi>. <span class='trn'>(ให้มันกับพวกเขา)</span>",
mis:"❌ She loves <hi>I</hi>. (ผิด)\n✅ She loves <hi>me</hi>. (ถูก — ตำแหน่งกรรมใช้ me)"},

{en:"Possessive",th:"สรรพนามแสดงเจ้าของ",
desc:"แบ่ง 2 ชนิด:\n\n<b>Possessive Adjective</b> (วางหน้านาม): my, your, his, her, its, our, their\n<b>Possessive Pronoun</b> (ใช้แทนนาม): mine, yours, his, hers, ours, theirs",
formula:"my + noun → mine (ไม่ต้องมีนามตาม)\nyour + noun → yours\nhis + noun → his\nher + noun → hers\nour + noun → ours\ntheir + noun → theirs",
ex:"This is <hi>my</hi> book. <span class='trn'>(นี่คือหนังสือของฉัน)</span>\nThat book is <hi>mine</hi>. <span class='trn'>(หนังสือเล่มนั้นเป็นของฉัน)</span>\n<hi>Their</hi> house is big. <span class='trn'>(บ้านของพวกเขาใหญ่)</span>",
mis:"❌ This is <hi>mines</hi>. (ผิด — mine ไม่เติม s)\n✅ This is <hi>mine</hi>."},

{en:"Reflexive",th:"สรรพนามสะท้อนกลับ",
desc:"ใช้เมื่อ<b>ประธานและกรรมเป็นคน/สิ่งเดียวกัน</b> ลงท้ายด้วย -self (เอกพจน์) / -selves (พหูพจน์)\n\nmyself, yourself, himself, herself, itself, ourselves, yourselves, themselves",
ex:"I taught <hi>myself</hi> English. <span class='trn'>(ฉันสอนตัวเองภาษาอังกฤษ)</span>\nShe hurt <hi>herself</hi>. <span class='trn'>(เธอทำตัวเองเจ็บ)</span>\nThey enjoyed <hi>themselves</hi>. <span class='trn'>(พวกเขาสนุกกัน)</span>",
tips:"ใช้เน้นย้ำได้: I did it <b>myself</b>! (ฉันทำเองเลย!)"},

{en:"Relative Pronouns",th:"สรรพนามเชื่อมประโยค",
desc:"ใช้<b>เชื่อม 2 ประโยค</b>เข้าด้วยกัน โดยขยายคำนามที่อยู่ข้างหน้า\n\n<b>who</b> (คน - ประธาน), <b>whom</b> (คน - กรรม), <b>whose</b> (ของใคร), <b>which</b> (สิ่งของ/สัตว์), <b>that</b> (คน/สิ่งของ)",
ex:"The girl <hi>who</hi> sings is my sister. <span class='trn'>(ผู้หญิงที่ร้องเพลงคือน้องสาวฉัน)</span>\nThe book <hi>which</hi> I bought is great. <span class='trn'>(หนังสือที่ฉันซื้อดีมาก)</span>\nThe man <hi>whose</hi> car broke down called. <span class='trn'>(ชายที่รถเสียโทรมา)</span>",
tips:"who = คน (ทำเป็นประธาน)\nwhich = สิ่งของ/สัตว์\nthat = ใช้แทนได้ทั้ง who และ which"},
]},

{en:"Verbs",th:"คำกริยา",items:[
{en:"Verb คืออะไร?",th:"ความหมายของคำกริยา",
desc:"<b>Verb (กริยา)</b> คือ คำที่แสดง<b>การกระทำ (action)</b> หรือ<b>สภาวะ (state)</b>\n\nทุกประโยคภาษาอังกฤษ<b>ต้องมี Verb</b> ถ้าไม่มี = ไม่ใช่ประโยค\n\nVerb เป็นหัวใจของประโยค เพราะบอกว่าประธาน \"ทำอะไร\" หรือ \"เป็นอะไร\"",
ex:"She <hi>runs</hi> fast. <span class='trn'>(เธอวิ่งเร็ว — กระทำ)</span>\nI <hi>am</hi> happy. <span class='trn'>(ฉันมีความสุข — สภาวะ)</span>\nHe <hi>thinks</hi> a lot. <span class='trn'>(เขาคิดมาก — กระทำทางจิต)</span>"},

{en:"Action Verbs",th:"กริยาแสดงการกระทำ",
desc:"คำกริยาที่แสดง<b>การกระทำจริงๆ</b> ทั้งทางกายภาพและทางจิต\n\n<b>ทางกาย:</b> run, eat, write, play, walk, sing, cook\n<b>ทางจิต:</b> think, believe, know, understand, remember",
ex:"She <hi>plays</hi> guitar. <span class='trn'>(เธอเล่นกีตาร์ — ทางกาย)</span>\nI <hi>believe</hi> you. <span class='trn'>(ฉันเชื่อคุณ — ทางจิต)</span>\nThey <hi>cook</hi> dinner. <span class='trn'>(พวกเขาทำอาหารเย็น)</span>"},

{en:"Linking Verbs",th:"กริยาเชื่อม",
desc:"<b>Linking Verb</b> ไม่ได้แสดงการกระทำ แต่<b>เชื่อมประธานกับคำอธิบาย</b> (complement)\n\nที่พบบ่อยที่สุดคือ <b>be (am, is, are, was, were)</b>\n\nอื่นๆ: seem, become, feel, look, smell, taste, sound, appear, remain",
formula:"ประธาน + Linking Verb + คำอธิบาย\nShe + is + a doctor.\nThe soup + smells + good.",
ex:"She <hi>is</hi> a doctor. <span class='trn'>(เธอเป็นหมอ)</span>\nThe food <hi>smells</hi> delicious. <span class='trn'>(อาหารมีกลิ่นอร่อย)</span>\nHe <hi>became</hi> famous. <span class='trn'>(เขากลายเป็นคนดัง)</span>",
tips:"วิธีทดสอบ: ลองเปลี่ยนเป็น is/am/are ถ้าความหมายยังเหมือนเดิม = Linking Verb\nThe soup <b>smells</b> good = The soup <b>is</b> good ✅ = Linking"},

{en:"Auxiliary Verbs",th:"กริยาช่วย (be, have, do)",
desc:"<b>Auxiliary Verbs</b> คือ กริยาที่<b>ช่วยกริยาหลัก</b>ในการสร้าง tense, คำถาม และปฏิเสธ\n\nมี 3 ตัวหลัก:\n<b>be</b> (am/is/are/was/were) → สร้าง Continuous\n<b>have</b> (have/has/had) → สร้าง Perfect\n<b>do</b> (do/does/did) → สร้างคำถาม/ปฏิเสธ",
ex:"She <hi>is</hi> reading. <span class='trn'>(เธอกำลังอ่าน — is ช่วย read)</span>\nI <hi>have</hi> finished. <span class='trn'>(ฉันทำเสร็จแล้ว — have ช่วย finish)</span>\n<hi>Do</hi> you like it? <span class='trn'>(คุณชอบมันไหม? — do ช่วยสร้างคำถาม)</span>\nI <hi>don't</hi> know. <span class='trn'>(ฉันไม่รู้ — do+not ช่วยปฏิเสธ)</span>"},

{en:"Modal Verbs",th:"กริยาช่วยแสดงนัย",
desc:"<b>Modal Verbs</b> คือ กริยาพิเศษที่แสดง<b>ความสามารถ ความเป็นไปได้ การอนุญาต คำแนะนำ ความจำเป็น</b>\n\nตามด้วย <b>V1 (base form) เสมอ ไม่เติม s/ed/ing</b>\n\n<b>can</b> (ทำได้), <b>could</b> (ทำได้ในอดีต/สุภาพ), <b>may</b> (อาจจะ/ขออนุญาต), <b>might</b> (อาจจะ-น้อยกว่า may), <b>should</b> (ควร), <b>must</b> (ต้อง), <b>will</b> (จะ), <b>would</b> (จะ-สุภาพ/สมมติ)",
ex:"I <hi>can</hi> swim. <span class='trn'>(ฉันว่ายน้ำได้)</span>\nYou <hi>should</hi> study. <span class='trn'>(คุณควรเรียน)</span>\nShe <hi>must</hi> go now. <span class='trn'>(เธอต้องไปตอนนี้)</span>\nIt <hi>might</hi> rain. <span class='trn'>(ฝนอาจจะตก)</span>",
mis:"❌ She can <hi>swims</hi>. (ผิด — หลัง modal ห้ามเติม s)\n✅ She can <hi>swim</hi>."},
]},

{en:"Adjectives",th:"คุณศัพท์",items:[
{en:"Adjective คืออะไร?",th:"ความหมายของคำคุณศัพท์",
desc:"<b>Adjective (คุณศัพท์)</b> คือ คำที่ใช้<b>ขยายนาม</b> บอกว่านามนั้นเป็นอย่างไร\n\nบอก ลักษณะ ขนาด สี จำนวน ความรู้สึก ฯลฯ\n\nวาง<b>หน้านาม</b> (a big house) หรือ<b>หลัง linking verb</b> (She is beautiful)",
ex:"She has a <hi>red</hi> car. <span class='trn'>(เธอมีรถสีแดง — หน้านาม)</span>\nThe movie is <hi>interesting</hi>. <span class='trn'>(หนังน่าสนใจ — หลัง is)</span>\nI want <hi>cold</hi> water. <span class='trn'>(ฉันต้องการน้ำเย็น)</span>",
tips:"ภาษาอังกฤษ adjective <b>ไม่มีพหูพจน์</b>:\n❌ beautifuls houses\n✅ beautiful houses"},

{en:"Comparative",th:"ขั้นเปรียบเทียบ (กว่า)",
desc:"ใช้<b>เปรียบเทียบ 2 สิ่ง</b> ว่าอะไร \"มากกว่า\"\n\n<b>คำสั้น (1-2 พยางค์):</b> เติม -er\n<b>คำยาว (3+ พยางค์):</b> ใช้ more + adj\n\nตามด้วย <b>than</b> (กว่า)",
formula:"คำสั้น: adj + er + than\n  tall → taller than\n  big → bigger than (พยัญชนะซ้ำ)\nคำยาว: more + adj + than\n  beautiful → more beautiful than\nพิเศษ: good → better / bad → worse",
ex:"Tom is <hi>taller than</hi> Jerry. <span class='trn'>(ทอมสูงกว่าเจอร์รี่)</span>\nThis book is <hi>more interesting than</hi> that one. <span class='trn'>(หนังสือเล่มนี้น่าสนใจกว่าเล่มนั้น)</span>\nShe is <hi>better</hi> at math <hi>than</hi> me. <span class='trn'>(เธอเก่งคณิตกว่าฉัน)</span>"},

{en:"Superlative",th:"ขั้นสูงสุด (ที่สุด)",
desc:"ใช้บอกว่าสิ่งใดสิ่งหนึ่ง<b>เหนือกว่าทั้งหมดในกลุ่ม</b>\n\n<b>คำสั้น:</b> the + adj + est\n<b>คำยาว:</b> the most + adj\n\nใช้ <b>the</b> นำหน้าเสมอ",
formula:"คำสั้น: the + adj + est\n  tall → the tallest\nคำยาว: the most + adj\n  beautiful → the most beautiful\nพิเศษ: good → the best / bad → the worst",
ex:"She is <hi>the tallest</hi> in class. <span class='trn'>(เธอสูงที่สุดในห้อง)</span>\nThis is <hi>the most delicious</hi> food. <span class='trn'>(นี่คืออาหารอร่อยที่สุด)</span>\nHe is <hi>the best</hi> player. <span class='trn'>(เขาเป็นผู้เล่นที่ดีที่สุด)</span>"},

{en:"Order of Adjectives",th:"ลำดับคุณศัพท์",
desc:"เมื่อใช้ adjective หลายตัวหน้านาม ต้องเรียง<b>ตามลำดับ</b>:\n\n<b>O-S-A-S-C-O-M-P</b>\nOpinion → Size → Age → Shape → Color → Origin → Material → Purpose",
formula:"Opinion: beautiful, ugly, nice\nSize: big, small, tall\nAge: old, new, young\nShape: round, square, flat\nColor: red, blue, green\nOrigin: Thai, Japanese, American\nMaterial: wooden, metal, cotton\nPurpose: sleeping (bag), running (shoes)",
ex:"A <hi>beautiful small old round red Italian leather racing</hi> car.\n<span class='trn'>(รถแข่งหนังอิตาลีสีแดงทรงกลมเก่าเล็กสวยงาม)</span>",
tips:"ไม่ต้องท่องจำทั้งหมด — ในชีวิตจริงแทบไม่มีใครใช้ adj เกิน 2-3 ตัว\nจำง่ายๆ: ความเห็น → ข้อเท็จจริง → ต้นกำเนิด"},
]},

{en:"Adverbs",th:"คำกริยาวิเศษณ์",items:[
{en:"Adverb คืออะไร?",th:"ความหมาย",
desc:"<b>Adverb (กริยาวิเศษณ์)</b> คือ คำที่ขยาย<b>กริยา, คุณศัพท์, หรือ adverb ตัวอื่น</b>\n\nบอกว่าทำ<b>อย่างไร (how), ที่ไหน (where), เมื่อไหร่ (when), บ่อยแค่ไหน (how often), มากแค่ไหน (how much)</b>\n\nส่วนใหญ่สร้างจาก adjective + <b>ly</b>: quick → quickly, careful → carefully",
ex:"She sings <hi>beautifully</hi>. <span class='trn'>(เธอร้องเพลงอย่างไพเราะ — how)</span>\nHe is <hi>very</hi> tall. <span class='trn'>(เขาสูงมาก — ขยาย adj)</span>\nI <hi>always</hi> eat breakfast. <span class='trn'>(ฉันกินอาหารเช้าเสมอ — how often)</span>",
tips:"ระวัง! ไม่ใช่ทุกคำที่ลงท้าย -ly จะเป็น adverb:\nfriendly, lovely, lonely → เป็น adjective!\n\nบาง adverb ไม่มี -ly:\nfast, hard, well, late, early"},

{en:"Frequency Adverbs",th:"บอกความถี่",
desc:"บอกว่าทำ<b>บ่อยแค่ไหน</b> — วางหลัง be / หน้ากริยาทั่วไป\n\n<b>always</b> (เสมอ 100%), <b>usually</b> (โดยปกติ 80%), <b>often</b> (บ่อย 60%), <b>sometimes</b> (บางครั้ง 40%), <b>rarely/seldom</b> (แทบไม่ 10%), <b>never</b> (ไม่เลย 0%)",
formula:"ตำแหน่ง:\nหลัง be: She is always late.\nหน้า V ทั่วไป: I usually eat rice.\nต้นประโยค (sometimes/usually): Sometimes I walk.",
ex:"She <hi>always</hi> smiles. <span class='trn'>(เธอยิ้มเสมอ)</span>\nI <hi>never</hi> drink alcohol. <span class='trn'>(ฉันไม่ดื่มเหล้าเลย)</span>\nHe is <hi>usually</hi> on time. <span class='trn'>(เขามักจะตรงเวลา)</span>"},
]},

{en:"Prepositions",th:"คำบุพบท",items:[
{en:"Preposition คืออะไร?",th:"ความหมาย",
desc:"<b>Preposition (บุพบท)</b> คือ คำที่บอก<b>ความสัมพันธ์</b>ระหว่างคำนามกับส่วนอื่นของประโยค\n\nบอก ตำแหน่ง ทิศทาง เวลา ความเป็นเจ้าของ ฯลฯ\n\nตามด้วย <b>noun / pronoun / gerund (V-ing)</b> เสมอ",
ex:"The cat is <hi>on</hi> the table. <span class='trn'>(แมวอยู่บนโต๊ะ)</span>\nI go <hi>to</hi> school. <span class='trn'>(ฉันไปโรงเรียน)</span>\nShe is good <hi>at</hi> singing. <span class='trn'>(เธอร้องเพลงเก่ง)</span>"},
{en:"in / on / at (Time)",th:"บุพบทบอกเวลา",
desc:"<b>at</b> = เวลาเจาะจง: at 5 PM, at night, at noon\n<b>on</b> = วัน/วันที่: on Monday, on January 1st\n<b>in</b> = เดือน/ปี/ช่วง: in May, in 2024, in the morning\n\nจำง่ายๆ: <b>at จุดเล็ก → on ใหญ่ขึ้น → in ใหญ่สุด</b>",
ex:"I wake up <hi>at</hi> 6 AM. <span class='trn'>(ฉันตื่นตอน 6 โมงเช้า)</span>\nShe was born <hi>on</hi> March 5th. <span class='trn'>(เธอเกิดวันที่ 5 มีนาคม)</span>\nWe travel <hi>in</hi> summer. <span class='trn'>(เราเดินทางในหน้าร้อน)</span>",
mis:"❌ I was born <hi>in</hi> Monday.\n✅ I was born <hi>on</hi> Monday. (วัน ใช้ on)"},
{en:"in / on / at (Place)",th:"บุพบทบอกสถานที่",
desc:"<b>at</b> = จุด/ตำแหน่ง: at the door, at the bus stop\n<b>on</b> = พื้นผิว/เส้น: on the wall, on the street\n<b>in</b> = พื้นที่ปิด/ล้อมรอบ: in the room, in Bangkok\n\nจำง่ายๆ: <b>at จุด → on ระนาบ → in กล่อง</b>",
ex:"She is <hi>at</hi> the door. <span class='trn'>(เธออยู่ที่ประตู)</span>\nThe picture is <hi>on</hi> the wall. <span class='trn'>(รูปอยู่บนผนัง)</span>\nHe lives <hi>in</hi> Bangkok. <span class='trn'>(เขาอยู่ในกรุงเทพฯ)</span>"},
]},

{en:"Conjunctions",th:"คำสันธาน",items:[
{en:"Conjunction คืออะไร?",th:"ความหมาย",
desc:"<b>Conjunction (สันธาน)</b> คือ คำที่ใช้<b>เชื่อมคำ วลี หรือประโยค</b>เข้าด้วยกัน\n\nเปรียบเหมือน \"กาว\" ที่ยึดส่วนต่างๆ ของประโยคเข้าด้วยกัน\n\nมี 3 ประเภท: Coordinating, Subordinating, Correlative",
ex:"I like tea <hi>and</hi> coffee. <span class='trn'>(ฉันชอบชาและกาแฟ — เชื่อมคำ)</span>\nShe's tired <hi>but</hi> happy. <span class='trn'>(เธอเหนื่อยแต่มีความสุข — เชื่อมวลี)</span>"},
{en:"FANBOYS",th:"Coordinating Conjunctions",
desc:"<b>Coordinating Conjunctions</b> เชื่อม 2 สิ่งที่<b>เท่าเทียมกัน</b>\n\nจำด้วยคำว่า <b>FANBOYS</b>:\n<b>F</b>or (เพราะว่า)\n<b>A</b>nd (และ)\n<b>N</b>or (และไม่)\n<b>B</b>ut (แต่)\n<b>O</b>r (หรือ)\n<b>Y</b>et (แต่ทว่า)\n<b>S</b>o (ดังนั้น)",
ex:"I was hungry, <hi>so</hi> I ate. <span class='trn'>(ฉันหิว ดังนั้นฉันจึงกิน)</span>\nShe can sing <hi>and</hi> dance. <span class='trn'>(เธอร้องเพลงและเต้นได้)</span>\nIs it hot <hi>or</hi> cold? <span class='trn'>(มันร้อนหรือเย็น?)</span>",
tips:"เมื่อเชื่อม 2 ประโยคสมบูรณ์ ใส่ <b>comma (,) ก่อน FANBOYS</b>\nI like tea<b>,</b> but she likes coffee."},
{en:"Subordinating",th:"เชื่อมอนุประโยค",
desc:"เชื่อม<b>อนุประโยคย่อย (dependent clause)</b> เข้ากับประโยคหลัก\n\nที่ใช้บ่อย:\n<b>เวลา:</b> when, while, after, before, since, until\n<b>เหตุผล:</b> because, since, as\n<b>เงื่อนไข:</b> if, unless\n<b>สัมปทาน:</b> although, even though",
ex:"I'll call you <hi>when</hi> I arrive. <span class='trn'>(ฉันจะโทรหาคุณเมื่อถึง)</span>\n<hi>Because</hi> it rained, we stayed home. <span class='trn'>(เพราะฝนตก เราอยู่บ้าน)</span>\n<hi>Although</hi> she's young, she's smart. <span class='trn'>(ถึงแม้เธอยังเด็ก เธอก็ฉลาด)</span>"},
]},

{en:"Interjections",th:"คำอุทาน",items:[
{en:"Interjection คืออะไร?",th:"ความหมาย",
desc:"<b>Interjection (คำอุทาน)</b> คือ คำที่ใช้<b>แสดงอารมณ์</b>อย่างฉับพลัน ไม่เกี่ยวกับโครงสร้างไวยากรณ์\n\nมักตามด้วยเครื่องหมาย <b>!</b> หรือ <b>,</b>\n\nเช่น: Wow! Oh! Oops! Hey! Ouch! Yay! Ugh! Hmm...",
ex:"<hi>Wow!</hi> That's amazing! <span class='trn'>(ว้าว! สุดยอดเลย!)</span>\n<hi>Oops!</hi> I dropped it. <span class='trn'>(อุ๊ปส์! ฉันทำหล่น)</span>\n<hi>Ouch!</hi> That hurts! <span class='trn'>(โอ๊ย! เจ็บ!)</span>\n<hi>Hey!</hi> Wait for me. <span class='trn'>(เฮ้! รอฉันด้วย)</span>"},
]},
]},

// ══════════════════════════════════════
// 2. TENSES
// ══════════════════════════════════════
{id:2,en:"Tenses & Aspects",th:"กาลเวลาและลักษณะกริยา",branches:[
{en:"Present",th:"ปัจจุบันกาล",items:[
{en:"Present Simple",th:"ปัจจุบันธรรมดา",
desc:"ใช้พูดถึง<b>ข้อเท็จจริง นิสัย กิจวัตรประจำวัน</b> สิ่งที่เป็นจริงเสมอ\n\nกริยาเติม <b>s/es</b> เมื่อประธานเป็น <b>he/she/it</b>\nกริยาเป็นรูปปกติเมื่อประธานเป็น I/you/we/they",
formula:"✅ บอกเล่า: S + V1 (s/es)\n❌ ปฏิเสธ: S + do/does + not + V1\n❓ คำถาม: Do/Does + S + V1?",
ex:"She <hi>works</hi> every day. <span class='trn'>(เธอทำงานทุกวัน)</span>\nWater <hi>boils</hi> at 100°C. <span class='trn'>(น้ำเดือดที่ 100°C — ข้อเท็จจริง)</span>\nI <hi>don't like</hi> spicy food. <span class='trn'>(ฉันไม่ชอบอาหารเผ็ด)</span>\n<hi>Does</hi> he <hi>speak</hi> English? <span class='trn'>(เขาพูดภาษาอังกฤษไหม?)</span>",
signal:"always, usually, often, sometimes, rarely, never, every day/week/month, on Mondays",
mis:"❌ She <hi>work</hi> every day. (ลืมเติม s)\n✅ She <hi>works</hi> every day.\n❌ He <hi>don't</hi> like it. (he ต้องใช้ doesn't)\n✅ He <hi>doesn't</hi> like it."},

{en:"Present Continuous",th:"ปัจจุบันต่อเนื่อง",
desc:"ใช้พูดถึงสิ่งที่<b>กำลังเกิดขึ้นตอนนี้</b> หรือ<b>แผนในอนาคตอันใกล้</b>ที่แน่นอนแล้ว",
formula:"✅ S + am/is/are + V-ing\n❌ S + am/is/are + not + V-ing\n❓ Am/Is/Are + S + V-ing?",
ex:"I <hi>am studying</hi> right now. <span class='trn'>(ฉันกำลังเรียนอยู่ตอนนี้)</span>\nShe <hi>is cooking</hi> dinner. <span class='trn'>(เธอกำลังทำอาหารเย็น)</span>\nWe <hi>are meeting</hi> Tom tomorrow. <span class='trn'>(เราจะพบทอมพรุ่งนี้ — แผน)</span>",
signal:"now, right now, at the moment, currently, today, tonight, this week, Look! Listen!",
tips:"กริยาบางตัว<b>ไม่ใช้ continuous</b> (stative verbs):\nlike, love, hate, know, believe, understand, want, need, own\n❌ I am knowing. ✅ I know."},

{en:"Present Perfect",th:"ปัจจุบันสมบูรณ์",
desc:"ใช้พูดถึงเหตุการณ์ที่<b>เกิดในอดีตแต่ยังเชื่อมโยงกับปัจจุบัน</b>\n\n1. <b>ประสบการณ์</b> — เคยทำ/ไม่เคยทำ\n2. <b>ผลลัพธ์ปัจจุบัน</b> — ทำแล้ว ผลยังอยู่\n3. <b>ยังไม่เสร็จ</b> — เริ่มในอดีต ยังดำเนินอยู่\n\n<b>ไม่ใช้กับเวลาที่ระบุชัด</b> (yesterday, last year)",
formula:"✅ S + have/has + V3 (past participle)\n❌ S + have/has + not + V3\n❓ Have/Has + S + V3?",
ex:"I <hi>have visited</hi> Japan. <span class='trn'>(ฉันเคยไปญี่ปุ่น — ประสบการณ์)</span>\nShe <hi>has lost</hi> her keys. <span class='trn'>(เธอทำกุญแจหาย — ผลยังอยู่ ตอนนี้ยังไม่มีกุญแจ)</span>\nI <hi>have lived</hi> here for 5 years. <span class='trn'>(ฉันอยู่ที่นี่มา 5 ปี — ยังอยู่)</span>",
signal:"ever, never, already, yet, just, recently, so far, since, for, this week/month/year",
mis:"❌ I <hi>have visited</hi> Japan <hi>last year</hi>. (ผิด — ระบุเวลาชัด ต้องใช้ Past Simple)\n✅ I <hi>visited</hi> Japan <hi>last year</hi>."},

{en:"Present Perfect Cont.",th:"ปัจจุบันสมบูรณ์ต่อเนื่อง",
desc:"ใช้พูดถึงเหตุการณ์ที่<b>เริ่มในอดีต ยังดำเนินต่อ หรือเพิ่งหยุด</b>\n\nเน้น<b>ระยะเวลา</b>ที่ทำต่อเนื่อง (ไม่เน้นผลลัพธ์)\n\nต่างจาก Present Perfect: Perfect เน้น \"เสร็จหรือยัง\" — Perfect Continuous เน้น \"ทำนานแค่ไหน\"",
formula:"S + have/has + been + V-ing",
ex:"I <hi>have been waiting</hi> for 2 hours. <span class='trn'>(ฉันรอมา 2 ชั่วโมงแล้ว — ยังรออยู่)</span>\nShe <hi>has been studying</hi> all day. <span class='trn'>(เธอเรียนมาทั้งวัน)</span>\nIt <hi>has been raining</hi> since morning. <span class='trn'>(ฝนตกมาตั้งแต่เช้า)</span>",
signal:"for, since, all day/morning/week, how long",
tips:"เทียบ:\nI <b>have read</b> 3 books. (อ่านไป 3 เล่มแล้ว — เน้นจำนวน)\nI <b>have been reading</b> all day. (อ่านมาทั้งวัน — เน้นระยะเวลา)"},
]},

{en:"Past",th:"อดีตกาล",items:[
{en:"Past Simple",th:"อดีตธรรมดา",
desc:"ใช้พูดถึงเหตุการณ์ที่<b>เกิดขึ้นและจบลงแล้วในอดีต</b>\n\nกริยาเปลี่ยนเป็น<b>รูปอดีต (V2)</b>\nกริยาปกติ: เติม -ed (walked, played)\nกริยาไม่ปกติ: ต้องจำ (go→went, eat→ate, see→saw)",
formula:"✅ S + V2\n❌ S + did not + V1\n❓ Did + S + V1?\n\nสังเกต: ปฏิเสธ/คำถาม → กริยากลับเป็น V1 เพราะ did รับหน้าที่แล้ว",
ex:"She <hi>went</hi> to school yesterday. <span class='trn'>(เธอไปโรงเรียนเมื่อวาน)</span>\nI <hi>didn't eat</hi> breakfast. <span class='trn'>(ฉันไม่ได้กินอาหารเช้า)</span>\n<hi>Did</hi> you <hi>see</hi> that movie? <span class='trn'>(คุณดูหนังเรื่องนั้นไหม?)</span>",
signal:"yesterday, last week/month/year, ago, in 2020, when I was young",
mis:"❌ I didn't <hi>went</hi>. (ผิด — มี did แล้ว กริยาต้องเป็น V1)\n✅ I didn't <hi>go</hi>."},

{en:"Past Continuous",th:"อดีตต่อเนื่อง",
desc:"ใช้พูดถึงเหตุการณ์ที่<b>กำลังเกิดขึ้นในจุดเวลาหนึ่งในอดีต</b>\n\nมักใช้คู่กับ Past Simple: \"กำลังทำ A อยู่ ก็เกิด B ขึ้น\"\n\nA = Past Continuous (เหตุการณ์ยาว)\nB = Past Simple (เหตุการณ์สั้น)",
formula:"S + was/were + V-ing\n\nI/he/she/it → was\nyou/we/they → were",
ex:"I <hi>was reading</hi> when she <hi>called</hi>. <span class='trn'>(ฉันกำลังอ่านหนังสือตอนที่เธอโทรมา)</span>\nThey <hi>were playing</hi> football at 5 PM. <span class='trn'>(พวกเขากำลังเล่นฟุตบอลตอน 5 โมง)</span>\nWhile I <hi>was sleeping</hi>, the phone <hi>rang</hi>. <span class='trn'>(ขณะที่ฉันนอนหลับ โทรศัพท์ดัง)</span>",
signal:"while, when, at that time, at 5 PM yesterday, all day yesterday"},

{en:"Past Perfect",th:"อดีตสมบูรณ์",
desc:"ใช้พูดถึงเหตุการณ์ที่<b>เกิดก่อนเหตุการณ์อื่นในอดีต</b> (อดีตของอดีต)\n\nเกิดก่อน → <b>Past Perfect (had + V3)</b>\nเกิดทีหลัง → <b>Past Simple (V2)</b>",
formula:"S + had + V3\n\nเหตุการณ์ 1 (เกิดก่อน): had + V3\nเหตุการณ์ 2 (เกิดหลัง): V2",
ex:"She <hi>had left</hi> before I <hi>arrived</hi>. <span class='trn'>(เธอไปแล้ว ก่อนที่ฉันจะมาถึง)</span>\nI <hi>had eaten</hi> when he <hi>called</hi>. <span class='trn'>(ฉันกินเสร็จแล้ว ตอนที่เขาโทรมา)</span>\nThey <hi>had never seen</hi> snow before they <hi>went</hi> to Japan. <span class='trn'>(พวกเขาไม่เคยเห็นหิมะก่อนไปญี่ปุ่น)</span>",
signal:"before, after, by the time, already, never...before, when"},

{en:"Past Perfect Cont.",th:"อดีตสมบูรณ์ต่อเนื่อง",
desc:"ใช้พูดถึงเหตุการณ์ที่<b>ดำเนินต่อมาก่อนเหตุการณ์อื่นในอดีต</b> เน้นระยะเวลา",
formula:"S + had + been + V-ing",
ex:"They <hi>had been playing</hi> for an hour when it <hi>rained</hi>. <span class='trn'>(พวกเขาเล่นมาชั่วโมงแล้วตอนฝนตก)</span>\nShe <hi>had been working</hi> there for 5 years before she <hi>quit</hi>. <span class='trn'>(เธอทำงานที่นั่น 5 ปี ก่อนลาออก)</span>",
signal:"for, since, before, when, by the time"},
]},

{en:"Future",th:"อนาคตกาล",items:[
{en:"Future Simple (will)",th:"อนาคตธรรมดา",
desc:"ใช้พูดถึง:\n1. <b>การตัดสินใจทันที</b> — เพิ่งคิดตอนนี้\n2. <b>การคาดการณ์/ทำนาย</b> — คิดว่าจะเกิด\n3. <b>สัญญา/ข้อเสนอ</b>\n4. <b>ข้อเท็จจริงอนาคต</b>",
formula:"✅ S + will + V1\n❌ S + will not (won't) + V1\n❓ Will + S + V1?\n\nย่อ: I will = I'll, will not = won't",
ex:"I<hi>'ll help</hi> you. <span class='trn'>(ฉันจะช่วยคุณ — ข้อเสนอ)</span>\nIt <hi>will rain</hi> tomorrow. <span class='trn'>(พรุ่งนี้ฝนจะตก — คาดการณ์)</span>\nI <hi>won't tell</hi> anyone. <span class='trn'>(ฉันจะไม่บอกใคร — สัญญา)</span>",
signal:"tomorrow, next week/month/year, in the future, I think, probably, maybe"},

{en:"Be Going To",th:"แสดงแผนและหลักฐาน",
desc:"ใช้พูดถึง:\n1. <b>แผนที่วางไว้ล่วงหน้า</b> — ตั้งใจไว้แล้ว\n2. <b>คาดการณ์จากหลักฐาน</b> — มีสิ่งบ่งชี้ให้เห็น\n\n<b>ต่างจาก will:</b>\nwill = ตัดสินใจตอนนี้ / ทำนายจากความเห็น\ngoing to = วางแผนไว้แล้ว / ทำนายจากหลักฐาน",
formula:"S + am/is/are + going to + V1",
ex:"She <hi>is going to travel</hi> next month. <span class='trn'>(เธอจะเดินทางเดือนหน้า — วางแผนไว้แล้ว)</span>\nLook at those clouds! It <hi>is going to rain</hi>. <span class='trn'>(ดูเมฆ! ฝนกำลังจะตก — มีหลักฐาน)</span>",
tips:"เทียบ:\nThe phone rings. \"I<b>'ll answer</b> it.\" (ตัดสินใจตอนนี้ → will)\n\"I<b>'m going to study</b> abroad next year.\" (วางแผนไว้ → going to)"},

{en:"Future Continuous",th:"อนาคตต่อเนื่อง",
desc:"ใช้พูดถึงสิ่งที่<b>จะกำลังเกิดขึ้นในช่วงเวลาหนึ่งในอนาคต</b>",
formula:"S + will + be + V-ing",
ex:"I <hi>will be working</hi> at 8 PM tonight. <span class='trn'>(ฉันจะกำลังทำงานอยู่ตอน 2 ทุ่มคืนนี้)</span>\nThis time tomorrow, she <hi>will be flying</hi> to Tokyo. <span class='trn'>(เวลานี้พรุ่งนี้ เธอจะกำลังบินไปโตเกียว)</span>",
signal:"at this time tomorrow, at 8 PM tonight, this time next week"},

{en:"Future Perfect",th:"อนาคตสมบูรณ์",
desc:"ใช้พูดถึงสิ่งที่<b>จะเสร็จสิ้นก่อนเวลาหนึ่งในอนาคต</b>",
formula:"S + will + have + V3",
ex:"By Friday, I <hi>will have finished</hi> the project. <span class='trn'>(ภายในวันศุกร์ ฉันจะทำโปรเจกต์เสร็จแล้ว)</span>\nBy 2030, she <hi>will have graduated</hi>. <span class='trn'>(ภายในปี 2030 เธอจะจบการศึกษาแล้ว)</span>",
signal:"by + time (by Friday, by next year, by 2030, by the time)"},
]},
]},

{id:3,en:"Sentence Structures",th:"โครงสร้างประโยคและอนุประโยค",branches:[
{en:"Sentence Types",th:"ประเภทประโยค",items:[
{en:"Simple Sentence",th:"ประโยคความเดียว",
desc:"ประโยคที่มี<b>ประธาน 1 ตัว + กริยา 1 ตัว</b> (Independent Clause เดียว)\n\nเป็นประโยคพื้นฐานที่สุด ทุกประโยคอื่นสร้างจากพื้นฐานนี้\n\nอาจมีกรรม (O) หรือส่วนขยายเพิ่มเติมได้",
formula:"S + V\nS + V + O\nS + V + O + adverb",
ex:"She <hi>sings</hi>. <span class='trn'>(เธอร้องเพลง)</span>\nThe cat <hi>sat</hi> on the mat. <span class='trn'>(แมวนั่งบนเสื่อ)</span>\nTom and Jerry <hi>play</hi> together. <span class='trn'>(ทอมกับเจอร์รี่เล่นด้วยกัน — ประธาน 2 ตัว แต่กริยาเดียว = Simple)</span>"},

{en:"Compound Sentence",th:"ประโยคความรวม",
desc:"<b>2 ประโยคสมบูรณ์</b> (Independent Clauses) เชื่อมกันด้วย:\n1. <b>FANBOYS</b> (for, and, nor, but, or, yet, so) + comma\n2. <b>Semicolon (;)</b>\n\nแต่ละส่วนสามารถยืนอยู่คนเดียวได้",
formula:"Clause 1 + , + FANBOYS + Clause 2\nClause 1 + ; + Clause 2",
ex:"I like tea<hi>, but</hi> she prefers coffee. <span class='trn'>(ฉันชอบชา แต่เธอชอบกาแฟ)</span>\nIt rained<hi>, so</hi> we stayed home. <span class='trn'>(ฝนตก ดังนั้นเราอยู่บ้าน)</span>\nShe sings<hi>;</hi> he dances. <span class='trn'>(เธอร้อง เขาเต้น)</span>",
tips:"อย่าลืม comma ก่อน FANBOYS!\n❌ I like tea but she likes coffee.\n✅ I like tea<b>,</b> but she likes coffee."},

{en:"Complex Sentence",th:"ประโยคความซ้อน",
desc:"<b>1 ประโยคหลัก (Independent Clause)</b> + <b>1 ประโยคย่อย (Dependent Clause)</b>\n\nDep. Clause เริ่มด้วย subordinating conjunction (because, when, if, although, etc.)\n\nถ้า Dep. Clause อยู่หน้า → ใส่ comma\nถ้า Dep. Clause อยู่หลัง → ไม่ต้อง comma",
formula:"Dep. Clause + , + Ind. Clause\n(Because it rained, I stayed home.)\n\nInd. Clause + Dep. Clause\n(I stayed home because it rained.)",
ex:"<hi>Because</hi> it was raining, I stayed home. <span class='trn'>(เพราะฝนตก ฉันอยู่บ้าน)</span>\nI stayed home <hi>because</hi> it was raining. <span class='trn'>(ฉันอยู่บ้านเพราะฝนตก)</span>\n<hi>If</hi> you study hard, you will pass. <span class='trn'>(ถ้าคุณเรียนหนัก คุณจะสอบผ่าน)</span>"},

{en:"Compound-Complex",th:"ความรวม-ซ้อน",
desc:"มีทั้ง <b>2+ Independent Clauses</b> และ <b>1+ Dependent Clause</b>\n\nเป็นประโยคซับซ้อนที่สุด ใช้เมื่อต้องการบอกหลายอย่างในประโยคเดียว",
ex:"<hi>When</hi> I got home, I ate dinner <hi>and</hi> I watched TV. <span class='trn'>(เมื่อฉันกลับถึงบ้าน ฉันกินข้าวและดูทีวี)</span>\n<hi>Although</hi> she was tired, she finished the work <hi>and</hi> she went to bed. <span class='trn'>(ถึงแม้เธอจะเหนื่อย เธอก็ทำงานเสร็จและไปนอน)</span>"},
]},

{en:"Clauses",th:"อนุประโยค",items:[
{en:"Clause คืออะไร?",th:"ความหมาย",
desc:"<b>Clause (อนุประโยค)</b> คือ กลุ่มคำที่มี<b>ประธาน + กริยา</b>\n\nแบ่งเป็น 2 ชนิด:\n<b>Independent Clause</b> = มีความหมายสมบูรณ์ ยืนอยู่คนเดียวได้\n<b>Dependent Clause</b> = ไม่สมบูรณ์ ต้องพึ่งประโยคอื่น",
ex:"<hi>She studies hard.</hi> ← Independent (สมบูรณ์)\n<hi>Because she studies hard</hi> ← Dependent (ไม่สมบูรณ์ ต้องมีส่วนอื่น)"},

{en:"Noun Clause",th:"นามานุประโยค",
desc:"Dependent Clause ที่ทำหน้าที่เป็น<b>คำนาม</b> (ประธาน/กรรมของประโยค)\n\nขึ้นต้นด้วย: that, what, how, where, when, why, whether, if, who",
ex:"I know <hi>that she is coming</hi>. <span class='trn'>(ฉันรู้ว่าเธอกำลังจะมา — เป็นกรรม)</span>\n<hi>What he said</hi> was true. <span class='trn'>(สิ่งที่เขาพูดเป็นจริง — เป็นประธาน)</span>\nI don't know <hi>where he lives</hi>. <span class='trn'>(ฉันไม่รู้ว่าเขาอยู่ที่ไหน)</span>"},

{en:"Adjective Clause",th:"คุณานุประโยค",
desc:"Dependent Clause ที่ทำหน้าที่เป็น<b>คำคุณศัพท์</b> ขยายคำนามที่อยู่ข้างหน้า\n\nขึ้นต้นด้วย: who, whom, whose, which, that, where, when\n\nวางหลังคำนามที่ต้องการขยาย",
ex:"The girl <hi>who won the prize</hi> is my friend. <span class='trn'>(ผู้หญิงที่ชนะรางวัลคือเพื่อนฉัน)</span>\nThe book <hi>that I read</hi> was great. <span class='trn'>(หนังสือที่ฉันอ่านดีมาก)</span>\nThe city <hi>where I was born</hi> is small. <span class='trn'>(เมืองที่ฉันเกิดเล็ก)</span>"},

{en:"Adverb Clause",th:"วิเศษณานุประโยค",
desc:"Dependent Clause ที่ทำหน้าที่เป็น<b>คำกริยาวิเศษณ์</b> บอกเวลา เหตุผล เงื่อนไข สัมปทาน\n\n<b>เวลา:</b> when, while, after, before, since, until, as soon as\n<b>เหตุผล:</b> because, since, as\n<b>เงื่อนไข:</b> if, unless, provided that\n<b>สัมปทาน:</b> although, even though, though",
ex:"<hi>When</hi> she arrived, everyone clapped. <span class='trn'>(เมื่อเธอมาถึง ทุกคนปรบมือ — เวลา)</span>\nI stayed home <hi>because</hi> I was sick. <span class='trn'>(ฉันอยู่บ้านเพราะป่วย — เหตุผล)</span>\n<hi>If</hi> you study, you will pass. <span class='trn'>(ถ้าเรียน คุณจะสอบผ่าน — เงื่อนไข)</span>"},
]},

{en:"Phrases",th:"วลี",items:[
{en:"Phrase vs Clause",th:"วลี vs อนุประโยค",
desc:"<b>Phrase (วลี)</b> = กลุ่มคำที่<b>ไม่มีทั้งประธานและกริยาครบ</b>\n<b>Clause (อนุประโยค)</b> = กลุ่มคำที่<b>มีทั้งประธานและกริยา</b>\n\nPhrase ไม่สามารถยืนเป็นประโยคได้ แต่ช่วยเสริมรายละเอียด",
ex:"<hi>on the table</hi> ← Phrase (ไม่มีประธาน+กริยา)\n<hi>The cat sits</hi> ← Clause (มีประธาน cat + กริยา sits)"},

{en:"Noun Phrase",th:"นามวลี",
desc:"กลุ่มคำที่มี<b>นามเป็นหัวหลัก</b> + คำขยาย (adjective, determiner)\n\nทำหน้าที่เป็นนามในประโยค (ประธาน/กรรม)",
ex:"<hi>The big red ball</hi> rolled away. <span class='trn'>(ลูกบอลใหญ่สีแดง กลิ้งไป)</span>\nI like <hi>cold green tea</hi>. <span class='trn'>(ฉันชอบชาเขียวเย็น)</span>"},

{en:"Prepositional Phrase",th:"บุพบทวลี",
desc:"เริ่มด้วย<b>บุพบท (preposition)</b> ตามด้วย noun phrase\n\nทำหน้าที่เป็น adjective (ขยายนาม) หรือ adverb (ขยายกริยา)",
ex:"The book <hi>on the table</hi> is mine. <span class='trn'>(หนังสือบนโต๊ะเป็นของฉัน — ขยาย book)</span>\nShe works <hi>in a hospital</hi>. <span class='trn'>(เธอทำงานในโรงพยาบาล — ขยาย works)</span>"},
]},
]},

// ══════════════════════════════════════
// 4. VERB FORMS & VOICES
// ══════════════════════════════════════
{id:4,en:"Verb Forms & Voices",th:"รูปแบบกริยาและมุมมอง",branches:[
{en:"Active & Passive",th:"ประโยคกรรตุ/กรรมวาจก",items:[
{en:"Active Voice",th:"ประโยคกรรตุวาจก",
desc:"ประธาน<b>เป็นผู้กระทำ</b> — ภาษาอังกฤษใช้ Active Voice เป็นหลัก เพราะกระชับและชัดเจน\n\nActive Voice = ประโยคปกติที่เราพูดทั่วไป",
formula:"ประธาน (ผู้ทำ) + กริยา + กรรม (ผู้ถูกทำ)\nThe chef + cooked + the meal.",
ex:"The chef <hi>cooked</hi> the meal. <span class='trn'>(เชฟทำอาหาร — เชฟเป็นผู้ทำ)</span>\nShe <hi>wrote</hi> a letter. <span class='trn'>(เธอเขียนจดหมาย)</span>\nThe dog <hi>chased</hi> the cat. <span class='trn'>(สุนัขไล่แมว)</span>"},

{en:"Passive Voice",th:"ประโยคกรรมวาจก",
desc:"ประธาน<b>เป็นผู้ถูกกระทำ</b> — ใช้เมื่อ:\n1. ไม่รู้ว่าใครทำ\n2. ไม่สำคัญว่าใครทำ\n3. ต้องการเน้นสิ่งที่ถูกกระทำ\n\nสร้างจาก: <b>be + V3 (past participle)</b>\nผู้กระทำอาจบอกด้วย <b>by + agent</b> หรือไม่บอกก็ได้",
formula:"ประธาน (ผู้ถูกทำ) + be + V3 + (by ผู้ทำ)\n\nPresent: is/am/are + V3\nPast: was/were + V3\nFuture: will be + V3\nPerfect: has/have been + V3",
ex:"The meal <hi>was cooked</hi> by the chef. <span class='trn'>(อาหารถูกทำโดยเชฟ)</span>\nThis bridge <hi>was built</hi> in 1990. <span class='trn'>(สะพานนี้ถูกสร้างในปี 1990 — ไม่ต้องบอกใคร)</span>\nEnglish <hi>is spoken</hi> worldwide. <span class='trn'>(ภาษาอังกฤษถูกพูดทั่วโลก)</span>",
tips:"วิธีเปลี่ยน Active → Passive:\n1. เอากรรมมาเป็นประธาน\n2. เปลี่ยนกริยาเป็น be + V3\n3. เอาประธานเดิมไปไว้หลัง by (จะละก็ได้)"},
]},

{en:"Infinitives & Gerunds",th:"Infinitive / Gerund",items:[
{en:"Infinitive (to + V1)",th:"กริยาไม่แท้ รูป to + V",
desc:"<b>Infinitive</b> = <b>to + กริยารูปเดิม</b>\n\nใช้เป็น:\n• <b>นาม</b>: To swim is fun. (ว่ายน้ำสนุก)\n• <b>คุณศัพท์</b>: I need a place to sleep. (ที่นอน)\n• <b>กริยาวิเศษณ์</b>: I study to pass. (เพื่อสอบผ่าน)\n\nกริยาที่ตามด้วย infinitive: want, need, decide, hope, plan, promise, agree, refuse, offer, learn",
ex:"I want <hi>to learn</hi> English. <span class='trn'>(ฉันอยากเรียนภาษาอังกฤษ)</span>\nShe decided <hi>to quit</hi>. <span class='trn'>(เธอตัดสินใจลาออก)</span>\nHe went <hi>to buy</hi> food. <span class='trn'>(เขาไปซื้ออาหาร — บอกวัตถุประสงค์)</span>"},

{en:"Gerund (V-ing)",th:"กริยาเป็นนาม (V-ing)",
desc:"<b>Gerund</b> = <b>V-ing ที่ทำหน้าที่เป็นนาม</b>\n\nใช้เป็นประธาน กรรม หรือหลังบุพบท\n\nกริยาที่ตามด้วย gerund: enjoy, avoid, finish, mind, suggest, keep, practice, quit, consider, imagine, deny",
ex:"<hi>Swimming</hi> is fun. <span class='trn'>(ว่ายน้ำสนุก — เป็นประธาน)</span>\nI enjoy <hi>reading</hi>. <span class='trn'>(ฉันสนุกกับการอ่าน — เป็นกรรม)</span>\nShe is good at <hi>cooking</hi>. <span class='trn'>(เธอทำอาหารเก่ง — หลัง preposition)</span>",
tips:"หลัง preposition ใช้ <b>gerund เสมอ</b> ไม่ใช่ infinitive:\n❌ I'm interested in <b>to learn</b>.\n✅ I'm interested in <b>learning</b>."},

{en:"Gerund vs Infinitive",th:"เมื่อความหมายเปลี่ยน",
desc:"กริยาบางตัวตามด้วยทั้ง Gerund และ Infinitive แต่<b>ความหมายต่างกัน</b>:\n\n<b>stop</b>: stop + V-ing = เลิกทำ / stop + to V = หยุดเพื่อไปทำ\n<b>remember</b>: remember + V-ing = จำได้ว่าเคยทำ / remember + to V = จำได้ว่าต้องทำ\n<b>try</b>: try + V-ing = ลองทำดู / try + to V = พยายามทำ\n<b>forget</b>: forget + V-ing = ลืมว่าเคยทำ / forget + to V = ลืมที่จะทำ",
ex:"I stopped <hi>smoking</hi>. <span class='trn'>(ฉันเลิกสูบบุหรี่)</span>\nI stopped <hi>to smoke</hi>. <span class='trn'>(ฉันหยุดเพื่อไปสูบบุหรี่)</span>\nI remember <hi>locking</hi> the door. <span class='trn'>(ฉันจำได้ว่าล็อกประตู — ทำไปแล้ว)</span>\nRemember <hi>to lock</hi> the door. <span class='trn'>(อย่าลืมล็อกประตู — ยังไม่ได้ทำ)</span>"},
]},

{en:"Participles",th:"Participle",items:[
{en:"Present Participle",th:"V-ing เป็นคุณศัพท์",
desc:"<b>Present Participle (V-ing)</b> ใช้เป็น <b>adjective</b> ขยายนาม หรือใน continuous tense\n\nเมื่อใช้เป็น adj → บอกว่า<b>สิ่งนั้นทำให้รู้สึกอย่างไร</b> (ตัวกระทำ)",
ex:"The <hi>running</hi> water <span class='trn'>(น้ำที่กำลังไหล)</span>\nThe movie is <hi>boring</hi>. <span class='trn'>(หนังน่าเบื่อ — หนังทำให้เบื่อ)</span>\nShe is an <hi>interesting</hi> person. <span class='trn'>(เธอเป็นคนน่าสนใจ)</span>",
tips:"-ing = ตัวทำให้รู้สึก (สิ่ง/คนที่ก่อให้เกิดอารมณ์)\n-ed = ตัวที่รู้สึก (คนที่ได้รับอารมณ์)\n\nThe movie is bor<b>ing</b>. (หนังทำให้เบื่อ)\nI am bor<b>ed</b>. (ฉันเบื่อ)"},

{en:"Past Participle",th:"V3 เป็นคุณศัพท์",
desc:"<b>Past Participle (V3)</b> ใช้เป็น <b>adjective</b> ขยายนาม, ใน perfect tense, หรือ passive voice\n\nเมื่อใช้เป็น adj → บอกว่า<b>ถูกทำให้รู้สึกอย่างไร</b> (ตัวรับ)",
ex:"The <hi>broken</hi> window <span class='trn'>(หน้าต่างที่แตก)</span>\nI am <hi>tired</hi>. <span class='trn'>(ฉันเหนื่อย — ถูกทำให้เหนื่อย)</span>\nThe <hi>stolen</hi> car was found. <span class='trn'>(รถที่ถูกขโมยถูกพบ)</span>",
mis:"❌ I am <hi>boring</hi>. (= ฉันเป็นคนน่าเบื่อ — อาจไม่ใช่ที่ต้องการจะพูด)\n✅ I am <hi>bored</hi>. (= ฉันเบื่อ — นี่คือที่ต้องการ)"},
]},

{en:"Subjunctive",th:"อารมณ์สมมติ",items:[
{en:"Subjunctive Mood",th:"รูปสมมติ",
desc:"ใช้กับ:\n1. <b>wish</b> + past tense (สมมติปัจจุบัน)\n2. <b>suggest/recommend/insist</b> + that + S + V1 (base form)\n3. <b>If I were...</b> (สมมติที่ไม่เป็นจริง)\n\nจุดสำคัญ: ใช้ <b>were</b> แทน was ในทุกบุรุษ (If I were, If he were)",
formula:"wish + S + V2 (สมมติปัจจุบัน)\nwish + S + had V3 (สมมติอดีต)\nsuggest that + S + V1 (base form)\nIf + S + were...",
ex:"I wish I <hi>were</hi> taller. <span class='trn'>(ฉันอยากจะสูงกว่านี้ — สมมติ)</span>\nI suggest that he <hi>study</hi> harder. <span class='trn'>(ฉันแนะนำให้เขาเรียนหนักขึ้น — ใช้ study ไม่ใช่ studies)</span>\nIf I <hi>were</hi> you, I'd go. <span class='trn'>(ถ้าฉันเป็นคุณ ฉันจะไป)</span>"},
]},
]},

// ══════════════════════════════════════
// 5. SPECIAL RULES
// ══════════════════════════════════════
{id:5,en:"Special Rules",th:"กฎพิเศษและไวยากรณ์ขั้นสูง",branches:[
{en:"Subject-Verb Agreement",th:"ความสอดคล้อง S-V",items:[
{en:"กฎพื้นฐาน",th:"ประธานเอกพจน์/พหูพจน์",
desc:"<b>กฎทอง:</b> ประธานเอกพจน์ → กริยาเอกพจน์ (เติม s)\nประธานพหูพจน์ → กริยาพหูพจน์ (ไม่เติม s)\n\n<b>ข้อสังเกต:</b> ภาษาอังกฤษ noun เติม s = พหูพจน์ แต่ verb เติม s = เอกพจน์ (ตรงข้าม!)",
ex:"The dog <hi>runs</hi>. <span class='trn'>(สุนัข 1 ตัว → runs เติม s)</span>\nThe dogs <hi>run</hi>. <span class='trn'>(สุนัขหลายตัว → run ไม่เติม s)</span>\nShe <hi>likes</hi> music. <span class='trn'>(เธอ → likes เติม s)</span>\nThey <hi>like</hi> music. <span class='trn'>(พวกเขา → like ไม่เติม s)</span>"},
{en:"กรณีพิเศษ",th:"ที่มักสับสน",
desc:"1. <b>either/or, neither/nor</b> → ดูประธานตัวที่ใกล้กริยาที่สุด\n2. <b>each, every, everyone, everybody, nobody</b> → เอกพจน์เสมอ\n3. <b>there is + เอกพจน์ / there are + พหูพจน์</b>\n4. <b>คำนามที่ลงท้าย -s แต่เป็นเอกพจน์:</b> news, mathematics, physics\n5. <b>uncountable noun</b> → เอกพจน์เสมอ",
ex:"Neither Tom nor his friends <hi>are</hi> here. <span class='trn'>(friends ใกล้กริยา → are)</span>\nEveryone <hi>is</hi> happy. <span class='trn'>(everyone = เอกพจน์)</span>\nThe news <hi>is</hi> good. <span class='trn'>(news = เอกพจน์)</span>\nThere <hi>are</hi> many students. <span class='trn'>(students = พหูพจน์)</span>"},
]},

{en:"Conditionals",th:"ประโยคเงื่อนไข",items:[
{en:"Zero Conditional",th:"เงื่อนไขศูนย์ — ข้อเท็จจริง",
desc:"ใช้พูดถึง<b>ความจริงทั่วไป ข้อเท็จจริงทางวิทยาศาสตร์</b> ที่เป็นจริงเสมอ\n\nทั้ง 2 ส่วนใช้ <b>Present Simple</b> ทั้งคู่",
formula:"If + S + V1, S + V1\n(ถ้า..., ก็จะ... เสมอ)",
ex:"If you <hi>heat</hi> water to 100°C, it <hi>boils</hi>. <span class='trn'>(ถ้าคุณต้มน้ำถึง 100°C มันเดือด)</span>\nIf you <hi>mix</hi> red and blue, you <hi>get</hi> purple. <span class='trn'>(ถ้าผสมแดงกับน้ำเงิน จะได้ม่วง)</span>"},

{en:"First Conditional",th:"เงื่อนไขที่ 1 — เป็นไปได้จริง",
desc:"ใช้พูดถึงสถานการณ์ที่<b>เป็นไปได้จริงในอนาคต</b> มีโอกาสเกิดขึ้น\n\nIf → <b>Present Simple</b>\nผลลัพธ์ → <b>will + V1</b>",
formula:"If + S + V1, S + will + V1\n(ถ้า... จะ...)",
ex:"If it <hi>rains</hi>, I <hi>will stay</hi> home. <span class='trn'>(ถ้าฝนตก ฉันจะอยู่บ้าน — เป็นไปได้)</span>\nIf you <hi>study</hi> hard, you <hi>will pass</hi>. <span class='trn'>(ถ้าคุณเรียนหนัก คุณจะสอบผ่าน)</span>",
mis:"❌ If it <hi>will rain</hi>, I will stay. (ผิด — หลัง if ห้ามใช้ will)\n✅ If it <hi>rains</hi>, I will stay."},

{en:"Second Conditional",th:"เงื่อนไขที่ 2 — สมมติปัจจุบัน",
desc:"ใช้<b>สมมติสถานการณ์ที่ไม่จริง/ไม่น่าจะเกิดขึ้นในปัจจุบัน</b> (จินตนาการ ความฝัน)\n\nIf → <b>Past Simple (V2)</b> → แต่หมายถึงปัจจุบัน!\nผลลัพธ์ → <b>would + V1</b>\n\nจุดสำคัญ: ใช้ <b>were</b> แทน was ทุกบุรุษ",
formula:"If + S + V2, S + would + V1\n(ถ้า... ก็จะ... — แต่จริงๆ ไม่เป็นอย่างนั้น)",
ex:"If I <hi>were</hi> rich, I <hi>would travel</hi> the world. <span class='trn'>(ถ้าฉันรวย ฉันจะเดินทางรอบโลก — แต่จริงๆ ฉันไม่รวย)</span>\nIf I <hi>had</hi> wings, I <hi>would fly</hi>. <span class='trn'>(ถ้าฉันมีปีก ฉันจะบิน — แต่มนุษย์ไม่มีปีก)</span>"},

{en:"Third Conditional",th:"เงื่อนไขที่ 3 — สมมติอดีต",
desc:"ใช้<b>สมมติเหตุการณ์ในอดีตที่ไม่ได้เกิดขึ้น</b> (เสียดาย / ถ้าย้อนเวลาได้)\n\nIf → <b>had + V3</b>\nผลลัพธ์ → <b>would have + V3</b>\n\nเป็นเรื่องอดีต ไม่สามารถเปลี่ยนแปลงได้แล้ว",
formula:"If + S + had + V3, S + would have + V3\n(ถ้าตอนนั้น... ก็คงจะ... — แต่ไม่ได้ทำ)",
ex:"If I <hi>had studied</hi>, I <hi>would have passed</hi>. <span class='trn'>(ถ้าฉันเรียน ฉันก็คงสอบผ่าน — แต่ฉันไม่ได้เรียน จึงสอบตก)</span>\nIf she <hi>had left</hi> earlier, she <hi>wouldn't have missed</hi> the bus. <span class='trn'>(ถ้าเธอออกเร็วกว่านี้ เธอก็ไม่ตกรถ)</span>",
tips:"สรุป Conditionals:\n0: จริงเสมอ → V1 / V1\n1: เป็นไปได้จริง → V1 / will V1\n2: สมมติปัจจุบัน → V2 / would V1\n3: สมมติอดีต → had V3 / would have V3"},
]},

{en:"Reported Speech",th:"คำพูดทางอ้อม",items:[
{en:"หลักการเปลี่ยน",th:"กฎพื้นฐาน",
desc:"<b>Reported Speech (Indirect Speech)</b> คือ การ<b>เล่าว่าคนอื่นพูดว่าอะไร</b> โดยไม่ใช้คำพูดตรง\n\nกฎหลัก: <b>เปลี่ยน tense ถอยหลัง 1 ช่วง</b>\n\nPresent Simple → Past Simple\nPresent Continuous → Past Continuous\nPresent Perfect → Past Perfect\nPast Simple → Past Perfect\nwill → would\ncan → could",
formula:"Direct: He said, \"I am happy.\"\nReported: He said (that) he was happy.\n\nDirect: She said, \"I will come.\"\nReported: She said (that) she would come.",
ex:"\"I <hi>like</hi> pizza.\" → He said he <hi>liked</hi> pizza.\n<span class='trn'>(\"ฉันชอบพิซซ่า\" → เขาบอกว่าเขาชอบพิซซ่า)</span>\n\"I <hi>am working</hi>.\" → She said she <hi>was working</hi>.\n<span class='trn'>(\"ฉันกำลังทำงาน\" → เธอบอกว่าเธอกำลังทำงาน)</span>",
tips:"เปลี่ยน pronoun ด้วย:\nI → he/she, my → his/her, we → they\nhere → there, now → then, today → that day, tomorrow → the next day"},

{en:"Reported Questions",th:"คำถามทางอ้อม",
desc:"เมื่อเปลี่ยนคำถามเป็น Reported Speech:\n1. <b>Yes/No questions</b> → ใช้ if / whether\n2. <b>Wh-questions</b> → ใช้ wh-word เดิม\n3. <b>เรียงเป็นประโยคบอกเล่า</b> (ไม่กลับ S กับ V)\n4. <b>ไม่ใส่ ?</b>",
formula:"Yes/No: \"Are you coming?\" → She asked if/whether I was coming.\nWh-: \"Where do you live?\" → He asked where I lived.",
ex:"\"<hi>Are</hi> you happy?\" → She asked <hi>if</hi> I <hi>was</hi> happy.\n<span class='trn'>(\"คุณมีความสุขไหม\" → เธอถามว่าฉันมีความสุขไหม)</span>\n\"<hi>Where do</hi> you live?\" → He asked <hi>where</hi> I <hi>lived</hi>.\n<span class='trn'>(\"คุณอยู่ที่ไหน\" → เขาถามว่าฉันอยู่ที่ไหน)</span>",
mis:"❌ He asked where <hi>did I live</hi>. (ผิด — ไม่กลับ do/did)\n✅ He asked where <hi>I lived</hi>."},

{en:"Reported Commands",th:"คำสั่ง/คำขอทางอ้อม",
desc:"เมื่อเปลี่ยนคำสั่ง/คำขอเป็น Reported Speech:\n\nใช้ <b>told/asked + someone + to + V1</b>\nปฏิเสธ: <b>told/asked + someone + not to + V1</b>",
formula:"คำสั่ง: \"Close the door.\" → She told me to close the door.\nคำขอ: \"Please help me.\" → He asked me to help him.\nปฏิเสธ: \"Don't go.\" → She told me not to go.",
ex:"\"<hi>Close</hi> the door.\" → She told me <hi>to close</hi> the door.\n<span class='trn'>(\"ปิดประตู\" → เธอบอกให้ฉันปิดประตู)</span>\n\"<hi>Don't be</hi> late.\" → He told me <hi>not to be</hi> late.\n<span class='trn'>(\"อย่ามาสาย\" → เขาบอกให้ฉันอย่ามาสาย)</span>"},
]},

{en:"Articles",th:"คำนำหน้านาม",items:[
{en:"a / an",th:"คำนำหน้าไม่เจาะจง",
desc:"ใช้กับ<b>นามนับได้เอกพจน์ที่ไม่ได้ระบุเจาะจง</b> (กล่าวถึงครั้งแรก)\n\n<b>a</b> ใช้ก่อน<b>เสียงพยัญชนะ</b>: a book, a cat, a university (ออกเสียง /juː/)\n<b>an</b> ใช้ก่อน<b>เสียงสระ</b>: an apple, an hour (h ไม่ออกเสียง), an MBA",
ex:"I saw <hi>a</hi> cat. <span class='trn'>(ฉันเห็นแมวตัวหนึ่ง — ไม่รู้ว่าตัวไหน)</span>\nShe is <hi>an</hi> engineer. <span class='trn'>(เธอเป็นวิศวกร)</span>\nHe waited for <hi>an</hi> hour. <span class='trn'>(เขารอ 1 ชั่วโมง — h ไม่ออกเสียง)</span>",
mis:"❌ She is <hi>a</hi> honest person. (ผิด — h ไม่ออกเสียง → ใช้ an)\n✅ She is <hi>an</hi> honest person.\n❌ It's <hi>an</hi> university. (ผิด — u ออกเสียง /juː/ → ใช้ a)\n✅ It's <hi>a</hi> university."},

{en:"the",th:"คำนำหน้าเจาะจง",
desc:"ใช้เมื่อ<b>ทั้งผู้พูดและผู้ฟังรู้ว่าหมายถึงอะไร</b>:\n\n1. <b>กล่าวถึงครั้งที่ 2</b>: I saw a cat. <b>The</b> cat was black.\n2. <b>มีหนึ่งเดียว</b>: the sun, the moon, the earth\n3. <b>ระบุด้วยส่วนขยาย</b>: the book on the table\n4. <b>Superlative</b>: the best, the tallest\n5. <b>บางชื่อเฉพาะ</b>: the USA, the Pacific Ocean",
ex:"I bought a book. <hi>The</hi> book is great. <span class='trn'>(ฉันซื้อหนังสือ หนังสือเล่มนั้นดีมาก)</span>\n<hi>The</hi> sun rises in the east. <span class='trn'>(ดวงอาทิตย์ขึ้นทางทิศตะวันออก)</span>\nShe is <hi>the</hi> best student. <span class='trn'>(เธอเป็นนักเรียนที่ดีที่สุด)</span>"},

{en:"Zero Article",th:"ไม่ใช้คำนำหน้า",
desc:"<b>ไม่ใช้</b> a/an/the เมื่อ:\n1. <b>นามนับไม่ได้/พหูพจน์ที่พูดทั่วไป</b>: Dogs are loyal.\n2. <b>ชื่อคน/ประเทศ</b> (ส่วนใหญ่): Thailand, John\n3. <b>มื้ออาหาร</b>: breakfast, lunch, dinner\n4. <b>กีฬา/วิชา</b>: football, mathematics\n5. <b>ภาษา</b>: English, Thai",
ex:"<hi>ø</hi> Love is beautiful. <span class='trn'>(ความรักงดงาม — พูดทั่วไป)</span>\nI have <hi>ø</hi> breakfast at 7. <span class='trn'>(ฉันกินอาหารเช้าตอน 7 โมง)</span>\nShe speaks <hi>ø</hi> English well. <span class='trn'>(เธอพูดภาษาอังกฤษเก่ง)</span>"},
]},

{en:"Relative Clauses",th:"อนุประโยคคุณศัพท์",items:[
{en:"Defining",th:"ที่จำเป็น (ระบุตัว)",
desc:"<b>Defining Relative Clause</b> = <b>จำเป็น</b>ต่อความหมาย ถ้าตัดออก จะไม่รู้ว่าพูดถึงใคร/อะไร\n\n• <b>ไม่ใช้ comma</b>\n• ใช้ who/which/<b>that</b> ได้หมด\n• สามารถละ relative pronoun ได้ถ้าทำหน้าที่เป็นกรรม",
ex:"The man <hi>who called you</hi> is my uncle. <span class='trn'>(ผู้ชายที่โทรหาคุณคือลุงฉัน — ถ้าตัดออกจะไม่รู้ว่าผู้ชายคนไหน)</span>\nThe book <hi>(that) I bought</hi> is good. <span class='trn'>(หนังสือที่ฉันซื้อดี — ละ that ได้เพราะเป็นกรรม)</span>"},

{en:"Non-Defining",th:"ที่ไม่จำเป็น (เสริมข้อมูล)",
desc:"<b>Non-Defining Relative Clause</b> = <b>เสริมข้อมูลเพิ่ม</b> ตัดออกก็ยังรู้ว่าพูดถึงใคร\n\n• <b>ใช้ comma คั่น</b>\n• <b>ห้ามใช้ that</b> (ใช้ who/which เท่านั้น)\n• <b>ห้ามละ</b> relative pronoun",
ex:"My sister<hi>, who lives in London,</hi> is visiting. <span class='trn'>(น้องสาวฉัน ซึ่งอยู่ลอนดอน กำลังมาเยี่ยม — ตัดออกก็รู้ว่าพูดถึงน้องสาว)</span>\nParis<hi>, which is the capital of France,</hi> is beautiful. <span class='trn'>(ปารีส ซึ่งเป็นเมืองหลวงของฝรั่งเศส สวยงาม)</span>",
mis:"❌ My sister, <hi>that</hi> lives in London, is visiting. (ผิด — non-defining ห้ามใช้ that)\n✅ My sister, <hi>who</hi> lives in London, is visiting."},
]},
]},

// ══════════════════════════════════════
// 6. PUNCTUATION
// ══════════════════════════════════════
{id:6,en:"Punctuation",th:"เครื่องหมายวรรคตอนและการเขียน",branches:[
{en:"End Marks",th:"เครื่องหมายจบประโยค",items:[
{en:"Period (.)",th:"มหัพภาค (จุด)",
desc:"ใช้<b>จบประโยคบอกเล่า</b>และ<b>คำสั่ง</b>\n\nทุกประโยคบอกเล่าต้องจบด้วย period\nยังใช้ในคำย่อ: Mr., Dr., U.S.A.",
ex:"She is a teacher<hi>.</hi> <span class='trn'>(เธอเป็นครู)</span>\nPlease sit down<hi>.</hi> <span class='trn'>(กรุณานั่ง — คำสั่ง)</span>\nI live in Bangkok<hi>.</hi> <span class='trn'>(ฉันอยู่กรุงเทพฯ)</span>"},
{en:"Question Mark (?)",th:"ปรัศนี (เครื่องหมายคำถาม)",
desc:"ใช้<b>จบประโยคคำถาม</b> — ทั้ง Yes/No questions และ Wh-questions\n\nห้ามใช้กับ Indirect Question (คำถามทางอ้อม)",
ex:"Where are you<hi>?</hi> <span class='trn'>(คุณอยู่ไหน?)</span>\nDo you like coffee<hi>?</hi> <span class='trn'>(คุณชอบกาแฟไหม?)</span>",
mis:"❌ I wonder where he is<hi>?</hi> (ผิด — เป็น indirect question)\n✅ I wonder where he is<hi>.</hi> (ถูก — จบด้วย period)"},
{en:"Exclamation Mark (!)",th:"อัศเจรีย์",
desc:"ใช้แสดง<b>อารมณ์รุนแรง</b> ความตกใจ ตื่นเต้น โกรธ ดีใจ\n\nใช้กับคำอุทาน (Interjections) และประโยคอุทาน\n\nไม่ควรใช้มากเกินไปในการเขียนทางการ",
ex:"What a beautiful day<hi>!</hi> <span class='trn'>(วันนี้สวยจัง!)</span>\nStop<hi>!</hi> <span class='trn'>(หยุด!)</span>\nWow<hi>!</hi> That's amazing<hi>!</hi> <span class='trn'>(ว้าว! สุดยอดเลย!)</span>"},
]},

{en:"Comma (,)",th:"จุลภาค (คอมมา)",items:[
{en:"Comma Rules",th:"กฎสำคัญ",
desc:"<b>Comma</b> ใช้ในหลายกรณี:\n\n1. <b>คั่นรายการ</b> 3 อย่างขึ้นไป\n2. <b>ก่อน FANBOYS</b> ที่เชื่อม 2 ประโยค\n3. <b>หลัง introductory phrase</b> (วลีนำ)\n4. <b>คั่น non-defining clause</b>\n5. <b>คั่นคำเรียกขาน</b>",
ex:"I bought apples<hi>,</hi> oranges<hi>,</hi> and grapes. <span class='trn'>(คั่นรายการ)</span>\nI like tea<hi>,</hi> but she likes coffee. <span class='trn'>(ก่อน but — FANBOYS)</span>\nAfter dinner<hi>,</hi> we watched a movie. <span class='trn'>(หลังวลีนำ)</span>\nHello<hi>,</hi> John. <span class='trn'>(คำเรียกขาน)</span>",
tips:"ไม่ใช้ comma ก่อน because ในกรณีส่วนใหญ่:\n✅ I stayed home because it rained. (ไม่ต้อง comma)\n\nใช้ comma เมื่อ because clause อยู่หน้า:\n✅ Because it rained<b>,</b> I stayed home."},
{en:"Oxford Comma",th:"จุลภาคอ็อกซ์ฟอร์ด",
desc:"Comma ก่อน <b>and/or</b> ในรายการ 3+ อย่าง — ไม่บังคับแต่<b>แนะนำใช้</b>เพราะช่วยลดความกำกวม\n\nตัวอย่างที่เห็นความต่าง:\n❌ ไม่มี Oxford Comma: I love my parents, Batman and Wonder Woman.\n(อาจหมายถึงพ่อแม่คือ Batman กับ Wonder Woman!)\n✅ มี Oxford Comma: I love my parents, Batman, and Wonder Woman.\n(ชัดเจนว่า 3 อย่าง)",
ex:"Red<hi>,</hi> white<hi>,</hi> and blue. <span class='trn'>(แดง, ขาว, และน้ำเงิน)</span>"},
]},

{en:"Semicolon & Colon",th:"อัฒภาค/ทวิภาค",items:[
{en:"Semicolon (;)",th:"อัฒภาค",
desc:"ใช้เชื่อม <b>2 ประโยคสมบูรณ์ที่เกี่ยวข้องกัน</b> โดยไม่ใช้ conjunction\n\nเหมือน comma ที่แข็งแรงขึ้น หรือ period ที่เบาลง\n\nยังใช้ก่อน transitional words: however, therefore, moreover, furthermore",
ex:"She loves reading<hi>;</hi> he prefers sports. <span class='trn'>(เธอชอบอ่าน เขาชอบกีฬา — 2 ประโยคที่เกี่ยวกัน)</span>\nI was tired<hi>;</hi> however, I kept working. <span class='trn'>(ฉันเหนื่อย แต่อย่างไรก็ตามฉันทำงานต่อ)</span>"},
{en:"Colon (:)",th:"ทวิภาค",
desc:"ใช้<b>นำเสนอ</b>สิ่งต่อไปนี้:\n1. <b>รายการ</b>: You need three things: pen, paper, focus.\n2. <b>คำอธิบาย</b>: There's one problem: money.\n3. <b>คำพูด</b>: She said: \"Go away.\"\n\nสิ่งที่อยู่ก่อน colon ต้องเป็นประโยคสมบูรณ์",
ex:"You need<hi>:</hi> pen, paper, and focus. <span class='trn'>(คุณต้องการ: ปากกา กระดาษ และสมาธิ)</span>\nHere's the truth<hi>:</hi> it's not easy. <span class='trn'>(ความจริงคือ: มันไม่ง่าย)</span>"},
]},

{en:"Apostrophe",th:"อะพอสทรอฟี (')",items:[
{en:"Apostrophe — เจ้าของ",th:"แสดงความเป็นเจ้าของ",
desc:"ใช้แสดง<b>ความเป็นเจ้าของ</b>:\n\n<b>เอกพจน์:</b> เติม <b>'s</b> → John's book\n<b>พหูพจน์ที่ลงท้าย s:</b> เติม <b>'</b> → the students' books\n<b>พหูพจน์ที่ไม่ลงท้าย s:</b> เติม <b>'s</b> → children's toys",
ex:"<hi>John's</hi> car is red. <span class='trn'>(รถของจอห์นสีแดง)</span>\nThe <hi>students'</hi> homework is due. <span class='trn'>(การบ้านของนักเรียนส่งวันนี้)</span>\nThe <hi>children's</hi> room is messy. <span class='trn'>(ห้องของเด็กๆ รก)</span>"},
{en:"It's vs Its",th:"แยก It's กับ Its",
desc:"<b>คู่ที่สับสนมากที่สุด</b>ในภาษาอังกฤษ:\n\n<b>It's</b> = <b>It is</b> หรือ <b>It has</b> (ย่อ — มี apostrophe)\n<b>Its</b> = <b>ของมัน</b> (possessive — ไม่มี apostrophe)\n\nวิธีทดสอบ: ลองเปลี่ยนเป็น \"it is\" ถ้าได้ → ใช้ it's",
ex:"<hi>It's</hi> raining. = <hi>It is</hi> raining. <span class='trn'>(ฝนกำลังตก)</span>\nThe cat licked <hi>its</hi> paw. <span class='trn'>(แมวเลียอุ้งเท้าของมัน — ของมัน ไม่มี ')</span>",
mis:"❌ <hi>Its</hi> a beautiful day. (ผิด — ต้องเป็น It is)\n✅ <hi>It's</hi> a beautiful day.\n❌ The dog wagged <hi>it's</hi> tail. (ผิด — it is tail ไม่ make sense)\n✅ The dog wagged <hi>its</hi> tail."},
]},

{en:"Hyphen & Dash",th:"ยัติภังค์/ยัติภาค",items:[
{en:"Hyphen (-)",th:"ยัติภังค์ (สั้น)",
desc:"ใช้<b>เชื่อมคำ</b>ให้เป็นคำประสม โดยเฉพาะ <b>compound adjective ที่อยู่หน้านาม</b>\n\nยังใช้กับตัวเลข: twenty-one, thirty-five",
ex:"a <hi>well-known</hi> actor <span class='trn'>(นักแสดงที่มีชื่อเสียง)</span>\na <hi>10-year-old</hi> boy <span class='trn'>(เด็กชายอายุ 10 ปี)</span>\na <hi>full-time</hi> job <span class='trn'>(งานเต็มเวลา)</span>",
tips:"ใช้ hyphen เฉพาะเมื่ออยู่<b>หน้า</b>นาม:\n✅ a well<b>-</b>known actor\n✅ The actor is well known. (หลังนาม ไม่ต้อง hyphen)"},
{en:"Em Dash (—)",th:"ยัติภาคยาว",
desc:"ใช้แทน comma, colon, หรือวงเล็บ เพื่อ<b>เพิ่มน้ำหนัก</b>ให้ข้อความ\n\nใช้เน้นข้อมูลเพิ่มเติมหรือเปลี่ยนทิศทางประโยค\n\nพิมพ์: — (ยาวกว่า hyphen)",
ex:"She finally replied<hi>—</hi>after three long days. <span class='trn'>(เธอตอบในที่สุด — หลังจาก 3 วัน)</span>\nI need three things<hi>—</hi>time, money, and patience. <span class='trn'>(ฉันต้องการ 3 อย่าง — เวลา เงิน และความอดทน)</span>"},
]},

{en:"Quotation Marks",th:"อัญประกาศ (\" \")",items:[
{en:"Quotation Marks",th:"เครื่องหมายคำพูด",
desc:"ใช้<b>ล้อมรอบคำพูดตรง</b> (Direct Speech)\n\nยังใช้กับ:\n• ชื่อบทความ บทเพลง ตอนของรายการ\n• คำที่ใช้ในความหมายพิเศษ/เสียดสี\n\n<b>กฎ American English:</b> comma และ period อยู่ข้างในเครื่องหมาย\n<b>กฎ British English:</b> อยู่ข้างนอก (บางกรณี)",
ex:"She said<hi>,</hi> <hi>\"</hi>I'm happy.<hi>\"</hi> <span class='trn'>(เธอพูดว่า \"ฉันมีความสุข\")</span>\n<hi>\"</hi>Where are you going?<hi>\"</hi> he asked. <span class='trn'>(\"คุณจะไปไหน?\" เขาถาม)</span>\nHis <hi>\"</hi>friend<hi>\"</hi> wasn't really a friend. <span class='trn'>(\"เพื่อน\" ของเขาไม่ใช่เพื่อนจริงๆ — เสียดสี)</span>"},
]},
]},
];

function go(l,t,b){S={l,t:t??null,b:b??null};csht();rAll()}
function rAll(){rTb();rM();rN()}

function rTb(){
  const tb=document.getElementById('tb');
  const t=S.t!=null?D.find(d=>d.id===S.t):null;
  const b=(t&&S.b!=null)?t.branches[S.b]:null;
  let bk=S.l===0?'back hid':'back';
  let bf=S.l===2?`go(1,${S.t})`:S.l===1?'go(0)':'';
  let cr='<span onclick="go(0)" class="'+(S.l===0?'cur':'')+'">Grammar</span>';
  if(t){cr+=`<span class="sep">›</span><span onclick="go(1,${t.id})" class="${S.l===1?'cur':''}" style="color:${CR[t.id]}">${t.en}</span>`}
  if(b){cr+=`<span class="sep">›</span><span class="cur">${b.en}</span>`}
  tb.innerHTML=`<button class="${bk}" onclick="${bf}">‹</button><div class="cr">${cr}</div>`;
}
function rN(){
  const n=document.getElementById('tn');
  n.innerHTML=D.map(d=>{
    const on=S.t===d.id;
    return `<div class="ch${on?' on':''}" style="color:${CR[d.id]};border-color:${CR[d.id]}${on?'':'44'};${on?'background:'+CR[d.id]+'25':''}" onclick="go(1,${d.id})">${d.en.replace(/ & .*/,'')}</div>`;
  }).join('');
}

// ═══════════════ MINDMAP ═══════════════
function rM(){
  const c=document.getElementById('mc');
  c.className='mm-c'+(S.l===2?' wide':'');
  requestAnimationFrame(()=>{
    const W=c.offsetWidth,H=c.offsetHeight;if(!W)return;
    const cx=W/2,cy=H/2;
    if(S.l===0)rHub(c,W,H,cx,cy);
    else if(S.l===1)rTopic(c,W,H,cx,cy);
    else rBranch(c,W,H,cx,cy);
  });
}
function bz(x1,y1,x2,y2,i){
  const mx=(x1+x2)/2,my=(y1+y2)/2,a=Math.atan2(y2-y1,x2-x1),pa=a+Math.PI/2;
  const off=(i%2===0?1:-1)*Math.min(20,Math.hypot(x2-x1,y2-y1)*.1);
  return `M${x1},${y1} Q${mx+Math.cos(pa)*off},${my+Math.sin(pa)*off} ${x2},${y2}`;
}
function rHub(c,W,H,cx,cy){
  const r=Math.min(W,H)*.37,ag=[-90,-30,30,90,150,210];
  let s='',n='';
  n+=`<div class="mm-n nc" style="left:${cx}px;top:${cy}px;background:linear-gradient(135deg,${CR[3]},${CR[1]})">English<br>Grammar<div class="sub">แผนที่ไวยากรณ์</div></div>`;
  D.forEach((d,i)=>{
    const a=ag[i]*Math.PI/180,nx=cx+r*Math.cos(a),ny=cy+r*Math.sin(a);
    s+=`<path class="mm-line" style="animation-delay:${i*.06}s" stroke="${CR[d.id]}" d="${bz(cx,cy,nx,ny,i)}"/>`;
    n+=`<div class="mm-n nb" style="left:${nx}px;top:${ny}px;background:${CR[d.id]};box-shadow:0 3px 16px ${CR[d.id]}44;animation-delay:${.08+i*.06}s" onclick="go(1,${d.id})">${d.en}<div class="nth">${d.th}</div></div>`;
  });
  c.innerHTML=`<svg class="mm-svg" viewBox="0 0 ${W} ${H}">${s}</svg>${n}`;
}
function rTopic(c,W,H,cx,cy){
  const t=D.find(d=>d.id===S.t),nn=t.branches.length,r=Math.min(W,H)*(nn>6?.4:.37);
  let s='',n='';
  n+=`<div class="mm-n nc" style="left:${cx}px;top:${cy}px;background:${CR[t.id]};box-shadow:0 0 28px ${CR[t.id]}44">${t.en}<div class="sub">${t.th}</div></div>`;
  t.branches.forEach((b,i)=>{
    const a=(-90+i*(360/nn))*Math.PI/180,nx=cx+r*Math.cos(a),ny=cy+r*Math.sin(a);
    s+=`<path class="mm-line" style="animation-delay:${i*.05}s" stroke="${CR[t.id]}" d="${bz(cx,cy,nx,ny,i)}"/>`;
    n+=`<div class="mm-n nb" style="left:${nx}px;top:${ny}px;background:${CR[t.id]}dd;box-shadow:0 3px 12px ${CR[t.id]}33;animation-delay:${.06+i*.05}s" onclick="go(2,${t.id},${i})">${b.en}<div class="nth">${b.th} · ${b.items.length}</div></div>`;
  });
  c.innerHTML=`<svg class="mm-svg" viewBox="0 0 ${W} ${H}">${s}</svg>${n}`;
}
function rBranch(c,W,H,cx,cy){
  const t=D.find(d=>d.id===S.t),b=t.branches[S.b],nn=b.items.length,r=Math.min(W,H)*(nn>5?.4:.36);
  let s='',n='';
  n+=`<div class="mm-n nc" style="left:${cx}px;top:${cy}px;background:${CR[t.id]};box-shadow:0 0 28px ${CR[t.id]}44">${b.en}<div class="sub">${b.th}</div></div>`;
  b.items.forEach((it,i)=>{
    const a=(-90+i*(360/nn))*Math.PI/180,nx=cx+r*Math.cos(a),ny=cy+r*Math.sin(a);
    s+=`<path class="mm-line" style="animation-delay:${i*.05}s" stroke="${CL[t.id]}" d="${bz(cx,cy,nx,ny,i)}"/>`;
    n+=`<div class="mm-n nl" style="left:${nx}px;top:${ny}px;background:${CR[t.id]}cc;box-shadow:0 3px 12px ${CR[t.id]}22;animation-delay:${.06+i*.05}s" onclick="osht(${t.id},${S.b},${i})">${it.en}<div class="nth">${it.th}</div></div>`;
  });
  c.innerHTML=`<svg class="mm-svg" viewBox="0 0 ${W} ${H}">${s}</svg>${n}`;
}

// ═══════════════ SHEET ═══════════════
function osht(tid,bi,ii){
  const t=D.find(d=>d.id===tid),it=t.branches[bi].items[ii],c=CR[tid],cl=CL[tid];
  let h=`<div class="sh-hd"><h3 style="color:${cl}">${it.en}</h3><div class="sth">${it.th}</div></div><div class="sh-bd">`;
  // desc
  h+=`<div class="s-sec"><div class="s-label" style="color:${cl}"><em class="ico">📖</em> คำอธิบาย</div><div class="s-desc">${it.desc.replace(/\n/g,'<br>')}</div></div>`;
  // formula
  if(it.formula) h+=`<div class="s-sec"><div class="s-label" style="color:${cl}"><em class="ico">📐</em> โครงสร้าง</div><div class="s-form" style="border-color:${c}88;color:${cl}">${it.formula.replace(/\n/g,'<br>')}</div></div>`;
  // signal words
  if(it.signal) h+=`<div class="s-sec"><div class="s-label" style="color:${cl}"><em class="ico">🔑</em> คำบอกสัญญาณ</div><div class="s-sig">${it.signal.split(', ').map(w=>`<span style="background:${c}22;color:${cl}">${w}</span>`).join('')}</div></div>`;
  // examples
  if(it.ex) h+=`<div class="s-sec"><div class="s-label" style="color:${cl}"><em class="ico">📝</em> ตัวอย่าง</div><div class="s-ex" style="color:${cl}">${it.ex.replace(/\n/g,'<br>')}</div></div>`;
  // tips
  if(it.tips) h+=`<div class="s-sec"><div class="s-label" style="color:#5aad3e"><em class="ico">💡</em> เคล็ดลับ</div><div class="s-tip">${it.tips.replace(/\n/g,'<br>')}</div></div>`;
  // mistakes
  if(it.mis) h+=`<div class="s-sec"><div class="s-label" style="color:#cc7e4e"><em class="ico">⚠️</em> ข้อผิดพลาดที่พบบ่อย</div><div class="s-mis">${it.mis.replace(/\n/g,'<br>')}</div></div>`;
  // nav
  const items=t.branches[bi].items;
  let nv='<div class="sh-nav">';
  if(ii>0)nv+=`<button style="color:${cl};border-color:${c}44" onclick="osht(${tid},${bi},${ii-1})">‹ ${items[ii-1].en}</button>`;
  if(ii<items.length-1)nv+=`<button style="color:${cl};border-color:${c}44" onclick="osht(${tid},${bi},${ii+1})">${items[ii+1].en} ›</button>`;
  nv+='</div>';
  h+=nv+'</div>';
  document.getElementById('si').innerHTML=h;
  document.getElementById('ob').classList.add('show');
  document.getElementById('sh').classList.add('show');
  document.getElementById('sh').scrollTop=0;
}
function csht(){document.getElementById('ob').classList.remove('show');document.getElementById('sh').classList.remove('show')}

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(rM,120)});
rAll();
</script>
</body>
